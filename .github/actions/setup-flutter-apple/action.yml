name: Setup Flutter on an Apple runner
description: Prepare pinned Apple tooling and a checksum-verified Flutter SDK in task-owned local APFS storage.
inputs:
  flutter-version:
    description: Exact Flutter stable version.
    required: true
  hosted-xcode-version:
    description: Exact Xcode version installed on the selected hosted image.
    default: '26.5'
runs:
  using: composite
  steps:
    - name: Select the stable hosted Xcode toolchain
      if: runner.environment == 'github-hosted'
      shell: bash
      env:
        HOSTED_XCODE_VERSION: ${{ inputs.hosted-xcode-version }}
      run: |
        set -euo pipefail
        [[ "$HOSTED_XCODE_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
        developer_dir="/Applications/Xcode_${HOSTED_XCODE_VERSION}.app/Contents/Developer"
        test -d "$developer_dir"
        echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
        DEVELOPER_DIR="$developer_dir" xcodebuild -version
        if [[ "$HOSTED_XCODE_VERSION" == '26.3' ]]; then
          test "$(uname -m)" = arm64
          DEVELOPER_DIR="$developer_dir" xcodebuild -version | grep -Fx 'Build version 17C529'
          for sdk in iphoneos appletvos iphonesimulator appletvsimulator; do
            test "$(DEVELOPER_DIR="$developer_dir" xcrun --sdk "$sdk" --show-sdk-version)" = '26.2'
          done
        fi

    - name: Prepare the pinned Flutter SDK in local APFS cache
      shell: bash
      env:
        FLUTTER_VERSION: ${{ inputs.flutter-version }}
        FLUTTER_CACHE_ROOT: ${{ runner.temp }}/flutter-sdk
      run: |
        set -euo pipefail
        python3 scripts/cache_macos_flutter_sdk.py ensure \
          --version "$FLUTTER_VERSION" \
          --cache-root "$FLUTTER_CACHE_ROOT"

    - name: Add cached Flutter SDK to PATH
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        channel: stable
        flutter-version: ${{ inputs.flutter-version }}
        architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
        cache: false
        cache-path: ${{ runner.temp }}/flutter-sdk/stable-${{ inputs.flutter-version }}-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
        pub-cache: false
