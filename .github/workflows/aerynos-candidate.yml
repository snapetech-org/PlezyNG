name: Build aerynOS source candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact canonical main commit (empty selects this workflow revision)
        type: string
        required: false
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Linux x64 source snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: snapetech-org/pleazyng
          ref: ${{ inputs.source_sha || github.sha }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: snapetech-org/pleazyng
          ref: main
          path: tooling
          persist-credentials: false
          sparse-checkout: |
            scripts/aerynos
      - name: Resolve trusted source and canonical build dependencies
        id: config
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re,subprocess
          root=pathlib.Path('source')
          sha=subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()
          subprocess.run(['gh','api',f'repos/snapetech-org/pleazyng/compare/{sha}...main'],check=True,stdout=open('ancestry.json','w'))
          comparison=json.loads(pathlib.Path('ancestry.json').read_text())
          if comparison['status'] not in ('ahead','identical'):
              raise SystemExit('Source is not on canonical main')
          workflow=(root/'.github/workflows/build.yml').read_text()
          version=re.search(r'^  FLUTTER_VERSION: "([^"]+)"',workflow,re.M).group(1)
          packages=re.search(r'^  LINUX_APT_PACKAGES: >\n((?:    .+\n)+)',workflow,re.M).group(1)
          pathlib.Path('apt-packages.txt').write_text(' '.join(packages.split())+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'flutter={version}\nsha={sha}\n')
          PY
          df -h .
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.config.outputs.flutter }}
          cache: true
          pub-cache: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/plezyng/dv-tools
            ~/.cache/pleazyng-native-downloads
            source/libmpv-prefix
          key: aerynos-linux-${{ runner.arch }}-${{ hashFiles('source/pubspec.lock', 'source/mpv-build.lock.json', 'source/tools/dv-engine/offline-runtime.lock.json') }}
      - name: Install canonical Linux build dependencies
        run: |
          sudo python3 source/scripts/configure_hosted_apt.py '${{ runner.environment }}'
          sudo apt-get update -o Acquire::Retries=3
          read -r -a packages < apt-packages.txt
          sudo apt-get install -y -o Acquire::Retries=3 "${packages[@]}" python3 zstd patchelf
      - name: Build ordinary release bundle and source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tooling/scripts/aerynos/build_candidate.sh source "$RUNNER_TEMP/candidate"
      - name: Retain exact candidate for native qualification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aerynos-candidate-${{ steps.config.outputs.sha }}
          path: ${{ runner.temp }}/candidate/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
