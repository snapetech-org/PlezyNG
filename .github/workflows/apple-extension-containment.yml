name: Apple extension containment
on:
  push:
    branches: [main]
    paths: ['scripts/games/*apple*', 'scripts/games/*extension*', '.github/workflows/apple-extension-containment.yml', 'native/games/romm/**', 'ios/Podfile', 'ios/Runner/AppDelegate.swift']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk-contract:
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/games/inspect_apple_extension_sdk.py
      - name: Compile real iOS extension and native worker
        run: python3 scripts/games/verify_apple_worker.py
      - name: Verify Xcode extension packaging and production linkage
        run: ruby scripts/games/verify_apple_worker_package.rb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: romm-extension-sdk-contract
          path: build/romm-extension-sdk
          if-no-files-found: error
          retention-days: 14
