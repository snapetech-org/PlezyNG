name: Apple signing material preflight
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-signing-material-preflight
  cancel-in-progress: false

jobs:
  signing-material:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Check private-key import and current bundle profile bindings
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TVOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.TVOS_PROVISIONING_PROFILE_BASE64 }}
          TVOS_TOPSHELF_PROVISIONING_PROFILE_BASE64: ${{ secrets.TVOS_TOPSHELF_PROVISIONING_PROFILE_BASE64 }}
        run: python3 scripts/check_apple_signing_material.py --require-profiles --report "$RUNNER_TEMP/apple-signing-public-report.json"
      - name: Retain only the public signing report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apple-signing-public-report
          path: ${{ runner.temp }}/apple-signing-public-report.json
          if-no-files-found: error
          retention-days: 7
