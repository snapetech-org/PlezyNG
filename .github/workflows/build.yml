# ng-runner-policy: hosted-first-v1
# The trusted-main hybrid profile uses standard hosted runners for compatible Linux, Android, Windows, Apple, and pinned Tizen builds; storage-heavy WebOS remains private JIT.
# packer-windows-jit-v1
name: Pleazyng Release
run-name: ${{ inputs.recovery_source_sha != '' && format('action:{0}:pool:{1}:tag:v{2}:repair:{3}', inputs.action, inputs.runner_pool, inputs.build_version, inputs.recovery_source_sha) || inputs.action == 'release' && format('action:{0}:pool:{1}:tag:v{2}', inputs.action, inputs.runner_pool, inputs.build_version) || inputs.action == 'build' && inputs.mode == 'release' && inputs.build_version != '' && format('action:{0}:pool:{1}:mode:{2}:version:{3}', inputs.action, inputs.runner_pool, inputs.mode, inputs.build_version) || format('action:{0}:pool:{1}', inputs.action, inputs.runner_pool) }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Build artifacts, create/update the draft release, or qualify iOS signing profiles without an app build
        required: true
        type: choice
        options:
          - build
          - release
          - apple-signing-preflight
      runner_pool:
        description: Private JIT pool for jobs that need constrained resources
        required: true
        type: choice
        options:
          - private
      execution_profile:
        description: Use standard hosted runners for compatible trusted-main jobs; reserve private JIT for webOS and explicit constrained builds
        required: true
        type: choice
        options:
          - private
          - hybrid
        default: hybrid
      mode:
        description: Select all release platforms or a platform-specific validation build
        required: true
        type: choice
        options:
          - release
          - webos-validation
          - macos-validation
          - android-validation
        default: release
      build_version:
        description: Semantic version for artifact names; releases reuse a tag on main only when later commits contain allowlisted release infrastructure changes
        required: false
        type: string
      candidate_ref:
        description: Hold a captured main release until exact-source candidate CI passes and its stable tag exists
        required: false
        type: string
      tvos_runner_pool:
        description: Use private Apple Silicon hardware for targeted iOS or tvOS recovery when hosted capacity or time cannot meet the build requirement
        required: false
        type: choice
        options: [hosted, private]
        default: hosted
      macos_compilation_job_id:
        description: Recover a verified same-product Mac compilation for signing-only macos-validation
        required: false
        type: string
      reuse_macos_package_run_id:
        description: Reuse a qualified Mac signing-only recovery with all other original platform artifacts
        required: false
        type: string
      reuse_android_run_id:
        description: Reuse a separately successful Android release artifact with verified platform recovery
        required: false
        type: string
      rebuild_macos:
        description: Build and qualify a fresh Mac package during verified platform recovery
        type: boolean
        required: false
        default: false
      rebuild_ios:
        description: Rebuild the iOS developer package during verified platform recovery
        type: boolean
        required: false
        default: false
      rebuild_tvos:
        description: Rebuild tvOS on a compatible ARM host during verified platform recovery
        type: boolean
        required: false
        default: false
      rebuild_linux:
        description: Rebuild both Linux architectures during verified platform recovery
        type: boolean
        required: false
        default: false
      reuse_webos_run_id:
        description: Reuse a successful verified webOS package for assembly without rebuilding it
        required: false
        type: string
      reuse_repaired_run_id:
        description: Reuse signed Apple sibling runs (tvos:ID,ios:ID), or legacy repaired Linux and Mac outputs
        required: false
        type: string
      reuse_platform_run_id:
        description: Recover verified passing platform artifacts from the same product source; rebuild Android and WebOS
        required: false
        type: string
      recovery_source_sha:
        description: Exact reviewed packaging repair on main's ancestry; never compile moving main
        required: false
        type: string
      recovery_product_sha:
        description: Immutable qualified product source bound to the original release run and tag
        required: false
        type: string
      include_webos_build:
        description: Build and verify the experimental ARM webOS candidate in this workflow run
        required: true
        type: boolean
        default: true
      include_webos_release:
        description: >-
          Include the verified LG webOS IPK in the complete versioned release.
        required: true
        type: boolean
        default: true
      include_tizen_build:
        description: Build the experimental ARM Samsung Tizen tester candidate in this workflow run
        required: true
        type: boolean
        default: true
      include_apple_store_build:
        description: Opt in to signed iOS and tvOS App Store IPAs; GitHub-only releases use unsigned developer IPAs
        required: true
        type: boolean
        default: false
      subtitle_gpu_backend:
        description: Opt-in Whisper backend; Vulkan builds Windows/Linux x64, CUDA builds Windows x64; release publishing stays CPU-only
        required: true
        type: choice
        options:
          - cpu
          - vulkan
          - cuda
        default: cpu
      prepare_homebrew_cask:
        description: Require signed and notarized macOS validation; on release runs, also generate a Homebrew Cask candidate
        required: true
        type: boolean
        default: false
env:
  GH_TOKEN: ${{ github.token }}
  # Keep SDK analytics failures separate from build and analysis diagnostics.
  DASH__SUPPRESS_ANALYTICS: "true"
  FLUTTER_SUPPRESS_ANALYTICS: "true"
  # Each setup step loads the immutable SDK manifest after checkout.
  TVOS_FLUTTER_VERSION: "3.47.1" # Pinned custom tvOS engine has this ABI.
  # Shared by every release build command.
  COMPILE_SOURCE_SHA: ${{ inputs.recovery_source_sha || github.sha }}
  RELEASE_DART_DEFINES: --dart-define=ENABLE_UPDATE_CHECK=true --dart-define=GIT_COMMIT=${{ inputs.recovery_product_sha || github.sha }}
  TRUSTED_BUILD_CACHE_VERSION: trusted-build-v1
  LINUX_APT_PACKAGES: >
    clang cmake meson ninja-build pkg-config nasm libgtk-3-dev libwebkit2gtk-4.1-dev libsecret-1-dev libevdev-dev liblzma-dev
    libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-libav gstreamer1.0-plugins-bad gstreamer1.0-plugins-good
    libstdc++-12-dev libasound2-dev libass-dev libfreetype-dev libfontconfig-dev libfribidi-dev
    libharfbuzz-dev libepoxy-dev libegl-dev libgl-dev libgnutls28-dev libpipewire-0.3-dev
    libva-dev libvdpau-dev libvulkan1 libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev
    libxss-dev libxpresent-dev libxkbcommon-dev libpulse-dev libdbus-1-dev libdrm-dev
    libdisplay-info-dev libgbm-dev libwayland-dev wayland-protocols liblcms2-dev libmujs-dev liblua5.2-dev
    ruby ruby-dev rubygems build-essential rpm libarchive-tools imagemagick libcurl4-openssl-dev

concurrency:
  group: ${{ inputs.action == 'apple-signing-preflight' && 'pleazyng-apple-signing-preflight' || (inputs.recovery_source_sha != '' && inputs.rebuild_tvos && !inputs.rebuild_ios && format('pleazyng-tvos-repair-{0}', inputs.build_version)) || 'pleazyng-core-release' }}
  cancel-in-progress: false

jobs:
  apple-signing-preflight:
    name: Qualify iOS worker signing material
    if: github.repository == 'snapetech-org/pleazyng' && github.ref == 'refs/heads/main' && inputs.action == 'apple-signing-preflight'
    runs-on: macos-26-intel
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare and validate only the iOS signing profiles
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: python3 scripts/build_apple_store_archive.py --prepare-ios-worker-profile --public-report "$RUNNER_TEMP/ios-profile-public-report.json"
      - name: Retain only the public profile qualification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-profile-public-report
          path: ${{ runner.temp }}/ios-profile-public-report.json
          if-no-files-found: error
          retention-days: 30

  capture-candidate:
    name: Validate captured source
    if: ${{ inputs.action == 'release' && inputs.candidate_ref != '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify candidate source and version before qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_TAG: v${{ inputs.build_version }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          CAPTURE_MODE: ${{ inputs.mode }}
          CAPTURE_PROFILE: ${{ inputs.execution_profile }}
          CAPTURE_POOL: ${{ inputs.runner_pool }}
        run: |
          test "$CAPTURE_MODE" = release
          test "$CAPTURE_PROFILE" = hybrid
          test "$CAPTURE_POOL" = private
          python3 scripts/verify_embedded_release_ci.py --candidate-only
          python3 tools/webos/verify_package.py --project-metadata
          python3 scripts/sync_native_revision.py --check

  release-ci:
    name: Release CI
    needs: capture-candidate
    if: ${{ needs.capture-candidate.result == 'success' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
    with:
      action: ci
      runner_pool: private
      execution_profile: hybrid
      build_linux_packages: true
      apple_runner_pool: ${{ inputs.tvos_runner_pool }}

  freeze-qualified-source:
    name: Freeze qualified source
    needs: [capture-candidate, release-ci]
    if: ${{ needs.capture-candidate.result == 'success' && needs.release-ci.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require every exact-source CI job before creating the stable tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_TAG: v${{ inputs.build_version }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: python3 scripts/verify_embedded_release_ci.py --create-tag --proof "$RUNNER_TEMP/release-source-qualification.json"
      - name: Retain exact-source qualification proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-source-qualification-${{ github.run_id }}
          path: ${{ runner.temp }}/release-source-qualification.json
          if-no-files-found: error

  validate-trusted-ref:
    name: Validate release request
    needs: freeze-qualified-source
    if: ${{ always() && inputs.runner_pool == 'private' && (inputs.action == 'build' || inputs.action == 'release') && (inputs.candidate_ref == '' || needs.freeze-qualified-source.result == 'success') }}
    runs-on: ${{ inputs.execution_profile == 'hybrid' && 'ubuntu-24.04' || fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-pleazyng","ng-main-run-{0}","gha-{0}-validate-trusted-ref"]}}', github.run_id)) }}
    outputs:
      action: ${{ steps.request.outputs.action }}
      runner_pool: ${{ steps.request.outputs.runner_pool }}
      execution_profile: ${{ steps.request.outputs.execution_profile }}
      mode: ${{ steps.request.outputs.mode }}
      release_tag: ${{ steps.request.outputs.release_tag }}
      release_commit: ${{ steps.release-tag.outputs.commit }}
      reuse_source_sha: ${{ steps.reuse-platforms.outputs.source_sha }}
      android_source_sha: ${{ steps.reuse-platforms.outputs.android_source_sha }}
      webos_source_sha: ${{ steps.reuse-platforms.outputs.webos_source_sha }}
      version: ${{ steps.request.outputs.version }}
      include_webos_build: ${{ steps.request.outputs.include_webos_build }}
      include_webos_release: ${{ steps.request.outputs.include_webos_release }}
      include_tizen_build: ${{ steps.request.outputs.include_tizen_build }}
      include_apple_store_build: ${{ steps.request.outputs.include_apple_store_build }}
      prepare_homebrew_cask: ${{ steps.request.outputs.prepare_homebrew_cask }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify approved frozen packaging checkout
        id: frozen-repair
        if: inputs.recovery_source_sha != '' || inputs.recovery_product_sha != ''
        env:
          PACKAGING_SHA: ${{ inputs.recovery_source_sha }}
          PRODUCT_SHA: ${{ inputs.recovery_product_sha }}
          SOURCE_RUN: ${{ inputs.reuse_platform_run_id }}
          ACTION: ${{ inputs.action }}
          MODE: ${{ inputs.mode }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, 'scripts')
          from verify_frozen_packaging_repair import verify_frozen_packaging_repair
          if (os.environ['GITHUB_REF'] != 'refs/heads/main' or os.environ['ACTION'] != 'release'
              or os.environ['MODE'] != 'release' or not os.environ['SOURCE_RUN'].isdigit()
              or os.environ['CANDIDATE_REF']):
              raise SystemExit('Frozen packaging repair requires an explicit trusted-main release recovery')
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path]))
          verify_frozen_packaging_repair(os.environ['PRODUCT_SHA'], os.environ['PACKAGING_SHA'],
                                        os.environ['GITHUB_SHA'], api)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('approved=true\n')
          PY

      - name: Check out the approved packaging source
        if: steps.frozen-repair.outputs.approved == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.recovery_source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require current verified fork native dependency
        if: steps.frozen-repair.outputs.approved != 'true'
        run: python3 scripts/sync_native_revision.py --check

      - name: Resolve release request
        id: request
        shell: bash
        env:
          ACTION_INPUT: ${{ inputs.action }}
          RUNNER_POOL_INPUT: ${{ inputs.runner_pool }}
          EXECUTION_PROFILE_INPUT: ${{ inputs.execution_profile }}
          MODE_INPUT: ${{ inputs.mode }}
          BUILD_VERSION_INPUT: ${{ inputs.build_version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INCLUDE_WEBOS_BUILD_INPUT: ${{ inputs.include_webos_build }}
          INCLUDE_WEBOS_RELEASE_INPUT: ${{ inputs.include_webos_release }}
          INCLUDE_TIZEN_BUILD_INPUT: ${{ inputs.include_tizen_build }}
          INCLUDE_APPLE_STORE_BUILD_INPUT: ${{ inputs.include_apple_store_build }}
          PREPARE_HOMEBREW_CASK_INPUT: ${{ inputs.prepare_homebrew_cask }}
          SUBTITLE_GPU_BACKEND_INPUT: ${{ inputs.subtitle_gpu_backend }}
          REUSE_PLATFORMS: ${{ inputs.reuse_platform_run_id }}
          REUSE_ANDROID: ${{ inputs.reuse_android_run_id }}
          MACOS_COMPILATION_JOB: ${{ inputs.macos_compilation_job_id }}
          MACOS_PACKAGE_RUN: ${{ inputs.reuse_macos_package_run_id }}
        run: |
          set -euo pipefail
          if [[ -n "$REUSE_ANDROID" && -z "$REUSE_PLATFORMS" ]]; then
            echo "Android reuse requires verified platform recovery." >&2
            exit 1
          fi
          if [[ -n "$MACOS_PACKAGE_RUN" ]] && { [[ ! "$MACOS_PACKAGE_RUN" =~ ^[0-9]+$ ]] || [[ -z "$REUSE_PLATFORMS" || "$REUSE_ANDROID" != "$REUSE_PLATFORMS" ]]; }; then
            echo "Mac package recovery requires the complete original platform and Android source run." >&2
            exit 1
          fi
          ACTION="$ACTION_INPUT"
          RUNNER_POOL="$RUNNER_POOL_INPUT"
          EXECUTION_PROFILE="$EXECUTION_PROFILE_INPUT"
          MODE="$MODE_INPUT"
          if [[ -n "$MACOS_COMPILATION_JOB" ]] && { [[ ! "$MACOS_COMPILATION_JOB" =~ ^[0-9]+$ ]] || [[ "$ACTION" != "build" || "$MODE" != "macos-validation" || "$PREPARE_HOMEBREW_CASK_INPUT" != "true" ]]; }; then
            echo "Compiled Mac recovery requires a numeric source job and signed macOS-only build validation." >&2
            exit 1
          fi
          SUBTITLE_GPU_BACKEND="$SUBTITLE_GPU_BACKEND_INPUT"
          INCLUDE_WEBOS_BUILD="$INCLUDE_WEBOS_BUILD_INPUT"
          INCLUDE_WEBOS_RELEASE="$INCLUDE_WEBOS_RELEASE_INPUT"
          INCLUDE_TIZEN_BUILD="$INCLUDE_TIZEN_BUILD_INPUT"
          INCLUDE_APPLE_STORE_BUILD="$INCLUDE_APPLE_STORE_BUILD_INPUT"
          PREPARE_HOMEBREW_CASK="$PREPARE_HOMEBREW_CASK_INPUT"
          if [[ "$ACTION" != "build" && "$ACTION" != "release" ]]; then
            echo "Unsupported action: $ACTION" >&2
            exit 1
          fi
          if [[ "$RUNNER_POOL" != "private" ]]; then
            echo "This workflow currently supports only the private runner pool." >&2
            exit 1
          fi
          if [[ "$EXECUTION_PROFILE" != "private" && "$EXECUTION_PROFILE" != "hybrid" ]]; then
            echo "Unsupported execution profile: $EXECUTION_PROFILE" >&2
            exit 1
          fi
          if [[ "$SUBTITLE_GPU_BACKEND" != "cpu" && "$SUBTITLE_GPU_BACKEND" != "vulkan" && "$SUBTITLE_GPU_BACKEND" != "cuda" ]]; then
            echo "Unsupported subtitle_gpu_backend: $SUBTITLE_GPU_BACKEND" >&2
            exit 1
          fi
          if [[ "$ACTION" == "release" && ( "$INCLUDE_WEBOS_BUILD" != "true" || "$INCLUDE_WEBOS_RELEASE" != "true" || "$INCLUDE_TIZEN_BUILD" != "true" || "$EXECUTION_PROFILE" != "hybrid" ) ]]; then
            echo "Versioned releases require webOS, Tizen and Windows ARM64. Use the complete hybrid platform matrix." >&2
            exit 1
          fi
          if [[ "$ACTION" == "release" && "$SUBTITLE_GPU_BACKEND" != "cpu" ]]; then
            echo "Release publishing uses the CPU Whisper baseline; GPU backends are available only to build runs." >&2
            exit 1
          fi
          if [[ "$MODE" != "release" && "$SUBTITLE_GPU_BACKEND" != "cpu" ]]; then
            echo "GPU subtitle backends are available only in full build mode." >&2
            exit 1
          fi
          if [[ "$MODE" != "release" && "$MODE" != "webos-validation" && "$MODE" != "macos-validation" && "$MODE" != "android-validation" ]]; then
            echo "Unsupported platform mode: $MODE" >&2
            exit 1
          fi
          if [[ "$MODE" == "webos-validation" && "$ACTION" != "build" ]]; then
            echo "webOS-only validation requires the build action." >&2
            exit 1
          fi
          if [[ "$MODE" == "android-validation" && "$ACTION" != "build" ]]; then
            echo "Android-only validation requires the build action." >&2
            exit 1
          fi
          if [[ "$MODE" == "macos-validation" && "$ACTION" != "build" ]]; then
            echo "macOS-only validation requires the build action." >&2
            exit 1
          fi
          if [[ "$ACTION" == "release" ]]; then
            VERSION="$BUILD_VERSION_INPUT"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "The release action requires build_version=MAJOR.MINOR.PATCH." >&2
              exit 1
            fi
            RELEASE_TAG="v$VERSION"
            if [[ ( "$REF_TYPE" != "branch" || "$REF_NAME" != "main" ) && ( "$REF_TYPE" != "tag" || "$REF_NAME" != "$RELEASE_TAG" ) ]]; then
              echo "The release action requires trusted main or its exact immutable version tag." >&2
              exit 1
            fi
          else
            RELEASE_TAG="$BUILD_VERSION_INPUT"
            if [[ -z "$RELEASE_TAG" && ( "$MODE" == "release" || "$MODE" == "macos-validation" ) ]]; then
              RELEASE_TAG=$(python3 scripts/pubspec_version.py pubspec.yaml)
              RELEASE_TAG=${RELEASE_TAG%%+*}
            fi
            VERSION="$RELEASE_TAG"
          fi
          if [[ "$EXECUTION_PROFILE" == "hybrid" && ( ( ( "$REF_TYPE" != "branch" || "$REF_NAME" != "main" ) && ( "$ACTION" != "release" || "$REF_TYPE" != "tag" || "$REF_NAME" != "$RELEASE_TAG" ) ) || ( "$MODE" != "release" && "$MODE" != "android-validation" && "$MODE" != "macos-validation" ) || "$SUBTITLE_GPU_BACKEND" != "cpu" ) ]]; then
            echo "The hybrid execution profile requires trusted main or the exact immutable release tag." >&2
            exit 1
          fi
          if [[ "$MODE" == "release" && "$EXECUTION_PROFILE" != "hybrid" ]]; then
            echo "Complete versioned releases require the hybrid profile so native Windows ARM64 CI and release artifacts are included." >&2
            exit 1
          fi
          if [[ "$PREPARE_HOMEBREW_CASK" != "true" && "$PREPARE_HOMEBREW_CASK" != "false" ]]; then
            echo "prepare_homebrew_cask must be true or false." >&2
            exit 1
          fi
          if [[ "$PREPARE_HOMEBREW_CASK" == "true" && "$MODE" != "release" && "$MODE" != "macos-validation" ]]; then
            echo "Signed Homebrew validation requires release or macos-validation mode." >&2
            exit 1
          fi
          if [[ "$MODE" == "macos-validation" && "$PREPARE_HOMEBREW_CASK" != "true" ]]; then
            echo "macos-validation mode requires prepare_homebrew_cask=true." >&2
            exit 1
          fi
          if [[ "$INCLUDE_APPLE_STORE_BUILD" != "true" && "$INCLUDE_APPLE_STORE_BUILD" != "false" ]]; then
            echo "include_apple_store_build must be true or false." >&2
            exit 1
          fi
          if [[ "$MODE" != "release" && "$INCLUDE_APPLE_STORE_BUILD" == "true" ]]; then
            echo "Signed App Store IPAs are available only in full release mode." >&2
            exit 1
          fi
          if [[ "$MODE" == "webos-validation" ]]; then
            RELEASE_TAG=""
            VERSION=""
            INCLUDE_WEBOS_BUILD=true
            INCLUDE_WEBOS_RELEASE=false
            INCLUDE_TIZEN_BUILD=false
            INCLUDE_APPLE_STORE_BUILD=false
          elif [[ "$MODE" == "android-validation" ]]; then
            INCLUDE_WEBOS_BUILD=false
            INCLUDE_WEBOS_RELEASE=false
            INCLUDE_TIZEN_BUILD=false
            INCLUDE_APPLE_STORE_BUILD=false
          elif [[ "$MODE" == "macos-validation" ]]; then
            INCLUDE_WEBOS_BUILD=false
            INCLUDE_WEBOS_RELEASE=false
            INCLUDE_TIZEN_BUILD=false
            INCLUDE_APPLE_STORE_BUILD=false
          elif [[ "$INCLUDE_WEBOS_RELEASE" != "true" && "$INCLUDE_WEBOS_RELEASE" != "false" ]]; then
            echo "include_webos_release must be true or false." >&2
            exit 1
          fi
          if [[ "$MODE" == "release" && "$INCLUDE_WEBOS_BUILD" != "true" && "$INCLUDE_WEBOS_BUILD" != "false" ]]; then
            echo "include_webos_build must be true or false." >&2
            exit 1
          fi
          if [[ "$MODE" == "release" && "$INCLUDE_TIZEN_BUILD" != "true" && "$INCLUDE_TIZEN_BUILD" != "false" ]]; then
            echo "include_tizen_build must be true or false." >&2
            exit 1
          fi
          if [[ "$MODE" == "release" && ( "$INCLUDE_WEBOS_BUILD" != "true" || "$INCLUDE_WEBOS_RELEASE" != "true" || "$INCLUDE_TIZEN_BUILD" != "true" ) ]]; then
            echo "Complete versioned builds require webOS and Tizen packages and release inclusion." >&2
            exit 1
          fi
          {
            echo "action=$ACTION"
            echo "runner_pool=$RUNNER_POOL"
            echo "execution_profile=$EXECUTION_PROFILE"
            echo "mode=$MODE"
            echo "release_tag=$RELEASE_TAG"
            echo "version=$VERSION"
            echo "include_webos_build=$INCLUDE_WEBOS_BUILD"
            echo "include_webos_release=$INCLUDE_WEBOS_RELEASE"
            echo "include_tizen_build=$INCLUDE_TIZEN_BUILD"
            echo "include_apple_store_build=$INCLUDE_APPLE_STORE_BUILD"
            echo "prepare_homebrew_cask=$PREPARE_HOMEBREW_CASK"
          } >> "$GITHUB_OUTPUT"

      - name: Summarize runner execution profile
        env:
          EXECUTION_PROFILE: ${{ steps.request.outputs.execution_profile }}
        run: |
          echo "Execution profile: **$EXECUTION_PROFILE** (broker pool: private)." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$EXECUTION_PROFILE" == "hybrid" ]]; then
            echo "Compatible Linux, Android, Tizen, Windows, and Apple jobs use standard GitHub-hosted runners; storage-heavy WebOS uses private JIT." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Require the main branch for builds
        if: ${{ inputs.action == 'build' }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Build actions may only run from refs/heads/main." >&2
            exit 1
          fi

      - name: Validate immutable release tag against trusted main
        id: release-tag
        if: ${{ inputs.action == 'release' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
          PACKAGING_SHA: ${{ inputs.recovery_source_sha }}
          PRODUCT_SHA: ${{ inputs.recovery_product_sha }}
          REPAIR_APPROVED: ${{ steps.frozen-repair.outputs.approved }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" && "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "Release actions require trusted main or the exact immutable release tag." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release actions require an exact vMAJOR.MINOR.PATCH tag." >&2
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          release_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          if ! git merge-base --is-ancestor "$release_commit" "$GITHUB_SHA"; then
            echo "Release tag $RELEASE_TAG is not an ancestor of dispatched main commit $GITHUB_SHA." >&2
            exit 1
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main; then
            echo "Release tags must point to a commit on main." >&2
            exit 1
          fi
          if [[ -n "$PACKAGING_SHA" ]]; then
            if [[ "$REPAIR_APPROVED" != true || "$release_commit" != "$PRODUCT_SHA" || "$(git rev-parse HEAD)" != "$PACKAGING_SHA" ]]; then
              echo "Approved packaging source is not bound to the immutable product tag." >&2
              exit 1
            fi
          else
          while IFS= read -r changed_file; do
            [[ -z "$changed_file" ]] && continue
            case "$changed_file" in
              webos/CMakeLists.txt)
                python3 scripts/verify_webos_link_patch.py "$release_commit" "$GITHUB_SHA"
                ;;
              .github/actions/setup-flutter-windows/action.yml|.github/workflows/build.yml|.github/workflows/ci.yml|.github/workflows/tizen.yml|AGENTS.md|CHANGELOG.md|CONTRIBUTING.md|docs/games/VALIDATION.md|docs/maintainers/apple-jit-runner.md|docs/maintainers/branch-consolidation-2026-10-27.md|docs/maintainers/capability-manifest.json|docs/maintainers/dv-platform-buildout.md|docs/maintainers/full-release-build.md|docs/maintainers/release-channels.md|docs/maintainers/tizen-tv.md|docs/plezyng/subtitles/PLAN.md|native/games/apple/SteamAppleSinkTests.mm|scripts/checks/check_build_workflow.py|scripts/checks/test_check_build_workflow.py|scripts/checks/test_release_ci_gate.py|scripts/checks/test_apple_jit_queue.py|scripts/launch_apple_jit_runner.sh|scripts/cleanup_apple_jit_derived_data.py|scripts/apple_jit_process_tree.py|scripts/cleanup_apple_jit_scratch.sh|scripts/checks/test_apple_jit_process_tree.py|scripts/copy_apple_jit_sources.py|scripts/checks/test_copy_apple_jit_sources.py|scripts/launch_queued_apple_jit_jobs.py|scripts/prepare_android_sdk.py|scripts/test_prepare_android_sdk.py|scripts/prepare_gradle_repositories.py|scripts/run_android_build.py|scripts/gradle/plezyng-maven-mirror.init.gradle|scripts/checks/test_prepare_gradle_repositories.py|scripts/recover_macos_app.py|scripts/test_recover_macos_app.py|scripts/apple/prepare_macos_app_for_signing.py|scripts/apple/test_prepare_macos_app_for_signing.py|scripts/checks/test_macos_validation_request.py|scripts/checks/test_macos_packaging_recovery.py|scripts/retain_macos_app.py|scripts/test_retain_macos_app.py|scripts/recover_release_platforms.py|scripts/checks/test_recover_release_platforms.py|scripts/release_all_platforms.py|scripts/refresh_apple_spm.sh|tools/reader-tests/README.md|tools/webos/package_ipk.py|tools/webos/verify_package.py|tools/webos/tests/test_package_ipk.py|scripts/tizen/package.py|scripts/tizen/test_package.py|scripts/ci_guard_checks.sh|scripts/prepare_native_downloads.py|scripts/test_prepare_native_downloads.py|scripts/checks/check_capability_manifest.py|scripts/checks/check_codegen.py|scripts/checks/test_check_codegen.py|windows/tool/install-patched-engine.ps1|windows/tool/download-pinned-mpv.ps1|windows/tool/download-pinned-simdutf.ps1|windows/tool/download-pinned-winsparkle.ps1|windows/tool/download-pinned-sdl3.ps1|windows/tool/download-pinned-torrent-dependencies.ps1|windows/tool/prepare-build-toolchain.ps1|tools/webos/build_release_candidate.sh|scripts/fetch_linux_libmpv.py|scripts/fetch_dv_tools.py|tools/webos/compatibility.json|tools/webos/build_ipk.sh|tools/webos/tests/test_source_ndk_environment.py|scripts/verify_webos_link_patch.py|scripts/test_verify_webos_link_patch.py|tools/webos/check_audio_plugin_syntax.sh|tools/webos/NATIVE-PREFLIGHT.md)
                ;;
              *)
                echo "Release tag $RELEASE_TAG differs from main in non-release source '$changed_file'; refusing to build mixed source." >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$release_commit" "$GITHUB_SHA")
          fi
          printf 'commit=%s\n' "$release_commit" >> "$GITHUB_OUTPUT"

      - name: Validate action and runner pool
        shell: bash
        env:
          ACTION: ${{ steps.request.outputs.action }}
          RUNNER_POOL: ${{ steps.request.outputs.runner_pool }}
          MODE: ${{ steps.request.outputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$ACTION" != "build" && "$ACTION" != "release" ]]; then
            echo "Unsupported action: $ACTION" >&2
            exit 1
          fi
          if [[ "$RUNNER_POOL" != "private" ]]; then
            echo "runner_pool must be 'private' for the broker route used by constrained jobs." >&2
            exit 1
          fi
          if [[ "$MODE" != "release" && "$MODE" != "webos-validation" && "$MODE" != "macos-validation" && "$MODE" != "android-validation" ]]; then
            echo "Unsupported platform mode: $MODE" >&2
            exit 1
          fi
          if [[ "$MODE" == "webos-validation" && "$ACTION" != "build" ]]; then
            echo "webOS-only validation requires the build action." >&2
            exit 1
          fi
          if [[ "$MODE" == "android-validation" && "$ACTION" != "build" ]]; then
            echo "Android-only validation requires the build action." >&2
            exit 1
          fi
          if [[ "$MODE" == "macos-validation" && "$ACTION" != "build" ]]; then
            echo "macOS-only validation requires the build action." >&2
            exit 1
          fi
          if [[ "${{ steps.request.outputs.include_webos_release }}" == "true" && "${{ steps.request.outputs.include_webos_build }}" != "true" ]]; then
            echo "A public webOS release requires building the webOS candidate." >&2
            exit 1
          fi


      - name: Validate release tag before building
        if: ${{ steps.request.outputs.mode == 'release' }}
        env:
          ACTION: ${{ steps.request.outputs.action }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(python3 scripts/pubspec_version.py pubspec.yaml)
          PACKAGE_VERSION=${PACKAGE_VERSION%%+*}
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use semantic versioning: $VERSION" >&2
            exit 1
          fi
          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match pubspec version $PACKAGE_VERSION." >&2
            exit 1
          fi
          if [[ "$ACTION" == "release" && "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]]; then
            echo "Selected release tag $RELEASE_TAG does not match v$PACKAGE_VERSION." >&2
            exit 1
          fi
          if [[ "$ACTION" == "build" && "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Requested build version $VERSION does not match pubspec version $PACKAGE_VERSION." >&2
            exit 1
          fi

      - name: Verify reusable platform source
        id: reuse-platforms
        if: ${{ inputs.reuse_platform_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD_LINUX: ${{ inputs.rebuild_linux }}
          REBUILD_MACOS: ${{ inputs.rebuild_macos }}
          REBUILD_TVOS: ${{ inputs.rebuild_tvos }}
          REBUILD_IOS: ${{ inputs.rebuild_ios }}
          REPAIRED_RUN: ${{ inputs.reuse_repaired_run_id }}
          WEBOS_RUN: ${{ inputs.reuse_webos_run_id }}
          SOURCE_RUN: ${{ inputs.reuse_platform_run_id }}
          ANDROID_RUN: ${{ inputs.reuse_android_run_id }}
          MACOS_RUN: ${{ inputs.reuse_macos_package_run_id }}
          HEAD_SHA: ${{ inputs.recovery_source_sha || github.sha }}
          PACKAGING_SHA: ${{ inputs.recovery_source_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          VERSION: ${{ steps.request.outputs.version }}
          ACTION: ${{ steps.request.outputs.action }}
          PROFILE: ${{ steps.request.outputs.execution_profile }}
          MODE: ${{ steps.request.outputs.mode }}
          BACKEND: ${{ inputs.subtitle_gpu_backend }}
          APPLE_STORE: ${{ steps.request.outputs.include_apple_store_build }}
          HOMEBREW: ${{ steps.request.outputs.prepare_homebrew_cask }}
          WEBOS_RELEASE: ${{ steps.request.outputs.include_webos_release }}
          WEBOS_BUILD: ${{ steps.request.outputs.include_webos_build }}
          TIZEN_BUILD: ${{ steps.request.outputs.include_tizen_build }}
        run: |
          set -euo pipefail
          if [[ "$ACTION" != release || "$PROFILE" != hybrid || "$MODE" != release || "$BACKEND" != cpu || ( "$APPLE_STORE" != false && -z "$PACKAGING_SHA" ) || "$WEBOS_RELEASE" != true || "$WEBOS_BUILD" != true || "$TIZEN_BUILD" != true ]]; then
            echo "Artifact recovery requires the complete hybrid CPU GitHub-only release profile." >&2
            exit 1
          fi
          options=()
          if [[ -n "$PACKAGING_SHA" ]]; then options+=(--packaging-source-sha "$PACKAGING_SHA" --workflow-source-sha "$WORKFLOW_SHA"); fi
          if [[ "$APPLE_STORE" == true ]]; then options+=(--include-apple-store-build); fi
          if [[ "$REBUILD_LINUX" == true ]]; then options+=(--rebuild-linux); fi
          if [[ "$REBUILD_MACOS" == true ]]; then options+=(--rebuild-macos); fi
          if [[ "$REBUILD_TVOS" == true ]]; then options+=(--rebuild-tvos); fi
          if [[ "$REBUILD_IOS" == true ]]; then options+=(--rebuild-ios); fi
          if [[ -n "$REPAIRED_RUN" ]]; then
            if [[ -n "$PACKAGING_SHA" ]]; then
              if [[ "$REPAIRED_RUN" =~ ^tvos:([1-9][0-9]*),ios:([1-9][0-9]*)$ ]]; then
                options+=(--tvos-run "${BASH_REMATCH[1]}" --ios-run "${BASH_REMATCH[2]}")
              elif [[ "$REPAIRED_RUN" =~ ^[1-9][0-9]*$ ]]; then
                options+=(--tvos-run "$REPAIRED_RUN")
              else
                echo "Invalid signed Apple sibling source identities." >&2
                exit 1
              fi
            else
              options+=(--repaired-run "$REPAIRED_RUN")
            fi
          fi
          if [[ -n "$WEBOS_RUN" ]]; then options+=(--webos-run "$WEBOS_RUN"); fi
          if [[ "$HOMEBREW" == true ]]; then options+=(--require-homebrew-cask); fi
          if [[ -n "$ANDROID_RUN" ]]; then options+=(--android-run "$ANDROID_RUN"); fi
          if [[ -n "$MACOS_RUN" ]]; then options+=(--macos-run "$MACOS_RUN"); fi
          if [[ "$WEBOS_BUILD" != true ]]; then options+=(--skip-webos-build); fi
          python3 scripts/recover_release_platforms.py "$SOURCE_RUN" --head-sha "$HEAD_SHA" --version "$VERSION" --allow-building "${options[@]}"

      - name: Require successful CI for this commit
        if: ${{ steps.request.outputs.mode == 'release' && steps.request.outputs.action == 'release' && inputs.reuse_platform_run_id == '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.release-tag.outputs.commit }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ (inputs.candidate_ref != '' || github.ref_type == 'tag') && steps.request.outputs.release_tag || '' }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          if [[ -n "$CANDIDATE_REF" ]]; then
            python3 scripts/verify_embedded_release_ci.py
          else
            python3 scripts/verify_release_ci.py
          fi

      - name: Validate webOS package metadata
        if: ${{ steps.request.outputs.mode == 'release' }}
        run: python3 tools/webos/verify_package.py --project-metadata

      - name: Validate webOS-only mode input
        if: ${{ steps.request.outputs.mode == 'webos-validation' }}
        run: |
          echo "This manual run builds only the WebOS ARM package on the private Linux JIT route."
          echo "No draft release is created."

      - name: Validate Android-only mode input
        if: ${{ steps.request.outputs.mode == 'android-validation' }}
        run: |
          echo "Build the signed Fire TV APK only; no release or store submission."

      - name: Validate macOS-only mode input
        if: ${{ steps.request.outputs.mode == 'macos-validation' }}
        run: |
          echo "This manual run builds only the macOS app and checks signing, notarization, and Gatekeeper."
          echo "No draft release is created."

  build-android:
    if: ${{ always() && !cancelled() && needs.validate-trusted-ref.result == 'success' && inputs.reuse_android_run_id == '' && inputs.runner_pool == 'private' && (inputs.action == 'build' || inputs.action == 'release') && needs.validate-trusted-ref.outputs.runner_pool == 'private' && (needs.validate-trusted-ref.outputs.action == 'build' || needs.validate-trusted-ref.outputs.action == 'release') && (needs.validate-trusted-ref.outputs.mode == 'release' || needs.validate-trusted-ref.outputs.mode == 'android-validation') }}
    needs: validate-trusted-ref
    timeout-minutes: 360
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    runs-on: ${{ needs.validate-trusted-ref.outputs.execution_profile == 'hybrid' && 'ubuntu-24.04' || fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-pleazyng","ng-main-run-{0}","gha-{0}-build-android"]}}', github.run_id)) }}
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.recovery_source_sha || github.sha }}
          persist-credentials: false

      - name: Setup Java
        if: ${{ (needs.validate-trusted-ref.outputs.mode == 'release' || needs.validate-trusted-ref.outputs.mode == 'android-validation') }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configure Java downloads for the private JIT proxy
        if: ${{ (needs.validate-trusted-ref.outputs.mode == 'release' || needs.validate-trusted-ref.outputs.mode == 'android-validation') && needs.validate-trusted-ref.outputs.execution_profile != 'hybrid' }}
        run: python3 scripts/prepare_android_sdk.py proxy

      - name: Restore Android FFmpeg source cache
        id: ffmpeg-source-cache
        if: ${{ (needs.validate-trusted-ref.outputs.mode == 'release' || needs.validate-trusted-ref.outputs.mode == 'android-validation') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/pleazyng-ffmpeg-source
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-ffmpeg-source-${{ hashFiles('android/app/build.gradle.kts') }}

      - name: Prepare verified Android FFmpeg source archive
        if: ${{ (needs.validate-trusted-ref.outputs.mode == 'release' || needs.validate-trusted-ref.outputs.mode == 'android-validation') }}
        shell: bash
        env:
          PLEZY_EXECUTION_PROFILE: ${{ needs.validate-trusted-ref.outputs.execution_profile }}
        run: |
          if [[ "$PLEZY_EXECUTION_PROFILE" == "hybrid" ]]; then
            python3 scripts/prepare_android_ffmpeg_source.py --direct-egress "$RUNNER_TEMP/pleazyng-ffmpeg-source/ffmpeg-9.0.2.tar.xz"
          else
            python3 scripts/prepare_android_ffmpeg_source.py "$RUNNER_TEMP/pleazyng-ffmpeg-source/ffmpeg-9.0.2.tar.xz"
          fi

      - name: Save Android FFmpeg source cache
        if: ${{ (needs.validate-trusted-ref.outputs.mode == 'release' || needs.validate-trusted-ref.outputs.mode == 'android-validation') && steps.ffmpeg-source-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/pleazyng-ffmpeg-source
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-ffmpeg-source-${{ hashFiles('android/app/build.gradle.kts') }}

      - name: Setup Android SDK
        if: ${{ (needs.validate-trusted-ref.outputs.mode == 'release' || needs.validate-trusted-ref.outputs.mode == 'android-validation') }}
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false

      - name: Install the pinned Android SDK, NDK, and CMake
        if: ${{ (needs.validate-trusted-ref.outputs.mode == 'release' || needs.validate-trusted-ref.outputs.mode == 'android-validation') && needs.validate-trusted-ref.outputs.execution_profile != 'hybrid' }}
        run: python3 scripts/prepare_android_sdk.py install

      - name: Install pinned Android SDK, NDK, and CMake with direct egress
        if: ${{ (needs.validate-trusted-ref.outputs.mode == 'release' || needs.validate-trusted-ref.outputs.mode == 'android-validation') && needs.validate-trusted-ref.outputs.execution_profile == 'hybrid' }}
        run: python3 scripts/prepare_android_sdk.py install --direct-egress

      - name: Load pinned Flutter SDK
        if: ${{ (needs.validate-trusted-ref.outputs.mode == 'release' || needs.validate-trusted-ref.outputs.mode == 'android-validation') }}
        shell: bash
        run: python3 scripts/flutter/load_sdk_pin.py --github-env

      - name: Setup Flutter
        if: ${{ (needs.validate-trusted-ref.outputs.mode == 'release' || needs.validate-trusted-ref.outputs.mode == 'android-validation') }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: "${{ env.TRUSTED_BUILD_CACHE_VERSION }}-flutter-:os:-:channel:-:version:-:arch:-:hash:"
          pub-cache: false

      - name: Cache Pub dependencies
        if: ${{ (needs.validate-trusted-ref.outputs.mode == 'release' || needs.validate-trusted-ref.outputs.mode == 'android-validation') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Cache Gradle
        if: ${{ (needs.validate-trusted-ref.outputs.mode == 'release' || needs.validate-trusted-ref.outputs.mode == 'android-validation') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Install shared Gradle repositories
        if: ${{ (needs.validate-trusted-ref.outputs.mode == 'release' || needs.validate-trusted-ref.outputs.mode == 'android-validation') }}
        run: python3 scripts/prepare_gradle_repositories.py

      - name: Install dependencies
        if: ${{ (needs.validate-trusted-ref.outputs.mode == 'release' || needs.validate-trusted-ref.outputs.mode == 'android-validation') }}
        run: flutter pub get --enforce-lockfile --no-example

      - name: Prefetch checksum-pinned Android native downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_native_downloads.py --sqlite-platform android --cmake-deps --libdovi --curl-wrapper-dir "$RUNNER_TEMP/pleazyng-native-tools"

      - name: Prepare pinned Steam sources with visible diagnostics
        run: python3 scripts/games/prepare_steam.py

      - name: Configure Android signing
        id: android-signing
        if: ${{ (needs.validate-trusted-ref.outputs.mode == 'release' || needs.validate-trusted-ref.outputs.mode == 'android-validation') }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          values=("$ANDROID_KEYSTORE_BASE64" "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS")
          configured=0
          missing=0
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then configured=$((configured + 1)); else missing=$((missing + 1)); fi
          done
          if (( configured == 0 )); then
            echo "Signed Fire TV release assets require all four Android signing secrets." >&2
            exit 1
          fi
          if (( missing != 0 )); then
            echo "Android signing secrets are incomplete; configure all four Android signing secrets." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties << EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Configure Gradle to use the private JIT proxy
        if: ${{ needs.validate-trusted-ref.outputs.execution_profile != 'hybrid' }}
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          from urllib.parse import urlsplit

          proxy = os.environ.get("HTTPS_PROXY") or os.environ.get("https_proxy")
          if not proxy:
              raise SystemExit("The private JIT HTTPS proxy is required for Gradle downloads.")
          parsed = urlsplit(proxy if "://" in proxy else f"http://{proxy}")
          if not parsed.hostname or not parsed.port or parsed.username or parsed.password:
              raise SystemExit("The private JIT HTTPS proxy URL is invalid for Gradle.")
          options = [
              f"-Dhttp.proxyHost={parsed.hostname}",
              f"-Dhttp.proxyPort={parsed.port}",
              f"-Dhttps.proxyHost={parsed.hostname}",
              f"-Dhttps.proxyPort={parsed.port}",
          ]
          existing = os.environ.get("GRADLE_OPTS", "").strip()
          print("GRADLE_OPTS=" + " ".join(([existing] if existing else []) + options))
          PY

      - name: Build APKs
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' }}
        run: python3 scripts/run_android_build.py flutter --verbose build apk --release --split-per-abi ${{ env.RELEASE_DART_DEFINES }} --obfuscate --split-debug-info=debug-info/android-apk --extra-gen-snapshot-options=--save-obfuscation-map=debug-info/android-apk/obfuscation.map.json

      - name: Package APKs
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' }}
        run: |
          tar -czf pleazyng-android-arm64-v8a.tar.gz -C build/app/outputs/flutter-apk app-arm64-v8a-release.apk --transform 's/app-arm64-v8a-release.apk/pleazyng.apk/'
          tar -czf pleazyng-android-armeabi-v7a.tar.gz -C build/app/outputs/flutter-apk app-armeabi-v7a-release.apk --transform 's/app-armeabi-v7a-release.apk/pleazyng.apk/'
          tar -czf pleazyng-android-x86_64.tar.gz -C build/app/outputs/flutter-apk app-x86_64-release.apk --transform 's/app-x86_64-release.apk/pleazyng.apk/'

      - name: Build signed Android App Bundle
        env:
          REVIEW_ACCESS_PUBLIC_KEY: ${{ vars.REVIEW_ACCESS_PUBLIC_KEY }}
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' && steps.android-signing.outputs.configured == 'true' }}
        run: |
          python3 scripts/run_android_build.py flutter --verbose build appbundle --release ${{ env.RELEASE_DART_DEFINES }} --dart-define=SUPPORTER_MODE=iap --dart-define=REVIEW_ACCESS_PUBLIC_KEY="$REVIEW_ACCESS_PUBLIC_KEY" --obfuscate --split-debug-info=debug-info/android-play
          cp build/app/outputs/bundle/release/app-release.aab pleazyng-android-play.aab

      - name: Build signed Amazon Appstore APK
        env:
          REVIEW_ACCESS_PUBLIC_KEY: ${{ vars.REVIEW_ACCESS_PUBLIC_KEY }}
        if: ${{ (needs.validate-trusted-ref.outputs.mode == 'release' || needs.validate-trusted-ref.outputs.mode == 'android-validation') && steps.android-signing.outputs.configured == 'true' }}
        run: |
          AMAZON=1 ORG_GRADLE_PROJECT_openiapStore=amazon python3 scripts/run_android_build.py flutter --verbose build apk --release ${{ env.RELEASE_DART_DEFINES }} --dart-define=SUPPORTER_MODE=iap --dart-define=AMAZON_STORE=true --dart-define=REVIEW_ACCESS_PUBLIC_KEY="$REVIEW_ACCESS_PUBLIC_KEY" --dart-define=LIFETIME_UNLOCK_PRODUCT_ID=pleazyng_lifetime_unlock --obfuscate --split-debug-info=debug-info/android-amazon
          cp build/app/outputs/flutter-apk/app-release.apk pleazyng-amazon-firetv.apk

      - name: Verify signed Fire TV release APK
        run: >-
          python3 scripts/verify_firetv_apk.py pleazyng-amazon-firetv.apk
          --build-tools "$ANDROID_HOME/build-tools/36.1.0"
          --output pleazyng-amazon-firetv-provenance.json

      - name: Capture Android JIT memory diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          free -h
          for file in /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max \
                      /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory.events; do
            if [[ -r "$file" ]]; then
              echo "--- $file"
              cat "$file"
            fi
          done
          if command -v dmesg >/dev/null 2>&1; then
            dmesg --ctime 2>/dev/null | grep -Ei 'out of memory|oom-kill|killed process|memory cgroup' | tail -n 40 || true
          fi

      - name: Clean up keystore
        if: ${{ always() && (needs.validate-trusted-ref.outputs.mode == 'release' || needs.validate-trusted-ref.outputs.mode == 'android-validation') }}
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Attest APKs
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            pleazyng-android-arm64-v8a.tar.gz
            pleazyng-android-armeabi-v7a.tar.gz
            pleazyng-android-x86_64.tar.gz

      - name: Attest Android App Bundle
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' && steps.android-signing.outputs.configured == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            pleazyng-android-play.aab

      - name: Attest signed Fire TV APK
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            pleazyng-amazon-firetv.apk
            pleazyng-amazon-firetv-provenance.json

      - name: Retain failed Fire TV APK for diagnosis
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: amazon-firetv-diagnostics
          path: |
            pleazyng-amazon-firetv.apk
            pleazyng-amazon-firetv-provenance.json
          if-no-files-found: ignore

      - name: Upload APKs
        if: ${{ (needs.validate-trusted-ref.outputs.mode == 'release' || needs.validate-trusted-ref.outputs.mode == 'android-validation') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-apk
          path: |
            pleazyng-android-arm64-v8a.tar.gz
            pleazyng-android-armeabi-v7a.tar.gz
            pleazyng-android-x86_64.tar.gz
            pleazyng-android-play.aab
            pleazyng-amazon-firetv.apk
            pleazyng-amazon-firetv-provenance.json
          if-no-files-found: warn

  build-webos:
    if: ${{ always() && !cancelled() && needs.validate-trusted-ref.result == 'success' && inputs.reuse_webos_run_id == '' && inputs.reuse_macos_package_run_id == '' && inputs.runner_pool == 'private' && (inputs.action == 'build' || inputs.action == 'release') && needs.validate-trusted-ref.outputs.runner_pool == 'private' && (needs.validate-trusted-ref.outputs.action == 'build' || needs.validate-trusted-ref.outputs.action == 'release') && (needs.validate-trusted-ref.outputs.mode == 'webos-validation' || (needs.validate-trusted-ref.outputs.mode == 'release' && needs.validate-trusted-ref.outputs.include_webos_build == 'true')) }}
    needs: validate-trusted-ref
    name: Build WebOS TV package (ARMv7)
    timeout-minutes: 360
    runs-on:
      group: ng-shared-main-jit
      labels:
        - self-hosted
        - linux
        - x64
        - ng-shared-main-pleazyng
        - ${{ format('ng-main-run-{0}', github.run_id) }}
        - ${{ format('gha-{0}-build-webos', github.run_id) }}
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.recovery_source_sha || github.sha }}
          persist-credentials: false

      - name: Verify private WebOS output storage
        run: python3 tools/webos/retain_private_candidate.py --preflight

      - name: Test WebOS packaging and integrity
        env:
          PLEZY_WEBOS_TEST_TMP: ${{ runner.temp }}/plezy-webos-tests
        run: |
          mkdir -p "$PLEZY_WEBOS_TEST_TMP"
          python3 -m unittest discover -s tools/webos/tests -v

      - name: Install WebOS host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo python3 scripts/configure_hosted_apt.py '${{ runner.environment }}'
          free_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print $4 }')"
          minimum_free_kib=$((60 * 1024 * 1024))
          if [[ ! "$free_kib" =~ ^[0-9]+$ ]] || (( free_kib < minimum_free_kib )); then
            echo "The WebOS engine build needs 60 GiB free under RUNNER_TEMP before toolchain installation." >&2
            df -h "$RUNNER_TEMP" >&2
            exit 1
          fi
          packages=(build-essential clang cmake curl file git-lfs libgtk-3-dev libsecret-1-dev liblzma-dev ninja-build pkg-config unzip libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-libav gstreamer1.0-plugins-bad gstreamer1.0-plugins-good)
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 \
              && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 "${packages[@]}"; then
              break
            fi
            if (( attempt == 3 )); then exit 1; fi
            sudo apt-get clean
            sudo rm -rf /var/lib/apt/lists/*
            sleep $((attempt * 15))
          done
          git lfs version
          cmake --version
          pkg-config --modversion gtk+-3.0
          clang --version

      - name: Prefetch and install the checksum-pinned WebOS Python archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_native_downloads.py --webos-python

      - name: Setup pinned WebOS Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14.8"
          architecture: "x64"

      - name: Install and verify pinned WebOS Ninja
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3.14 --version
          archive="$RUNNER_TEMP/ninja-linux.zip"
          tools_dir="$RUNNER_TEMP/webos-host-tools"
          mkdir -p "$tools_dir"
          expected_archive="$(python3 -c 'import json; print(json.load(open("tools/webos/compatibility.json"))["engineBuild"]["ninjaArchiveSha256"])')"
          python3 scripts/prepare_native_downloads.py --github-url \
            https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip \
            --expected-sha "$expected_archive" --output "$archive"
          printf '%s  %s\n' "$expected_archive" "$archive" | sha256sum --check --status
          unzip -q "$archive" -d "$tools_dir"
          chmod 0755 "$tools_dir/ninja"
          expected_binary="$(python3 -c 'import json; print(json.load(open("tools/webos/compatibility.json"))["engineBuild"]["ninjaSha256"])')"
          printf '%s  %s\n' "$expected_binary" "$tools_dir/ninja" | sha256sum --check --status
          test "$("$tools_dir/ninja" --version)" = "1.13.2"
          echo "WEBOS_NINJA_BIN=$tools_dir/ninja" >> "$GITHUB_ENV"

      - name: Build and verify the WebOS ARM package
        id: webos-build
        run: bash tools/webos/build_release_candidate.sh
        env:
          GH_TOKEN: ${{ github.token }}
          PLEZYNG_WEBOS_TASK_ROOT: ${{ runner.temp }}/pleazyng-webos-${{ github.run_id }}
          PLEZY_WEBOS_RELEASE_BUILD: ${{ needs.validate-trusted-ref.outputs.mode == 'release' && needs.validate-trusted-ref.outputs.include_webos_release == 'true' }}

      - name: Retain verified WebOS candidate for private device testing
        env:
          OUTPUT_DIR: ${{ steps.webos-build.outputs.output_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/webos/retain_private_candidate.py \
            --source-dir "$OUTPUT_DIR" \
            --version "$(python3 scripts/pubspec_version.py pubspec.yaml)"

      - name: Verify WebOS package integrity and source
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' && needs.validate-trusted-ref.outputs.include_webos_release == 'true' }}
        env:
          OUTPUT_DIR: ${{ steps.webos-build.outputs.output_dir }}
          RELEASE_TAG: ${{ needs.validate-trusted-ref.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ipks < <(find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*.ipk' -print)
          if [[ "${#ipks[@]}" -ne 1 ]]; then
            echo "Expected exactly one WebOS IPK in the verified output." >&2
            exit 1
          fi
          python3 tools/webos/check_release_package.py \
            --version "$RELEASE_TAG" --source-commit "$COMPILE_SOURCE_SHA" \
            --artifact "${ipks[0]}"

      - name: Prepare LG Seller Lounge handoff bundle
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' && needs.validate-trusted-ref.outputs.include_webos_release == 'true' }}
        env:
          OUTPUT_DIR: ${{ steps.webos-build.outputs.output_dir }}
          RELEASE_TAG: ${{ needs.validate-trusted-ref.outputs.version }}
          SOURCE_COMMIT: ${{ inputs.recovery_product_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ipks < <(find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*.ipk' -print)
          if [[ "${#ipks[@]}" -ne 1 ]]; then
            echo "Expected exactly one WebOS IPK for the Seller Lounge bundle." >&2
            exit 1
          fi
          python3 scripts/tv_store_submission.py --store lg \
            --package "${ipks[0]}" --version "$RELEASE_TAG" \
            --source-commit "$SOURCE_COMMIT" --package-verified \
            --evidence "$OUTPUT_DIR/webos-app-provenance.json" \
            --evidence "$OUTPUT_DIR/webos-engine-provenance.json" \
            --evidence "$OUTPUT_DIR/webos-compatibility.json" \
            --evidence "$OUTPUT_DIR/SHA256SUMS.txt" \
            --output "$OUTPUT_DIR/pleazyng-lg-webos-submission.zip"
      - name: Attest the WebOS package and provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            ${{ steps.webos-build.outputs.output_dir }}/*.ipk
            ${{ steps.webos-build.outputs.output_dir }}/webos-app-provenance.json
            ${{ steps.webos-build.outputs.output_dir }}/webos-engine-provenance.json
            ${{ steps.webos-build.outputs.output_dir }}/webos-compatibility.json
            ${{ steps.webos-build.outputs.output_dir }}/SHA256SUMS.txt

      - name: Upload verified WebOS IPK for release assembly
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'release' && needs.validate-trusted-ref.outputs.include_webos_release == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: webos-ipk
          path: ${{ steps.webos-build.outputs.output_dir }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload WebOS validation evidence without vendor runtime binaries
        if: ${{ needs.validate-trusted-ref.outputs.mode == 'webos-validation' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: webos-validation-evidence
          path: |
            ${{ steps.webos-build.outputs.output_dir }}/webos-app-provenance.json
            ${{ steps.webos-build.outputs.output_dir }}/webos-engine-provenance.json
            ${{ steps.webos-build.outputs.output_dir }}/webos-compatibility.json
            ${{ steps.webos-build.outputs.output_dir }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Preserve WebOS build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: webos-build-diagnostics
          path: ${{ runner.temp }}/pleazyng-webos-${{ github.run_id }}/logs/**
          if-no-files-found: warn
          retention-days: 14

  build-tizen:
    if: ${{ always() && !cancelled() && needs.validate-trusted-ref.result == 'success' && inputs.reuse_platform_run_id == '' && inputs.runner_pool == 'private' && (inputs.action == 'build' || inputs.action == 'release') && needs.validate-trusted-ref.outputs.runner_pool == 'private' && (needs.validate-trusted-ref.outputs.action == 'build' || needs.validate-trusted-ref.outputs.action == 'release') && needs.validate-trusted-ref.outputs.mode == 'release' && needs.validate-trusted-ref.outputs.include_tizen_build == 'true' }}
    needs: validate-trusted-ref
    name: Build Samsung Tizen TV package (ARM)
    permissions:
      contents: read
    uses: ./.github/workflows/tizen.yml
    with:
      execution_profile: ${{ needs.validate-trusted-ref.outputs.execution_profile }}
      build_package: true
      architecture: arm
      tester_build: true
      security_profile: ''
      include_seller_office_handoff: false

  build-ios:
    if: ${{ always() && !cancelled() && needs.validate-trusted-ref.result == 'success' && (inputs.reuse_platform_run_id == '' || inputs.rebuild_ios) && inputs.runner_pool == 'private' && (inputs.action == 'build' || inputs.action == 'release') && needs.validate-trusted-ref.outputs.runner_pool == 'private' && (needs.validate-trusted-ref.outputs.action == 'build' || needs.validate-trusted-ref.outputs.action == 'release') && needs.validate-trusted-ref.outputs.mode == 'release' }}
    needs: validate-trusted-ref
    runs-on: ${{ needs.validate-trusted-ref.outputs.execution_profile == 'hybrid' && inputs.tvos_runner_pool != 'private' && 'macos-26-intel' || fromJSON(format('{{"group":"private-apple-builds","labels":["self-hosted","macOS","ARM64","private-apple","ng-shared-main-pleazyng","ng-main-run-{0}","gha-{0}-build-ios"]}}', github.run_id)) }}
    permissions:
      id-token: write
      attestations: write
      contents: read
    env:
      PUB_CACHE: ${{ github.workspace }}/.cache/plezy-pub-cache
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.recovery_source_sha || github.sha }}
          persist-credentials: false

      - name: Load pinned Flutter SDK
        shell: bash
        run: python3 scripts/flutter/load_sdk_pin.py --github-env

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter-apple
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.cache/plezy-pub-cache
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-pub-v2-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-ios-pods-${{ hashFiles('**/Podfile.lock') }}

      - name: Ensure CMake for the embedded Steam receiver
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v cmake >/dev/null || brew install cmake
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v git-lfs >/dev/null || brew install git-lfs
          cmake --version

      - name: Install CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          gem install cocoapods --version 1.17.0 --no-document \
            --install-dir "$RUNNER_TEMP/cocoapods-gems" \
            --bindir "$RUNNER_TEMP/cocoapods-bin"
          gem_path="$RUNNER_TEMP/cocoapods-gems:$(gem env gempath)"
          {
            echo "GEM_HOME=$RUNNER_TEMP/cocoapods-gems"
            echo "GEM_PATH=$gem_path"
          } >> "$GITHUB_ENV"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/cocoapods-bin" >> "$GITHUB_PATH"
          export GEM_HOME="$RUNNER_TEMP/cocoapods-gems"
          export GEM_PATH="$gem_path"
          export PATH="$RUNNER_TEMP/cocoapods-bin:/opt/homebrew/bin:$PATH"
          pod --version

      - name: Prepare NFS source workspace and local APFS iOS build output
        shell: bash
        run: |
          set -euo pipefail
          short_root="$(bash scripts/prepare_apple_jit_scratch.sh ios 40 local-xcode)"
          runner_temp_real="$(cd "$RUNNER_TEMP" && pwd -P)"
          APPLE_LOCAL_BUILD_DIR="$runner_temp_real/pleazyng-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-ios-xcode/build"
          python3 scripts/copy_apple_jit_sources.py "$GITHUB_WORKSPACE" "$short_root" "$COMPILE_SOURCE_SHA"
          bash "$short_root/scripts/clean_appledouble_sidecars.sh" "$short_root"
          if [[ -e "$short_root/build" || -L "$short_root/build" ]]; then
            echo "Refusing to replace existing build output in the new Apple workspace: $short_root/build" >&2
            exit 1
          fi
          mkdir -p "$APPLE_LOCAL_BUILD_DIR"
          ln -s "$APPLE_LOCAL_BUILD_DIR" "$short_root/build"
          chmod 700 "$short_root"
          [[ "$(git -C "$short_root" rev-parse HEAD)" == "$COMPILE_SOURCE_SHA" ]]
          [[ ! -L "$short_root" && "$(cd "$short_root" && pwd -P)" == "$short_root" ]]
          [[ "$(cd "$short_root/build" && pwd -P)" == "$APPLE_LOCAL_BUILD_DIR" ]]
          echo "Prepared NFS-backed iOS sources with local APFS build output: $short_root -> $APPLE_LOCAL_BUILD_DIR"

      - name: Install dependencies
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: flutter pub get --enforce-lockfile --no-example

      - name: Prefetch checksum-pinned ios native downloads
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$GITHUB_WORKSPACE/scripts/prepare_native_downloads.py" --sqlite-platform ios

      - name: Prepare pinned iOS Steam sources before Xcode
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        timeout-minutes: 15
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python3 scripts/games/prepare_steam.py; then
              exit 0
            fi
            if (( attempt == 3 )); then
              echo "Pinned iOS Steam source preparation failed after three attempts." >&2
              exit 1
            fi
            echo "Retrying pinned iOS Steam source preparation ($attempt/3)." >&2
            sleep "$((attempt * 5))"
          done

      - name: Refresh pinned mpv Swift packages
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: scripts/refresh_apple_spm.sh ios

      - name: Remove AppleDouble sidecars before iOS Xcode build
        run: bash "$GITHUB_WORKSPACE/scripts/clean_appledouble_sidecars.sh" "$PLEZYNG_APPLE_WORKSPACE"

      - name: Configure optional iOS App Store signing
        id: ios-signing
        env:
          INCLUDE_APPLE_STORE_BUILD: ${{ needs.validate-trusted-ref.outputs.include_apple_store_build }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ "$INCLUDE_APPLE_STORE_BUILD" != "true" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Signed iOS App Store IPA disabled; unsigned developer artifact remains available."
            exit 0
          fi
          for name in APPLE_TEAM_ID APPLE_DISTRIBUTION_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required Apple signing secret: $name" >&2
              exit 1
            fi
          done
          if [[ -z "${IOS_ROMMWORKER_PROVISIONING_PROFILE_BASE64:-}" ]]; then
            for name in APPLE_API_ISSUER_ID APPLE_API_KEY_ID APPLE_API_PRIVATE_KEY; do
              if [[ -z "${!name}" ]]; then
                echo "Missing required Apple profile API secret: $name" >&2
                exit 1
              fi
            done
            python3 "$GITHUB_WORKSPACE/scripts/build_apple_store_archive.py" --prepare-ios-worker-profile \
              --public-report "$PLEZYNG_APPLE_WORKSPACE/pleazyng-ios-profile-report.json"
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Pin iOS device builds to the packaged native ABI
        run: |
          set -euo pipefail
          override="$RUNNER_TEMP/pleazyng-ios-device-architecture.xcconfig"
          printf 'ARCHS = arm64\nONLY_ACTIVE_ARCH = NO\n' > "$override"
          echo "XCODE_XCCONFIG_FILE=$override" >> "$GITHUB_ENV"

      - name: Stage locked iOS worker frameworks for Release
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --config-only ${{ env.RELEASE_DART_DEFINES }} --split-debug-info=debug-info/ios
          (cd ios && pod install --deployment)
          products_root="$PWD/build/ios"
          xcodebuild build -project ios/Pods/Pods.xcodeproj -scheme Pods-RommWorker \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$APPLE_DERIVED_DATA_PATH" BUILD_DIR="$products_root" \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO ARCHS=arm64
          settings="$RUNNER_TEMP/ios-worker-release-settings.json"
          xcodebuild -project ios/Runner.xcodeproj -target RommWorker \
            -configuration Release -sdk iphoneos -showBuildSettings -json \
            BUILD_DIR="$products_root" CODE_SIGNING_ALLOWED=NO > "$settings"
          python3 - "$settings" <<'PYSETTINGS'
          import hashlib, json, pathlib, shlex, subprocess, sys
          records = json.loads(pathlib.Path(sys.argv[1]).read_text())
          matches = [item['buildSettings'] for item in records if item.get('target') == 'RommWorker']
          if len(matches) != 1:
              raise SystemExit('Expected exactly one resolved RommWorker configuration')
          settings = matches[0]
          keys = ('CONFIGURATION_BUILD_DIR', 'PODS_CONFIGURATION_BUILD_DIR', 'PODS_XCFRAMEWORKS_BUILD_DIR', 'FRAMEWORK_SEARCH_PATHS')
          print(json.dumps({key: settings.get(key) for key in keys}, indent=2))
          roots = shlex.split(settings.get('FRAMEWORK_SEARCH_PATHS', ''))
          binaries = [pathlib.Path(root) / 'PlezyRetroWorker.framework/PlezyRetroWorker' for root in roots]
          binaries = sorted({path.resolve() for path in binaries if path.is_file()})
          if len(binaries) != 1:
              raise SystemExit(f'Expected one staged worker framework in resolved search paths, found {binaries}')
          binary = binaries[0]
          subprocess.run(['xcrun', 'lipo', str(binary), '-verify_arch', 'arm64'], check=True)
          print('Verified staged ARM64 worker:', binary, hashlib.file_digest(binary.open('rb'), 'sha256').hexdigest())
          PYSETTINGS

      - name: Build iOS (no codesign)
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: flutter build ios --release --no-codesign --no-pub --verbose ${{ env.RELEASE_DART_DEFINES }} --split-debug-info=debug-info/ios

      - name: Create unsigned developer IPA
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Pleazyng.app Payload/
          zip -r pleazyng-ios-unsigned.ipa Payload


      - name: Checkpoint unsigned iOS developer IPA
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: cp -f pleazyng-ios-unsigned.ipa "$GITHUB_WORKSPACE/"

      - name: Attest unsigned developer IPA
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: pleazyng-ios-unsigned.ipa

      - name: Retain unsigned iOS developer checkpoint
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-unsigned-checkpoint
          path: pleazyng-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Build signed iOS App Store IPA
        if: steps.ios-signing.outputs.configured == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_MUSIC_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_MUSIC_WIDGET_PROVISIONING_PROFILE_BASE64 }}
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/clean_appledouble_sidecars.sh" "$PLEZYNG_APPLE_WORKSPACE"
          flutter build ios --release --no-codesign \
            ${{ env.RELEASE_DART_DEFINES }} \
            --dart-define=SUPPORTER_MODE=iap \
            --dart-define=ENABLE_UPDATE_CHECK=false \
            --obfuscate --split-debug-info=debug-info/ios-app-store
          python3 "$GITHUB_WORKSPACE/scripts/build_apple_store_archive.py" \
            --platform ios \
            --archive-path "$APPLE_LOCAL_BUILD_DIR/ios-store.xcarchive" \
            --export-path "$APPLE_LOCAL_BUILD_DIR/ios-store-export" \
            --derived-data "$APPLE_LOCAL_BUILD_DIR/ios-store-derived-data"


      - name: Copy iOS packages to the workflow workspace
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: |
          set -euo pipefail
          cp -f pleazyng-ios-unsigned.ipa "$GITHUB_WORKSPACE/"
          if [[ -f pleazyng-ios-appstore.ipa ]]; then
            cp -f pleazyng-ios-appstore.ipa "$GITHUB_WORKSPACE/"
          fi

      - name: Attest signed iOS App Store IPA
        if: steps.ios-signing.outputs.configured == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: pleazyng-ios-appstore.ipa

      - name: Retain iOS signing report
        if: always() && needs.validate-trusted-ref.outputs.include_apple_store_build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-store-signing-report
          path: |
            ${{ env.PLEZYNG_APPLE_WORKSPACE }}/pleazyng-ios-signing-report.json
            ${{ env.PLEZYNG_APPLE_WORKSPACE }}/pleazyng-ios-profile-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Remove iOS signing archive outputs
        if: always() && steps.ios-signing.outputs.configured == 'true'
        run: |
          rm -rf "$APPLE_LOCAL_BUILD_DIR/ios-store.xcarchive" \
            "$APPLE_LOCAL_BUILD_DIR/ios-store-export" \
            "$APPLE_LOCAL_BUILD_DIR/ios-store-derived-data"

      - name: Upload IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-ipa
          path: |
            pleazyng-ios-unsigned.ipa
            pleazyng-ios-appstore.ipa
          if-no-files-found: error

      - name: Remove short iOS build workspace
        if: always() && env.PLEZYNG_APPLE_TASK_ROOT != ''
        shell: bash
        env:
          APPLE_JIT_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [[ "$APPLE_JIT_JOB_STATUS" == cancelled ]]; then
            bash scripts/cleanup_apple_jit_scratch.sh ios
            exit 0
          fi
          short_root="$PLEZYNG_APPLE_TASK_ROOT"
          if [[ -d "$short_root" && ! -L "$short_root" && "$(cd "$short_root" && pwd -P)" == "$short_root" ]]; then
            if [[ -d "$short_root/ios/Pods" ]]; then
              mkdir -p "$GITHUB_WORKSPACE/ios"
              ditto "$short_root/ios/Pods" "$GITHUB_WORKSPACE/ios/Pods"
            fi
            bash scripts/cleanup_apple_jit_scratch.sh ios
          elif [[ -e "$short_root" || -L "$short_root" ]]; then
            echo "Refusing to remove unexpected Apple build path: $short_root" >&2
            exit 1
          fi

  build-tvos:
    if: ${{ always() && !cancelled() && needs.validate-trusted-ref.result == 'success' && (inputs.reuse_platform_run_id == '' || inputs.rebuild_tvos) && inputs.runner_pool == 'private' && (inputs.action == 'build' || inputs.action == 'release') && needs.validate-trusted-ref.outputs.runner_pool == 'private' && (needs.validate-trusted-ref.outputs.action == 'build' || needs.validate-trusted-ref.outputs.action == 'release') && needs.validate-trusted-ref.outputs.mode == 'release' }}
    needs: validate-trusted-ref
    name: Build tvOS developer package (arm64)
    runs-on: ${{ needs.validate-trusted-ref.outputs.execution_profile == 'hybrid' && inputs.tvos_runner_pool != 'private' && 'macos-26' || fromJSON(format('{{"group":"private-apple-builds","labels":["self-hosted","macOS","ARM64","private-apple","ng-shared-main-pleazyng","ng-main-run-{0}","gha-{0}-build-tvos"]}}', github.run_id)) }}
    permissions:
      id-token: write
      attestations: write
      contents: read
    env:
      PUB_CACHE: ${{ github.workspace }}/.cache/plezy-pub-cache
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.recovery_source_sha || github.sha }}
          persist-credentials: false

      - name: Require native ARM host for tvOS AOT
        shell: bash
        run: test "$(uname -m)" = arm64

      - name: Load pinned Flutter SDK
        shell: bash
        run: python3 scripts/flutter/load_sdk_pin.py --github-env

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter-apple
        with:
          hosted-xcode-version: '26.5'
          flutter-version: ${{ env.TVOS_FLUTTER_VERSION }}

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.cache/plezy-pub-cache
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-pub-v2-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Cache pinned tvOS Flutter engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/flutter-tvos-engine
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-tvos-engine-${{ hashFiles('tvos/engine.version', 'tvos/engine.sha256') }}

      - name: Prepare NFS source scratch and local APFS Xcode output
        shell: bash
        run: bash scripts/prepare_apple_jit_scratch.sh tvos 40 local-xcode >/dev/null

      - name: Ensure CMake for the embedded Steam receiver
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v cmake >/dev/null || brew install cmake
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v git-lfs >/dev/null || brew install git-lfs
          cmake --version

      - name: Install CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          gem install cocoapods --version 1.17.0 --no-document \
            --install-dir "$RUNNER_TEMP/cocoapods-gems" \
            --bindir "$RUNNER_TEMP/cocoapods-bin"
          gem_path="$RUNNER_TEMP/cocoapods-gems:$(gem env gempath)"
          {
            echo "GEM_HOME=$RUNNER_TEMP/cocoapods-gems"
            echo "GEM_PATH=$gem_path"
          } >> "$GITHUB_ENV"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/cocoapods-bin" >> "$GITHUB_PATH"
          export GEM_HOME="$RUNNER_TEMP/cocoapods-gems"
          export GEM_PATH="$gem_path"
          export PATH="$RUNNER_TEMP/cocoapods-bin:/opt/homebrew/bin:$PATH"
          pod --version

      - name: Install tvOS dependencies with the unsupported SMB native asset stub
        run: tvos/scripts/pub_get.sh

      - name: Prefetch checksum-pinned tvOS native downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_native_downloads.py --sqlite-platform tvos

      - name: Fetch the checksum-pinned tvOS Flutter engine
        run: tvos/scripts/fetch_engine.sh

      - name: Install tvOS CocoaPods dependencies
        run: tvos/scripts/pod_install.sh

      - name: Resolve pinned tvOS Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace tvos/Runner.xcworkspace \
            -scheme Runner \
            -derivedDataPath "$APPLE_DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$APPLE_SOURCE_PACKAGES_DIR"

      - name: Remove AMSMB2 unsafe warning flag from the pinned tvOS checkout
        run: |
          python3 scripts/patch_amsmb2_manifest.py \
            --source-packages-dir "$APPLE_SOURCE_PACKAGES_DIR" \
            --resolved-package tvos/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Configure optional tvOS App Store signing
        id: tvos-signing
        env:
          INCLUDE_APPLE_STORE_BUILD: ${{ needs.validate-trusted-ref.outputs.include_apple_store_build }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          TVOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.TVOS_PROVISIONING_PROFILE_BASE64 }}
          TVOS_TOPSHELF_PROVISIONING_PROFILE_BASE64: ${{ secrets.TVOS_TOPSHELF_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ "$INCLUDE_APPLE_STORE_BUILD" != "true" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Signed tvOS App Store IPA disabled; unsigned developer artifact remains available."
            exit 0
          fi
          for name in APPLE_TEAM_ID APPLE_DISTRIBUTION_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD TVOS_PROVISIONING_PROFILE_BASE64 TVOS_TOPSHELF_PROVISIONING_PROFILE_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required Apple signing secret: $name" >&2
              exit 1
            fi
          done
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build tvOS app
        run: |
          xcodebuild build \
            -workspace tvos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -clonedSourcePackagesDirPath "$APPLE_SOURCE_PACKAGES_DIR" \
            -derivedDataPath "$APPLE_DERIVED_DATA_PATH" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package unsigned tvOS developer IPA
        run: |
          set -euo pipefail
          app_path=$(find "$APPLE_DERIVED_DATA_PATH/Build/Products" -type d -name Runner.app -print -quit)
          if [[ -z "$app_path" ]]; then
            echo 'Xcode did not produce Runner.app.' >&2
            exit 1
          fi
          mkdir -p tvos-payload/Payload
          cp -R "$app_path" tvos-payload/Payload/
          (cd tvos-payload && zip -qr ../pleazyng-tvos-unsigned.ipa Payload)

      - name: Build signed tvOS App Store IPA
        if: steps.tvos-signing.outputs.configured == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          TVOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.TVOS_PROVISIONING_PROFILE_BASE64 }}
          TVOS_TOPSHELF_PROVISIONING_PROFILE_BASE64: ${{ secrets.TVOS_TOPSHELF_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/build_apple_store_archive.py" \
            --platform tvos \
            --archive-path "$APPLE_LOCAL_BUILD_DIR/tvos-store.xcarchive" \
            --export-path "$APPLE_LOCAL_BUILD_DIR/tvos-store-export" \
            --derived-data "$APPLE_LOCAL_BUILD_DIR/tvos-store-derived-data" \
            --source-packages "$APPLE_SOURCE_PACKAGES_DIR"

      - name: Attest unsigned tvOS developer package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: pleazyng-tvos-unsigned.ipa

      - name: Attest signed tvOS App Store package
        if: steps.tvos-signing.outputs.configured == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: pleazyng-tvos-appstore.ipa

      - name: Retain tvOS signing report
        if: always() && steps.tvos-signing.outputs.configured == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tvos-store-signing-report
          path: ${{ github.workspace }}/pleazyng-tvos-signing-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Remove tvOS signing archive outputs
        if: always() && steps.tvos-signing.outputs.configured == 'true'
        run: |
          rm -rf "$APPLE_LOCAL_BUILD_DIR/tvos-store.xcarchive" \
            "$APPLE_LOCAL_BUILD_DIR/tvos-store-export" \
            "$APPLE_LOCAL_BUILD_DIR/tvos-store-derived-data"

      - name: Upload tvOS package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tvos-ipa
          path: |
            pleazyng-tvos-unsigned.ipa
            pleazyng-tvos-appstore.ipa
          if-no-files-found: error

      - name: Clean tvOS source and Xcode scratch
        if: always()
        shell: bash
        env:
          APPLE_JIT_JOB_STATUS: ${{ job.status }}
        run: bash scripts/cleanup_apple_jit_scratch.sh tvos

  build-macos:
    if: ${{ always() && !cancelled() && needs.validate-trusted-ref.result == 'success' && (inputs.reuse_platform_run_id == '' || inputs.rebuild_macos) && inputs.runner_pool == 'private' && (inputs.action == 'build' || inputs.action == 'release') && needs.validate-trusted-ref.outputs.runner_pool == 'private' && (needs.validate-trusted-ref.outputs.action == 'build' || needs.validate-trusted-ref.outputs.action == 'release') && (needs.validate-trusted-ref.outputs.mode == 'release' || needs.validate-trusted-ref.outputs.mode == 'macos-validation') }}
    needs: validate-trusted-ref
    runs-on: ${{ needs.validate-trusted-ref.outputs.execution_profile == 'hybrid' && 'macos-26-intel' || fromJSON(format('{{"group":"private-apple-builds","labels":["self-hosted","macOS","ARM64","private-apple","ng-shared-main-pleazyng","ng-main-run-{0}","gha-{0}-build-macos"]}}', github.run_id)) }}
    permissions:
      actions: read
      id-token: write
      attestations: write
      contents: read
    env:
      PUB_CACHE: ${{ github.workspace }}/.cache/plezy-pub-cache
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.recovery_source_sha || github.sha }}
          persist-credentials: false

      - name: Check macOS signing configuration
        id: macos-signing
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          REQUIRE_HOMEBREW_CASK: ${{ needs.validate-trusted-ref.outputs.prepare_homebrew_cask }}
        run: |
          set -euo pipefail
          if [[ "$REQUIRE_HOMEBREW_CASK" != "true" ]]; then
            echo "codesign=false" >> "$GITHUB_OUTPUT"
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "Developer ID signing is opt-in; GitHub-only releases use an unsigned macOS DMG."
            exit 0
          fi
          signing_values=("$MACOS_CERTIFICATE_BASE64" "$MACOS_CERTIFICATE_PASSWORD")
          signing_set=0
          signing_missing=0
          for value in "${signing_values[@]}"; do
            if [[ -n "$value" ]]; then signing_set=$((signing_set + 1)); else signing_missing=$((signing_missing + 1)); fi
          done
          if (( signing_set == 0 )); then
            echo "codesign=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets are not configured; the macOS DMG will be unsigned."
          elif (( signing_missing != 0 )); then
            echo "Apple signing certificate and password are incomplete." >&2
            exit 1
          else
            echo "codesign=true" >> "$GITHUB_OUTPUT"
            keychain_password="$(/usr/bin/uuidgen)"
            echo "::add-mask::$keychain_password"
            echo "keychain_password=$keychain_password" >> "$GITHUB_OUTPUT"
          fi

          notary_values=("$APPLE_API_KEY_ID" "$APPLE_API_ISSUER_ID" "$APPLE_API_PRIVATE_KEY")
          notary_set=0
          notary_missing=0
          for value in "${notary_values[@]}"; do
            if [[ -n "$value" ]]; then notary_set=$((notary_set + 1)); else notary_missing=$((notary_missing + 1)); fi
          done
          if (( notary_set == 0 )); then
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          elif (( notary_missing != 0 || signing_set != 2 )) || [[ -z "$APPLE_TEAM_ID" ]]; then
            echo "Apple notarization requires the complete App Store Connect API key, team ID, and signing certificate." >&2
            exit 1
          else
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$REQUIRE_HOMEBREW_CASK" == "true" ]]; then
            if (( signing_set != 2 || notary_set != 3 )) || [[ -z "$APPLE_TEAM_ID" ]]; then
              echo "Homebrew Cask preparation requires complete Developer ID signing and Apple notarization credentials." >&2
              exit 1
            fi
          fi

      - name: Import Code Signing Certificate
        id: macos-signing-identity
        if: steps.macos-signing.outputs.codesign == 'true'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ steps.macos-signing.outputs.keychain_password }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          python3 - "$RUNNER_TEMP/macos-original-keychains.json" <<'PYCHAIN'
          import json, shlex, subprocess, sys
          original = subprocess.check_output(['security', 'list-keychains', '-d', 'user'], text=True)
          with open(sys.argv[1], 'x') as output:
              json.dump(shlex.split(original), output)
          PYCHAIN
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D -o "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Install Apple's public intermediate in this job keychain. A fresh
          # headless CI account must not depend on a prior GUI keychain setup.
          CHAIN_PATH="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 90 \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$CHAIN_PATH"
          printf '%s  %s\n' f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a "$CHAIN_PATH" | shasum -a 256 --check
          chain_fingerprints="$(security find-certificate -a -Z "$KEYCHAIN_PATH")"
          if [[ "$chain_fingerprints" != *"F16CD3C54C7F83CEA4BF1A3E6A0819C8AAA8E4A1528FD144715F350643D2DF3A"* ]]; then
            security import "$CHAIN_PATH" -k "$KEYCHAIN_PATH"
          fi
          python3 - "$KEYCHAIN_PATH" "$RUNNER_TEMP/macos-original-keychains.json" <<'PYCHAIN'
          import json, subprocess, sys
          with open(sys.argv[2]) as source:
              original = json.load(source)
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', sys.argv[1], *original], check=True)
          PYCHAIN
          identities="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          if [[ "$identities" != *"Developer ID Application:"* ]]; then
            echo "The imported macOS signing certificate has no valid Developer ID Application identity. Configure a Developer ID Application certificate; Apple Distribution certificates cannot be used for macOS notarization." >&2
            exit 1
          fi
          IDENTITY="$(printf '%s\n' "$identities" | python3 -c 'import os,re,sys; ids=re.findall(r"\b([A-F0-9]{40}) \"Developer ID Application: [^\"\n]+ \(" + re.escape(os.environ["APPLE_TEAM_ID"]) + r"\)\"", sys.stdin.read()); assert len(ids)==1, "Expected one valid Developer ID identity for the configured team"; print(ids[0])')"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          printf 'int main(void) { return 0; }\n' | xcrun clang -x c - -o "$RUNNER_TEMP/macos-signing-probe"
          codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" --timestamp --options runtime "$RUNNER_TEMP/macos-signing-probe"
          codesign --verify --strict "$RUNNER_TEMP/macos-signing-probe"

      - name: Verify Apple notarization credentials before compilation
        if: steps.macos-signing.outputs.notarize == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          API_KEY_PATH="$RUNNER_TEMP/pleazyng-macos-notary-api-key.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$API_KEY_PATH"
          xcrun notarytool history --key "$API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --output-format json > /dev/null

      - name: Recover verified native macOS compilation
        if: inputs.macos_compilation_job_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILED_JOB_ID: ${{ inputs.macos_compilation_job_id }}
        run: python3 scripts/recover_macos_app.py --job-id "$COMPILED_JOB_ID"

      - name: Load pinned Flutter SDK
        shell: bash
        run: python3 scripts/flutter/load_sdk_pin.py --github-env

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter-apple
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.cache/plezy-pub-cache
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-pub-v2-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Cache CocoaPods
        if: inputs.macos_compilation_job_id == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            macos/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-macos-pods-${{ hashFiles('**/Podfile.lock') }}

      - name: Ensure CMake for the embedded Steam receiver
        if: inputs.macos_compilation_job_id == ''
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v cmake >/dev/null || brew install cmake
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v git-lfs >/dev/null || brew install git-lfs
          cmake --version

      - name: Install CocoaPods
        if: inputs.macos_compilation_job_id == ''
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          gem install cocoapods --version 1.17.0 --no-document \
            --install-dir "$RUNNER_TEMP/cocoapods-gems" \
            --bindir "$RUNNER_TEMP/cocoapods-bin"
          gem_path="$RUNNER_TEMP/cocoapods-gems:$(gem env gempath)"
          {
            echo "GEM_HOME=$RUNNER_TEMP/cocoapods-gems"
            echo "GEM_PATH=$gem_path"
          } >> "$GITHUB_ENV"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/cocoapods-bin" >> "$GITHUB_PATH"
          export GEM_HOME="$RUNNER_TEMP/cocoapods-gems"
          export GEM_PATH="$gem_path"
          export PATH="$RUNNER_TEMP/cocoapods-bin:/opt/homebrew/bin:$PATH"
          pod --version

      - name: Prepare NFS source workspace and local APFS macOS build output
        if: inputs.macos_compilation_job_id == ''
        shell: bash
        run: |
          set -euo pipefail
          short_root="$(bash scripts/prepare_apple_jit_scratch.sh macos 40 local-xcode)"
          runner_temp_real="$(cd "$RUNNER_TEMP" && pwd -P)"
          APPLE_LOCAL_BUILD_DIR="$runner_temp_real/pleazyng-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-macos-xcode/build"
          python3 scripts/copy_apple_jit_sources.py "$GITHUB_WORKSPACE" "$short_root" "$COMPILE_SOURCE_SHA"
          bash "$short_root/scripts/clean_appledouble_sidecars.sh" "$short_root"
          if [[ -e "$short_root/build" || -L "$short_root/build" ]]; then
            echo "Refusing to replace existing build output in the new Apple workspace: $short_root/build" >&2
            exit 1
          fi
          mkdir -p "$APPLE_LOCAL_BUILD_DIR"
          ln -s "$APPLE_LOCAL_BUILD_DIR" "$short_root/build"
          chmod 700 "$short_root"
          [[ "$(git -C "$short_root" rev-parse HEAD)" == "$COMPILE_SOURCE_SHA" ]]
          [[ ! -L "$short_root" && "$(cd "$short_root" && pwd -P)" == "$short_root" ]]
          [[ "$(cd "$short_root/build" && pwd -P)" == "$APPLE_LOCAL_BUILD_DIR" ]]
          echo "Prepared NFS-backed macOS sources with local APFS build output: $short_root -> $APPLE_LOCAL_BUILD_DIR"

      - name: Install dependencies
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: flutter pub get --enforce-lockfile --no-example

      - name: Prefetch checksum-pinned macos native downloads
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$GITHUB_WORKSPACE/scripts/prepare_native_downloads.py" --sqlite-platform macos

      - name: Refresh pinned mpv Swift packages
        if: inputs.macos_compilation_job_id == ''
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: scripts/refresh_apple_spm.sh macos

      - name: Configure repository updater trust root
        if: inputs.macos_compilation_job_id == ''
        shell: bash
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: dart run scripts/configure_updater.dart

      - name: Remove AppleDouble sidecars before macOS Xcode build
        if: inputs.macos_compilation_job_id == ''
        run: bash "$GITHUB_WORKSPACE/scripts/clean_appledouble_sidecars.sh" "$PLEZYNG_APPLE_WORKSPACE"

      - name: Build macOS
        if: inputs.macos_compilation_job_id == ''
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        env:
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: "NO"
          FLUTTER_XCODE_CODE_SIGNING_IDENTITY: ""
        # Verbose bypasses the pinned SDK's quadratic filter on long nested Xcode output.
        run: flutter build macos --release --verbose ${{ env.RELEASE_DART_DEFINES }} ${{ env.NATIVE_UPDATER_DEFINE }} --dart-define=SUPPORTER_MODE=unlocked --split-debug-info=debug-info/macos

      - name: Verify universal macOS executable
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: |
          set -euo pipefail
          APP_PATH="build/macos/Build/Products/Release/Pleazyng.app"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")
          ARCHITECTURES=$(lipo -archs "$APP_PATH/Contents/MacOS/$EXECUTABLE")
          for architecture in arm64 x86_64; do
            if [[ " $ARCHITECTURES " != *" $architecture "* ]]; then
              echo "macOS release binary is missing the $architecture slice: $ARCHITECTURES" >&2
              exit 1
            fi
          done

      - name: Retain native macOS compilation for packaging recovery
        id: macos-compilation-cache
        if: inputs.macos_compilation_job_id == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: python3 "$GITHUB_WORKSPACE/scripts/retain_macos_app.py" capture build/macos/Build/Products/Release/Pleazyng.app

      - name: Sign Application
        if: steps.macos-signing.outputs.codesign == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: |
          IDENTITY="${{ steps.macos-signing-identity.outputs.identity }}"
          echo "Signing with identity: $IDENTITY"

          APP_PATH="build/macos/Build/Products/Release/Pleazyng.app"

          python3 scripts/apple/prepare_macos_app_for_signing.py "$APP_PATH" \
            --entitlements-source macos/Runner/Release.entitlements \
            --entitlements-output "$RUNNER_TEMP/macos-release-entitlements.plist"

          APP_EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")
          test -x "$APP_PATH/Contents/MacOS/plezy_visualizer_helper"

          # Sign executable payloads before sealing their containing frameworks.
          # The visualizer helper is in MacOS, outside the Frameworks directory.
          find "$APP_PATH/Contents/Frameworks" "$APP_PATH/Contents/MacOS" -type f -perm +111 ! -name "*.dylib" ! -path "*/Headers/*" ! -path "*/Modules/*" -print0 \
            | while IFS= read -r -d '' exe; do
              if [[ "$exe" == "$APP_PATH/Contents/MacOS/$APP_EXECUTABLE" ]]; then continue; fi
              kind="$(/usr/bin/file -b "$exe")"
              if [[ "$kind" != *"Mach-O"* || "$kind" == *"ar archive"* || "$kind" == *" object"* ]]; then continue; fi
              preserve=()
              if codesign -d "$exe" >/dev/null 2>&1; then preserve=(--preserve-metadata=entitlements); fi
              codesign --force --sign "$IDENTITY" --timestamp --options runtime "${preserve[@]}" "$exe"
            done

          # Seal nested bundles and libraries inside-out after their children.
          find "$APP_PATH/Contents/Frameworks" \( -name "*.xpc" -o -name "*.app" -o -name "*.framework" -o -name "*.dylib" \) -print0 \
            | sort -zr \
            | while IFS= read -r -d '' item; do
              echo "Signing: $item"
              preserve=()
              if codesign -d "$item" >/dev/null 2>&1; then preserve=(--preserve-metadata=entitlements); fi
              codesign --force --sign "$IDENTITY" --timestamp --options runtime "${preserve[@]}" "$item"
            done

          python3 scripts/apple/finalize_macos_runtime_receipts.py "$APP_PATH"

          # Sign the app bundle itself
          echo "Signing app bundle: $APP_PATH"
          codesign --force --sign "$IDENTITY" --timestamp --options runtime --entitlements "$RUNNER_TEMP/macos-release-entitlements.plist" "$APP_PATH"

      - name: Verify Signature
        if: steps.macos-signing.outputs.codesign == 'true'
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: |
          APP_PATH="build/macos/Build/Products/Release/Pleazyng.app"
          echo "Verifying signature..."
          codesign -dvvv "$APP_PATH"
          echo "Verifying signed entitlements..."
          codesign -d --entitlements :- "$APP_PATH" > "$RUNNER_TEMP/macos-entitlements.plist"
          /usr/libexec/PlistBuddy -c "Print" "$RUNNER_TEMP/macos-entitlements.plist"
          /usr/libexec/PlistBuddy -c "Print :com.apple.security.cs.allow-jit" "$RUNNER_TEMP/macos-entitlements.plist"
          /usr/libexec/PlistBuddy -c "Print :com.apple.security.cs.allow-unsigned-executable-memory" "$RUNNER_TEMP/macos-entitlements.plist"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize Application
        if: steps.macos-signing.outputs.notarize == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: |
          set -euo pipefail
          APP_PATH="build/macos/Build/Products/Release/Pleazyng.app"
          API_KEY_PATH="$RUNNER_TEMP/pleazyng-macos-notary-api-key.p8"
          umask 077
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$API_KEY_PATH"

          echo "Creating ZIP for notarization..."
          ditto -c -k --keepParent "$APP_PATH" notarization.zip
          echo "Submitting to Apple's notary service..."
          xcrun notarytool submit notarization.zip --key "$API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait

          echo "Stapling the notarization ticket to the app..."
          xcrun stapler staple "$APP_PATH"
          echo "Verifying notarization..."
          xcrun stapler validate "$APP_PATH"

      - name: Remove temporary macOS signing material
        if: always()
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          if [[ -f "$RUNNER_TEMP/macos-original-keychains.json" ]]; then
            python3 - "$KEYCHAIN_PATH" "$RUNNER_TEMP/macos-original-keychains.json" <<'PYCHAIN'
          import json, shlex, subprocess, sys
          with open(sys.argv[2]) as source:
              original = json.load(source)
          current = shlex.split(subprocess.check_output(['security', 'list-keychains', '-d', 'user'], text=True))
          restored = list(dict.fromkeys([*original, *(p for p in current if p != sys.argv[1])]))
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *restored], check=True)
          PYCHAIN
          fi
          if [[ -e "$KEYCHAIN_PATH" || -L "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/certificate.p12"
          rm -f "$RUNNER_TEMP/pleazyng-macos-notary-api-key.p8"
          rm -f "$RUNNER_TEMP/macos-release-entitlements.plist"
          rm -f "$RUNNER_TEMP/macos-original-keychains.json" "$RUNNER_TEMP/DeveloperIDG2CA.cer" "$RUNNER_TEMP/macos-signing-probe"
          if [[ -n "${PLEZYNG_APPLE_WORKSPACE:-}" ]]; then
            rm -f "$PLEZYNG_APPLE_WORKSPACE/notarization.zip"
          fi

      - name: Verify Gatekeeper acceptance for Homebrew Cask
        if: ${{ needs.validate-trusted-ref.outputs.prepare_homebrew_cask == 'true' }}
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: |
          set -euo pipefail
          # The assessment service cannot traverse the private NFS source path.
          # Assess the actual local APFS app behind the build-directory symlink.
          app_path="$(python3 -c 'from pathlib import Path; print(Path("build/macos/Build/Products/Release/Pleazyng.app").resolve(strict=True))')"
          spctl --assess --type execute --verbose=4 "$app_path"

      - name: Create DMG
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: |
          mkdir -p dmg-staging
          cp -R build/macos/Build/Products/Release/Pleazyng.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -format ULMO -srcfolder dmg-staging -volname "Pleazyng" pleazyng-macos.dmg

      - name: Check Sparkle signing key
        id: sparkle-signing
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: |
          if [[ -n "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign DMG for Sparkle (EdDSA)
        if: steps.sparkle-signing.outputs.available == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: |
          printf -- "-----BEGIN ED25519 PRIVATE KEY-----\n%s\n-----END ED25519 PRIVATE KEY-----\n" "$SPARKLE_PRIVATE_KEY" > ed25519_key.pem
          OUTPUT=$(dart run auto_updater:sign_update pleazyng-macos.dmg ed25519_key.pem)
          rm ed25519_key.pem
          # Extract edSignature value from output like: sparkle:edSignature="..." length="..."
          SIGNATURE=$(echo "$OUTPUT" | grep -o 'edSignature="[^"]*"' | sed 's/edSignature="//;s/"//')
          echo "MACOS_ED_SIGNATURE=$SIGNATURE" >> $GITHUB_ENV
          echo "MACOS_DMG_SIZE=$(stat -f%z pleazyng-macos.dmg)" >> $GITHUB_ENV

      - name: Write macOS signature metadata
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: |
          echo "${{ env.MACOS_ED_SIGNATURE }}" > macos-ed-signature.txt
          echo "${{ env.MACOS_DMG_SIZE }}" > macos-dmg-size.txt

      - name: Copy macOS deliverables to the workflow workspace
        working-directory: ${{ env.PLEZYNG_APPLE_WORKSPACE }}
        run: |
          set -euo pipefail
          if [[ "$PLEZYNG_APPLE_WORKSPACE" != "$GITHUB_WORKSPACE" ]]; then
            cp -f pleazyng-macos.dmg macos-ed-signature.txt macos-dmg-size.txt "$GITHUB_WORKSPACE/"
          fi

      - name: Attest macOS DMG
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: pleazyng-macos.dmg

      - name: Attest recovered macOS compilation provenance
        if: inputs.macos_compilation_job_id != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: macos-compilation-recovery.json

      - name: Upload macOS DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-dmg
          path: |
            pleazyng-macos.dmg
            macos-ed-signature.txt
            macos-dmg-size.txt
            macos-compilation-recovery.json

      - name: Remove successful macOS recovery snapshot
        if: success() && steps.macos-compilation-cache.outputs.path != ''
        continue-on-error: true
        env:
          SNAPSHOT_PATH: ${{ steps.macos-compilation-cache.outputs.path }}
        run: python3 scripts/retain_macos_app.py discard "$SNAPSHOT_PATH"

      - name: Remove short macOS build workspace
        if: always() && env.PLEZYNG_APPLE_TASK_ROOT != ''
        shell: bash
        env:
          APPLE_JIT_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [[ "$APPLE_JIT_JOB_STATUS" == cancelled ]]; then
            bash scripts/cleanup_apple_jit_scratch.sh macos
            exit 0
          fi
          short_root="$PLEZYNG_APPLE_TASK_ROOT"
          if [[ -d "$short_root" && ! -L "$short_root" && "$(cd "$short_root" && pwd -P)" == "$short_root" ]]; then
            if [[ -d "$short_root/macos/Pods" ]]; then
              mkdir -p "$GITHUB_WORKSPACE/macos"
              ditto "$short_root/macos/Pods" "$GITHUB_WORKSPACE/macos/Pods"
            fi
            bash scripts/cleanup_apple_jit_scratch.sh macos
          elif [[ -e "$short_root" || -L "$short_root" ]]; then
            echo "Refusing to remove unexpected Apple build path: $short_root" >&2
            exit 1
          fi

  build-windows:
    if: ${{ always() && !cancelled() && needs.validate-trusted-ref.result == 'success' && inputs.reuse_platform_run_id == '' && inputs.runner_pool == 'private' && (inputs.action == 'build' || inputs.action == 'release') && needs.validate-trusted-ref.outputs.runner_pool == 'private' && (needs.validate-trusted-ref.outputs.action == 'build' || needs.validate-trusted-ref.outputs.action == 'release') && needs.validate-trusted-ref.outputs.mode == 'release' }}
    needs: validate-trusted-ref
    name: Build Windows (${{ matrix.arch }})
    runs-on: ${{ needs.validate-trusted-ref.outputs.execution_profile == 'hybrid' && (matrix.arch == 'arm64' && 'windows-11-vs2026-arm' || 'windows-2025') || fromJSON(format('{{"group":"packer-windows","labels":["self-hosted","Windows","X64","on-demand","packer-windows","Pleazyng","gha-{0}-{1}-build-windows"]}}', github.run_id, strategy.job-index)) }}
    env:
      GH_TOKEN: ${{ github.token }}
      PLEZYNG_ALLOW_DIRECT_DOWNLOADS: ${{ needs.validate-trusted-ref.outputs.execution_profile == 'hybrid' && '1' || '0' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate-trusted-ref.outputs.execution_profile == 'hybrid' && '{"include":[{"arch":"x64","flutter_setup":"action","native_cache_path":"build/windows/x64/_deps"},{"arch":"arm64","flutter_setup":"git","native_cache_path":"build/windows/arm64/_deps"}]}' || '{"include":[{"arch":"x64","flutter_setup":"action","native_cache_path":"build/windows/x64/_deps"}]}') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.recovery_source_sha || github.sha }}
          # The pinned Opus CMake version probe calls git describe.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "temurin"
          java-version: "21"
          architecture: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x64' }}

      - name: Provision and verify pinned Windows build tools
        shell: pwsh
        run: |
          .\windows\tool\prepare-build-toolchain.ps1
          .\windows\tool\prepare-build-toolchain.ps1 -VerifyOnly

      - name: Cache Windows native dependencies
        id: windows-native-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ matrix.native_cache_path }}
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-windows-native-${{ github.event.repository.name }}-${{ matrix.arch }}-${{ hashFiles('windows/CMakeLists.txt', 'mpv-build.lock.json', 'windows/tool/build-toolchain.lock.json') }}

      - name: Load pinned Flutter SDK
        shell: pwsh
        run: python3 scripts/flutter/load_sdk_pin.py --github-env

      - name: Setup Flutter
        id: setup_flutter_windows
        if: matrix.flutter_setup == 'action'
        uses: ./.github/actions/setup-flutter-windows
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache-key: "${{ env.TRUSTED_BUILD_CACHE_VERSION }}-flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Set up Flutter from its pinned commit
        if: matrix.flutter_setup == 'git'
        uses: ./.github/actions/setup-flutter-git

      - name: Select Visual Studio 2026 generator for hybrid ARM64
        if: needs.validate-trusted-ref.outputs.execution_profile == 'hybrid' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          'CMAKE_GENERATOR=Visual Studio 18 2026' >> $env:GITHUB_ENV

      - name: Install pinned NVIDIA CUDA Toolkit (Windows x64)
        if: inputs.subtitle_gpu_backend == 'cuda' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'cuda_13.4.3_windows_network.exe'
          Invoke-WebRequest -Uri 'https://developer.download.nvidia.com/compute/cuda/13.4.3/network_installers/cuda_13.4.3_windows_network.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'NVIDIA Corporation') {
            throw "CUDA installer signature is not valid for NVIDIA Corporation: $($signature.Status)"
          }
          $arguments = @('-s', 'nvcc_13.4', 'cublas_13.4', 'cublas_dev_13.4', 'cudart_13.4')
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "CUDA Toolkit installer failed with exit code $($process.ExitCode)"
          }

          $cudaRoot = Join-Path $env:ProgramFiles 'NVIDIA GPU Computing Toolkit\CUDA\v13.4'
          foreach ($requiredPath in @('bin\nvcc.exe', 'include\cublas_v2.h', 'lib\x64\cublas.lib')) {
            if (-not (Test-Path -LiteralPath (Join-Path $cudaRoot $requiredPath) -PathType Leaf)) {
              throw "CUDA Toolkit component is missing: $requiredPath"
            }
          }
          "CUDA_PATH=$cudaRoot" >> $env:GITHUB_ENV
          (Join-Path $cudaRoot 'bin') >> $env:GITHUB_PATH

      - name: Install pinned LunarG Vulkan SDK (Windows x64)
        if: inputs.subtitle_gpu_backend == 'vulkan' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'vulkansdk-windows-X64-1.4.363.0.exe'
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'vulkan-sdk\1.4.363.0'
          Invoke-WebRequest -Uri 'https://sdk.lunarg.com/sdk/download/1.4.363.0/windows/vulkan_sdk.exe?Human=true' -OutFile $installer
          $expected = '94a82d378f7a5e3e54c9db7d2fb7016af136e14ac0a18dbf0f2f67a36352d141'
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Vulkan SDK SHA-256 mismatch: $actual"
          }

          $process = Start-Process -FilePath $installer -ArgumentList @(
            '--root', $sdkRoot, '--accept-licenses', '--default-answer',
            '--confirm-command', 'install', 'copy_only=1'
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Vulkan SDK installer failed with exit code $($process.ExitCode)"
          }
          $compiler = Join-Path $sdkRoot 'Bin\glslc.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Vulkan SDK did not install glslc: $compiler"
          }
          "VULKAN_SDK=$sdkRoot" >> $env:GITHUB_ENV
          (Join-Path $sdkRoot 'Bin') >> $env:GITHUB_PATH

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~\AppData\Local\Pub\Cache
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get --enforce-lockfile --no-example

      - name: Prefetch checksum-pinned Windows native downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare_native_downloads.py --sqlite-platform windows --arch '${{ matrix.arch }}'

      - name: Build the pinned Whisper ARM64 backend with Clang
        if: needs.validate-trusted-ref.outputs.execution_profile == 'hybrid' && matrix.arch == 'arm64'
        shell: pwsh
        run: python scripts/prepare_windows_arm64_whisper.py

      - name: Install patched Flutter engine (DComp)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flutter precache --windows
          .\windows\tool\install-patched-engine.ps1

      - name: Download and verify pinned Windows libmpv archive
        shell: pwsh
        env:
          PLEZYNG_WINDOWS_CURL_PATH: ${{ steps.setup_flutter_windows.outputs.windows_curl_path }}
        run: .\windows\tool\download-pinned-mpv.ps1 -Architecture '${{ matrix.arch }}'

      - name: Download and verify pinned Windows simdutf source archive
        shell: pwsh
        run: .\windows\tool\download-pinned-simdutf.ps1

      - name: Download and verify pinned Windows WinSparkle archive
        shell: pwsh
        run: .\windows\tool\download-pinned-winsparkle.ps1

      - name: Download and verify pinned Windows SDL3 archive
        shell: pwsh
        run: .\windows\tool\download-pinned-sdl3.ps1

      - name: Download and verify pinned Windows torrent dependencies
        shell: pwsh
        run: .\windows\tool\download-pinned-torrent-dependencies.ps1

      - name: Configure repository updater trust root
        shell: pwsh
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: dart run scripts/configure_updater.dart

      - name: Build bundled MilkRust for Windows
        shell: pwsh
        run: python scripts/visualizer/build_runtime.py --platform windows --architectures "${{ matrix.arch }}" --output build/visualizer-native

      - name: Build Windows ${{ matrix.arch }}
        id: windows-build
        shell: pwsh
        env:
          FLUTTER_WHISPER_GPU_BACKEND: ${{ inputs.subtitle_gpu_backend == 'vulkan' && matrix.arch == 'x64' && 'VULKAN' || inputs.subtitle_gpu_backend == 'cuda' && matrix.arch == 'x64' && 'CUDA' || 'CPU' }}
        run: flutter build windows --release ${{ env.RELEASE_DART_DEFINES }} ${{ env.NATIVE_UPDATER_DEFINE }} --dart-define=SUPPORTER_MODE=unlocked --split-debug-info=debug-info/windows-${{ matrix.arch }}

      - name: Diagnose failed Windows CMake installation
        if: ${{ failure() && steps.windows-build.outcome == 'failure' }}
        shell: pwsh
        run: |
          $buildDir = "build/windows/${{ matrix.arch }}"
          $installScript = Join-Path $buildDir 'cmake_install.cmake'
          if (-not (Test-Path -LiteralPath $installScript -PathType Leaf)) {
            Write-Host "CMake install script was not generated: $installScript"
            exit 0
          }

          $logPath = Join-Path $env:RUNNER_TEMP 'pleazyng-windows-cmake-install-diagnostics.log'
          $previousVerbose = $env:VERBOSE
          $env:VERBOSE = '1'
          try {
            & cmake --install $buildDir --config Release --verbose *> $logPath
            $installExit = $LASTEXITCODE
          } finally {
            $env:VERBOSE = $previousVerbose
          }
          Get-Content -LiteralPath $logPath -Tail 180
          Write-Host "Verbose CMake install retry exit code: $installExit"

      - name: Verify Windows bundle contents
        shell: pwsh
        run: |
          $bundleDir = "build/windows/${{ matrix.arch }}/runner/Release"
          if (-not (Test-Path -LiteralPath $bundleDir -PathType Container)) {
            throw "Windows bundle directory does not exist: $bundleDir"
          }

          $bundlePath = (Resolve-Path -LiteralPath $bundleDir).Path
          $foundFiles = @(
            Get-ChildItem -LiteralPath $bundlePath -File -Recurse |
              ForEach-Object {
                $_.FullName.Substring($bundlePath.Length + 1).Replace('\', '/')
              } |
              Sort-Object
          )

          Write-Host "Files found in ${bundleDir}:"
          $foundFiles | ForEach-Object { Write-Host "  $_" }

          $requiredFiles = @(
            "pleazyng.exe"
            "flutter_windows.dll"
            "sqlite3.dll"
            "libmpv-2.dll"
            "data/app.so"
            "data/icudtl.dat"
            "data/flutter_assets/NativeAssetsManifest.json"
            # MSVC runtime bundled by InstallRequiredSystemLibraries in
            # windows/CMakeLists.txt; without it the app crashes at startup on
            # machines whose system-wide redist is older than the CI toolset.
            "msvcp140.dll"
            "vcruntime140.dll"
          )
          $forbiddenFiles = @(
            "plezy.lib"
            "plezy.exp"
            "simdutf.lib"
          )

          $bundleErrors = @()
          foreach ($file in $requiredFiles) {
            if ($foundFiles -notcontains $file) {
              Write-Output "::error::Required Windows bundle file is missing: $file"
              $bundleErrors += "missing $file"
            }
          }
          foreach ($file in $forbiddenFiles) {
            if ($foundFiles -contains $file) {
              Write-Output "::error::Forbidden link by-product is present in the Windows bundle: $file"
              $bundleErrors += "present $file"
            }
          }
          # Release links emit PDBs for diagnostics; none may ship in the bundle.
          foreach ($file in @($foundFiles | Where-Object { $_ -like '*.pdb' })) {
            Write-Output "::error::Forbidden debug file is present in the Windows bundle: $file"
            $bundleErrors += "present $file"
          }

          # sentry.dll is the inproc-backend native SDK; crashpad_handler.exe is
          # intentionally absent (windows/CMakeLists.txt sets
          # SENTRY_NATIVE_BACKEND=inproc), so do not assert on it here.

          if ($bundleErrors.Count -gt 0) {
            throw "Windows bundle verification failed: $($bundleErrors -join '; ')"
          }

      - name: Upload ${{ matrix.arch }} build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-${{ matrix.arch }}-build
          path: build/windows/${{ matrix.arch }}/runner/Release/

      - name: Build separate Microsoft Store trial and unlock payload
        if: ${{ vars.MSSTORE_PACKAGE_NAME != '' && vars.MSSTORE_PUBLISHER != '' && vars.MSSTORE_PUBLISHER_DISPLAY_NAME != '' }}
        shell: pwsh
        env:
          MSSTORE_LIFETIME_PRODUCT_ID: ${{ vars.MSSTORE_LIFETIME_PRODUCT_ID }}
          FLUTTER_WHISPER_GPU_BACKEND: ${{ inputs.subtitle_gpu_backend == 'vulkan' && matrix.arch == 'x64' && 'VULKAN' || inputs.subtitle_gpu_backend == 'cuda' && matrix.arch == 'x64' && 'CUDA' || 'CPU' }}
        run: python scripts/build_microsoft_store.py --arch "${{ matrix.arch }}"

      - name: Upload Microsoft Store ${{ matrix.arch }} payload
        if: ${{ vars.MSSTORE_PACKAGE_NAME != '' && vars.MSSTORE_PUBLISHER != '' && vars.MSSTORE_PUBLISHER_DISPLAY_NAME != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-store-${{ matrix.arch }}-build
          path: build/windows/${{ matrix.arch }}/runner/Release/
          if-no-files-found: error

  package-windows:
    if: ${{ inputs.reuse_platform_run_id == '' && inputs.runner_pool == 'private' && (inputs.action == 'build' || inputs.action == 'release') && needs.validate-trusted-ref.outputs.runner_pool == 'private' && (needs.validate-trusted-ref.outputs.action == 'build' || needs.validate-trusted-ref.outputs.action == 'release') && needs.validate-trusted-ref.outputs.mode == 'release' }}
    needs: [validate-trusted-ref, build-windows]
    runs-on: ${{ needs.validate-trusted-ref.outputs.execution_profile == 'hybrid' && 'windows-2025' || fromJSON(format('{{"group":"packer-windows","labels":["self-hosted","Windows","X64","on-demand","packer-windows","Pleazyng","gha-{0}-package-windows"]}}', github.run_id)) }}
    permissions:
      id-token: write
      attestations: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.recovery_source_sha || github.sha }}
          persist-credentials: false

      - name: Provision and verify pinned Windows build tools
        shell: pwsh
        run: |
          .\windows\tool\prepare-build-toolchain.ps1 -IncludeInstaller
          .\windows\tool\prepare-build-toolchain.ps1 -IncludeInstaller -VerifyOnly

      - name: Load pinned Flutter SDK
        shell: pwsh
        run: python3 scripts/flutter/load_sdk_pin.py --github-env

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter-windows
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache-key: "${{ env.TRUSTED_BUILD_CACHE_VERSION }}-flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get --enforce-lockfile --no-example

      - name: Download x64 build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-x64-build
          path: build-x64

      - name: Read version from pubspec
        id: version
        shell: bash
        run: |
          VERSION=$(python3 scripts/pubspec_version.py pubspec.yaml)
          echo "version=${VERSION%%+*}" >> "$GITHUB_OUTPUT"

      - name: Build installer and portables
        run: .\windows\build-installer.ps1 -X64BuildDir "build-x64" -Version "${{ steps.version.outputs.version }}"

      - name: Download Microsoft Store x64 payload
        if: ${{ vars.MSSTORE_PACKAGE_NAME != '' && vars.MSSTORE_PUBLISHER != '' && vars.MSSTORE_PUBLISHER_DISPLAY_NAME != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-store-x64-build
          path: build-store-x64

      - name: Download Microsoft Store arm64 payload
        if: ${{ vars.MSSTORE_PACKAGE_NAME != '' && vars.MSSTORE_PUBLISHER != '' && vars.MSSTORE_PUBLISHER_DISPLAY_NAME != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-store-arm64-build
          path: build-store-arm64

      - name: Build Microsoft Store MSIX bundle
        if: ${{ vars.MSSTORE_PACKAGE_NAME != '' && vars.MSSTORE_PUBLISHER != '' && vars.MSSTORE_PUBLISHER_DISPLAY_NAME != '' }}
        env:
          MSSTORE_PACKAGE_NAME: ${{ vars.MSSTORE_PACKAGE_NAME }}
          MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
          MSSTORE_LIFETIME_PRODUCT_ID: ${{ vars.MSSTORE_LIFETIME_PRODUCT_ID }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          .\windows\build-msix.ps1 `
            -X64BuildDir "build-store-x64" `
            -Arm64BuildDir "build-store-arm64" `
            -LifetimeProductId $env:MSSTORE_LIFETIME_PRODUCT_ID `
            -Version $env:RELEASE_VERSION `
            -IdentityName $env:MSSTORE_PACKAGE_NAME `
            -Publisher $env:MSSTORE_PUBLISHER `
            -PublisherDisplayName $env:MSSTORE_PUBLISHER_DISPLAY_NAME

      - name: Sign installer for Microsoft Store submissions
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64) -and [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)) {
            Write-Host 'Windows Authenticode signing is not configured; the installer will not be ready for Microsoft Store submission.'
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)) {
            throw 'Configure both WINDOWS_SIGNING_CERTIFICATE_BASE64 and WINDOWS_SIGNING_CERTIFICATE_PASSWORD.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'pleazyng-authenticode.pfx'
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
            $signtoolCommand = Get-Command signtool.exe -ErrorAction SilentlyContinue
            $signtoolPath = if ($null -ne $signtoolCommand) { $signtoolCommand.Source } else { $null }
            if ($null -eq $signtoolPath) {
              $signtoolFile = Get-ChildItem "$env:ProgramFiles(x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse -ErrorAction Stop |
                Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
                Sort-Object FullName -Descending |
                Select-Object -First 1
              if ($null -ne $signtoolFile) { $signtoolPath = $signtoolFile.FullName }
            }
            if ($null -eq $signtoolPath) { throw 'Could not find signtool.exe on the Windows runner.' }
            & $signtoolPath sign /fd SHA256 /f $pfxPath /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 pleazyng-windows-installer.exe
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed with exit code $LASTEXITCODE" }
            & $signtoolPath verify /pa /all pleazyng-windows-installer.exe
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signature verification failed with exit code $LASTEXITCODE" }
          } finally {
            Remove-Item -Path $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Package Chocolatey release
        id: chocolatey-package
        continue-on-error: true
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate-trusted-ref.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.validate-trusted-ref.outputs.version }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_VERSION -ne $env:PACKAGE_VERSION) {
            throw "Chocolatey package version $env:PACKAGE_VERSION does not match release version $env:RELEASE_VERSION"
          }
          $installer = Get-Item 'pleazyng-windows-installer.exe'
          $checksum = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$($installer.Name)"
          $installPath = 'packaging\chocolatey\tools\chocolateyinstall.ps1'
          $installScript = Get-Content $installPath -Raw
          $installScript = $installScript.Replace('__PLEZYNG_RELEASE_URL__', $url)
          $installScript = $installScript.Replace('__PLEZYNG_SHA256__', $checksum)
          if ($installScript.Contains('__PLEZYNG_')) { throw 'Chocolatey package template still contains a placeholder.' }
          Set-Content -Path $installPath -Value $installScript -Encoding utf8
          $nuspecPath = 'packaging\chocolatey\pleazyng.nuspec'
          $nuspec = Get-Content $nuspecPath -Raw
          $nuspec = $nuspec -replace '<version>[^<]+</version>', "<version>$env:PACKAGE_VERSION</version>"
          Set-Content -Path $nuspecPath -Value $nuspec -Encoding utf8
          New-Item -ItemType Directory -Force 'release-packages' | Out-Null
          choco pack $nuspecPath --outputdirectory release-packages
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey pack failed with exit code $LASTEXITCODE" }
          $package = Get-Item "release-packages\pleazyng.$env:PACKAGE_VERSION.nupkg"
          if ($null -eq $package) { throw 'Chocolatey package was not created.' }

      - name: Check Sparkle signing key
        id: sparkle-signing
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SPARKLE_PRIVATE_KEY)) {
            "available=false" >> $env:GITHUB_OUTPUT
          } else {
            "available=true" >> $env:GITHUB_OUTPUT
          }

      - name: Sign installer for WinSparkle (EdDSA)
        if: steps.sparkle-signing.outputs.available == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "plezy-winsparkle-ed25519.pem"
          try {
            Set-Content -Path $keyPath -Value $env:SPARKLE_PRIVATE_KEY -Encoding ascii -NoNewline
            $output = & dart run auto_updater:sign_update pleazyng-windows-installer.exe $keyPath
            if ($LASTEXITCODE -ne 0) {
              throw "WinSparkle signer failed with exit code $LASTEXITCODE"
            }
            $match = [regex]::Match($output, 'edSignature="([^"]*)"')
            if (-not $match.Success) {
              throw "WinSparkle signer returned no EdDSA signature"
            }
            Set-Content -Path win-ed-signature.txt -Value $match.Groups[1].Value -Encoding ascii -NoNewline
            Set-Content -Path win-installer-size.txt -Value (Get-Item pleazyng-windows-installer.exe).Length.ToString() -Encoding ascii -NoNewline
          } finally {
            Remove-Item -Path $keyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Attest Windows artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            pleazyng-windows-x64-portable.7z
            pleazyng-windows-installer.exe

      - name: Attest Microsoft Store bundle
        if: ${{ vars.MSSTORE_PACKAGE_NAME != '' && vars.MSSTORE_PUBLISHER != '' && vars.MSSTORE_PUBLISHER_DISPLAY_NAME != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: pleazyng-windows.msixbundle

      - name: Attest Chocolatey package
        if: steps.chocolatey-package.outcome == 'success'
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release-packages/pleazyng.${{ steps.version.outputs.version }}.nupkg

      - name: Upload x64 portable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x64-portable
          path: pleazyng-windows-x64-portable.7z

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-installer
          path: |
            pleazyng-windows-installer.exe
            win-ed-signature.txt
            win-installer-size.txt

      - name: Upload Microsoft Store bundle
        if: ${{ vars.MSSTORE_PACKAGE_NAME != '' && vars.MSSTORE_PUBLISHER != '' && vars.MSSTORE_PUBLISHER_DISPLAY_NAME != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-msix
          path: pleazyng-windows.msixbundle

      - name: Upload Chocolatey package
        if: steps.chocolatey-package.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-chocolatey
          path: release-packages/pleazyng.*.nupkg

  build-linux:
    if: ${{ always() && !cancelled() && needs.validate-trusted-ref.result == 'success' && (inputs.reuse_platform_run_id == '' || inputs.rebuild_linux) && inputs.runner_pool == 'private' && (inputs.action == 'build' || inputs.action == 'release') && needs.validate-trusted-ref.outputs.runner_pool == 'private' && (needs.validate-trusted-ref.outputs.action == 'build' || needs.validate-trusted-ref.outputs.action == 'release') && needs.validate-trusted-ref.outputs.mode == 'release' }}
    needs: validate-trusted-ref
    name: Build Linux (${{ matrix.arch }})
    runs-on: ${{ needs.validate-trusted-ref.outputs.execution_profile == 'hybrid' && (matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04') || (matrix.arch == 'x64' && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-pleazyng","ng-main-run-{0}","gha-{0}-{1}-build-linux"]}}', github.run_id, strategy.job-index))) || fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","arm64","ng-shared-main-pleazyng","ng-main-run-{0}","gha-{0}-{1}-build-linux"]}}', github.run_id, strategy.job-index)) }}
    permissions:
      id-token: write
      attestations: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            flutter_channel: stable
            pkg_config_arch: x86_64-linux-gnu
            snap_arch: amd64
          - arch: arm64
            flutter_channel: master
            pkg_config_arch: aarch64-linux-gnu
            snap_arch: arm64
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.recovery_source_sha || github.sha }}
          persist-credentials: false

      - name: Load pinned Flutter SDK
        shell: bash
        run: python3 scripts/flutter/load_sdk_pin.py --github-env

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ matrix.flutter_channel }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: "${{ env.TRUSTED_BUILD_CACHE_VERSION }}-flutter-:os:-:channel:-:version:-:arch:-:hash:"
          pub-cache: false

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Configure hosted Ubuntu package sources
        shell: bash
        run: sudo python3 scripts/configure_hosted_apt.py '${{ runner.environment }}'

      - name: Cache APT packages
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # latest
        with:
          packages: ${{ env.LINUX_APT_PACKAGES }}
          version: trusted-build-v1.1

      - name: Install Linux dependencies
        shell: bash
        run: |
          read -r -a packages <<< "$LINUX_APT_PACKAGES"

          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y -o Acquire::Retries=3 "${packages[@]}"; then
              exit 0
            fi

            sudo apt-get clean
            sudo rm -rf /var/lib/apt/lists/*
            sleep $((attempt * 15))
          done

          exit 1

      - name: Install pinned LunarG Vulkan SDK (Linux x64)
        if: inputs.subtitle_gpu_backend == 'vulkan' && matrix.arch == 'x64'
        shell: bash
        run: |
          set -euo pipefail
          sdk_archive="$RUNNER_TEMP/vulkansdk-linux-x86_64-1.4.363.0.tar.xz"
          curl -fL --retry 5 --retry-all-errors \
            "https://sdk.lunarg.com/sdk/download/1.4.363.0/linux/vulkan_sdk.tar.xz?Human=true" \
            -o "$sdk_archive"
          echo "197962f5cbf80baf2775a03336a01cee7c8745686c65aaa70d3f751ade4d7e43  $sdk_archive" | sha256sum --check
          sdk_extract="$RUNNER_TEMP/vulkan-sdk"
          mkdir -p "$sdk_extract"
          tar -xf "$sdk_archive" -C "$sdk_extract"
          # LunarG ships setup-env.sh with the tarball; export its toolchain for later steps.
          source "$sdk_extract/1.4.363.0/setup-env.sh"
          test -x "$VULKAN_SDK/bin/glslc"
          {
            echo "VULKAN_SDK=$VULKAN_SDK"
            echo "PATH=$PATH"
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
            echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
            echo "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH"
            echo "VK_ADD_LAYER_PATH=$VK_ADD_LAYER_PATH"
            echo "FLUTTER_WHISPER_GPU_BACKEND=VULKAN"
          } >> "$GITHUB_ENV"

      - name: Cache libmpv prefix
        id: libmpv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: libmpv-prefix
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-libmpv-${{ runner.arch }}-${{ hashFiles('mpv-build.lock.json', 'scripts/fetch_linux_libmpv.py') }}

      # The prebuilt prefix from our unified mpv-build repo: the script reads
      # the asset and expected SHA-256 from the lock and verifies the bytes
      # before a single one is extracted. The tarball is a self-relocating
      # prefix tree (lib/ or lib/<triplet>/ with the libmpv.so* chain,
      # lib/libshaderc_shared.so*, lib/libvulkan.so*, include/, and pkgconfig/ dirs with
      # ${pcfiledir}-relative roots), so the downstream PKG_CONFIG_PATH,
      # bundle-copy, and find steps are unchanged.
      - name: Fetch libmpv
        env:
          GH_TOKEN: ${{ github.token }}
        if: steps.libmpv-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          command -v zstd >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd; }
          python3 scripts/fetch_linux_libmpv.py --dest libmpv-prefix

      - name: Install fpm
        shell: bash
        env:
          EXECUTION_PROFILE: ${{ needs.validate-trusted-ref.outputs.execution_profile }}
        run: |
          if [[ "$EXECUTION_PROFILE" == "hybrid" ]]; then
            sudo gem install fpm --version 1.17.0 --no-document
            exit $?
          fi
          proxy="${HTTPS_PROXY:-${https_proxy:-}}"
          if [[ -z "$proxy" ]]; then
            echo "The private JIT HTTPS proxy is required to install fpm." >&2
            exit 1
          fi
          sudo env \
            HTTP_PROXY="${HTTP_PROXY:-$proxy}" \
            HTTPS_PROXY="$proxy" \
            http_proxy="${http_proxy:-${HTTP_PROXY:-$proxy}}" \
            https_proxy="${https_proxy:-$proxy}" \
            gem install fpm --version 1.17.0 --no-document

      - name: Install dependencies
        shell: bash
        run: flutter pub get --enforce-lockfile --no-example

      - name: Prefetch checksum-pinned Linux native downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_native_downloads.py --sqlite-platform linux --cmake-deps --arch '${{ matrix.arch }}'

      - name: Cache locked offline HDR10 and SDR tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/plezyng/dv-tools
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-dv-tools-${{ runner.arch }}-${{ hashFiles('tools/dv-engine/offline-runtime.lock.json') }}

      - name: Build bundled MilkRust for Linux
        shell: bash
        run: python3 scripts/visualizer/build_runtime.py --platform linux --architectures "${{ matrix.arch }}" --output build/visualizer-native

      - name: Build Linux ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n ${VULKAN_SDK:-} ]]; then
            export PKG_CONFIG_PATH="$VULKAN_SDK/share/pkgconfig:$VULKAN_SDK/lib/pkgconfig:$PKG_CONFIG_PATH"
          fi
          flutter build linux --release ${{ env.RELEASE_DART_DEFINES }} --dart-define=SUPPORTER_MODE=unlocked --split-debug-info=debug-info/linux-${{ matrix.arch }}
        env:
          FLUTTER_WHISPER_GPU_BACKEND: ${{ inputs.subtitle_gpu_backend == 'vulkan' && matrix.arch == 'x64' && 'VULKAN' || 'CPU' }}
          PKG_CONFIG_PATH: ${{ github.workspace }}/libmpv-prefix/lib/pkgconfig:${{ github.workspace }}/libmpv-prefix/lib/${{ matrix.pkg_config_arch }}/pkgconfig

      - name: Resolve bundle directory
        shell: bash
        run: |
          if [[ "${{ matrix.arch }}" == "x64" ]]; then
            bundle_dir=build/linux/x64/release/bundle
          else
            bundle_dir=$(find build/linux -path "*/release/bundle" -type d | head -1)
          fi
          if [[ -z "$bundle_dir" || ! -d "$bundle_dir" ]]; then
            echo "ERROR: Linux bundle directory not found" >&2
            exit 1
          fi
          echo "BUNDLE_DIR=$bundle_dir" >> "$GITHUB_ENV"

      - name: Install and verify locked Sherpa ONNX libraries
        shell: bash
        run: python3 linux/packaging/install-sherpa-onnx-runtime.py "$BUNDLE_DIR" --arch "${{ matrix.arch }}"

      # Everything below resolves the bundle *before* packaging, so the packages
      # and the tarball are cut from one identical tree.
      #
      # The plane needs the pinned Wayland-enabled libmpv: a distro libmpv still
      # plays and still does HDR, but silently drops hwdec to vaapi-copy - which
      # was measured, not assumed. So libmpv travels with us and no artifact
      # depends on a host one. That removed the host `mpv` dependency, and with it
      # the transitive pull of everything libmpv itself needs - libass, pulse,
      # pipewire, fontconfig and the rest. bundle-libs.sh is what supplies those,
      # so it has to run before packaging too, or the packages would carry libmpv
      # and nothing it links.
      - name: Copy libmpv into bundle
        shell: bash
        run: |
          BUNDLE_LIB="$BUNDLE_DIR/lib"
          LIBMPV_DIR=$(dirname "$(find libmpv-prefix -name 'libmpv.so' | head -1)")
          cp -a "$LIBMPV_DIR"/libmpv.so* "$BUNDLE_LIB/"
          cp -a libmpv-prefix/lib/libshaderc_shared.so* "$BUNDLE_LIB/"
          cp -a libmpv-prefix/lib/libvulkan.so* "$BUNDLE_LIB/"

      - name: Verify native visualizer and music PCM in Linux bundle
        shell: bash
        run: python3 scripts/visualizer/check_linux_bundle.py "$BUNDLE_DIR"

      - name: Bundle shared libraries
        shell: bash
        run: bash linux/packaging/bundle-libs.sh "$BUNDLE_DIR"

      - name: Copy wrapper script into bundle
        shell: bash
        run: bash linux/packaging/prepare-bundle-launcher.sh "$BUNDLE_DIR"

      # Same check the package smoke build runs, against the artifact that
      # actually ships: a library nobody declares is a broken install, and it is
      # invisible until a user on a clean machine tries to launch.
      #
      # This also stands in for the `ldd ./plezy | grep "not found"` step that
      # used to run after packaging. That one folded ldd's stderr into grep's
      # input and dropped its exit status, so ldd failing outright - a missing
      # loader, an exec-format mismatch, no ldd at all - left the match empty and
      # printed "All dependencies resolved." This guard runs ldd over every
      # object under lib/ as well as the executable, fails on an unresolved
      # soname, fails when ldd cannot read an object, and refuses to pass when
      # the walk found no host libraries at all. Packaging below only reads the
      # bundle, so a second shell ldd afterwards could only restate a weaker
      # subset of what this already proved about the very same tree.
      - name: Verify every unbundled library the bundle needs is declared
        shell: bash
        run: python3 linux/packaging/check-bundle-host-deps.py "$BUNDLE_DIR"

      # Last, from the fully resolved tree above. The host-dependency guard is
      # skipped because the named step above just ran it against this same
      # bundle; the internal run exists for by-hand packaging outside CI.
      - name: Build Linux Packages
        shell: bash
        run: |
          BUILD_DIR="$BUNDLE_DIR" \
          ARCH_SUFFIX=${{ matrix.arch }} \
          OUTPUT_DIR="$GITHUB_WORKSPACE" \
          PLEZY_SKIP_HOST_DEP_CHECK=1 \
          python3 linux/packaging/build-packages.py

      # The depends lists reached fpm above; only the packages it wrote can show
      # they arrived. Same script the smoke build runs, so the two jobs cannot
      # drift on what counts as declared - and unlike the smoke build, this one
      # covers arm64 and the artifacts users actually install.
      - name: Verify the declared dependencies reached the package metadata
        shell: bash
        run: python3 linux/packaging/check-package-deps.py "$GITHUB_WORKSPACE" --arch ${{ matrix.arch }}

      - name: Install Flatpak packaging dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          python3 scripts/retry_flatpak.py remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          python3 scripts/retry_flatpak.py install --user --noninteractive -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Build Flatpak bundle
        shell: bash
        run: python3 linux/packaging/build-flatpak.py --bundle "$BUNDLE_DIR" --arch ${{ matrix.arch }} --output "$GITHUB_WORKSPACE"

      - name: Prepare Snap package inputs
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-trusted-ref.outputs.version }}
        run: |
          set -euo pipefail
          snap_dir=linux/packaging/snap
          rm -rf "$snap_dir/src"
          mkdir -p "$snap_dir/src" "$snap_dir/gui"
          cp -a "$BUNDLE_DIR"/. "$snap_dir/src/"
          install -Dm755 linux/packaging/pleazyng.sh "$snap_dir/pleazyng.sh"
          cp linux/packaging/snap/pleazyng.desktop "$snap_dir/gui/pleazyng.desktop"
          cp assets/pleazyng.png "$snap_dir/gui/pleazyng.png"
          sed -i "s/^version: .*/version: '$RELEASE_TAG'/" "$snap_dir/snapcraft.yaml"

      - name: Build Snap package
        id: snap
        shell: bash
        run: bash scripts/build_snap.sh '${{ matrix.snap_arch }}'
        env:
          PLEZYNG_ALLOW_PUBLIC_SNAP: ${{ needs.validate-trusted-ref.outputs.execution_profile == 'hybrid' && 'true' || 'false' }}

      - name: Name Snap artifact
        env:
          SNAP_PATH: ${{ steps.snap.outputs.snap }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: cp "$SNAP_PATH" "pleazyng-linux-${ARCH}.snap"

      - name: Build x64 AppImage
        if: matrix.arch == 'x64'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-trusted-ref.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! command -v zsyncmake >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends zsync
          fi
          bash scripts/build_appimage.sh "$BUNDLE_DIR" "$GITHUB_WORKSPACE" "$RELEASE_TAG" "$GITHUB_REPOSITORY"

      - name: Attest x64 AppImage
        if: matrix.arch == 'x64'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            pleazyng-linux-x86_64.AppImage
            pleazyng-linux-x86_64.AppImage.zsync

      - name: Verify installed Flatpak runtime dependencies
        shell: bash
        run: |
          flatpak install --user --noninteractive "pleazyng-linux-${{ matrix.arch }}.flatpak"
          dbus-run-session -- python3 linux/packaging/check-flatpak.py --arch ${{ matrix.arch }}

      - name: Include standalone app icon in portable bundle
        shell: bash
        run: cp assets/pleazyng.png "$BUNDLE_DIR/pleazyng.png"

      - name: Create tarball
        shell: bash
        run: |
          cd "$BUNDLE_DIR"
          tar -czf "$GITHUB_WORKSPACE/pleazyng-linux-${{ matrix.arch }}.tar.gz" *

      - name: Attest Linux ${{ matrix.arch }} artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            pleazyng-linux-${{ matrix.arch }}.tar.gz
            pleazyng-linux-${{ matrix.arch }}.deb
            pleazyng-linux-${{ matrix.arch }}.rpm
            pleazyng-linux-${{ matrix.arch }}.pkg.tar.zst
            pleazyng-linux-${{ matrix.arch }}.flatpak
            pleazyng-linux-${{ matrix.arch }}.snap

      - name: Upload Linux ${{ matrix.arch }} artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            pleazyng-linux-${{ matrix.arch }}.tar.gz
            pleazyng-linux-${{ matrix.arch }}.deb
            pleazyng-linux-${{ matrix.arch }}.rpm
            pleazyng-linux-${{ matrix.arch }}.pkg.tar.zst
            pleazyng-linux-${{ matrix.arch }}.flatpak
            pleazyng-linux-${{ matrix.arch }}.snap

      - name: Upload x64 AppImage artifact
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-x64-appimage
          path: |
            pleazyng-linux-x86_64.AppImage
            pleazyng-linux-x86_64.AppImage.zsync

  create-release:
    needs: [validate-trusted-ref, build-android, build-webos, build-tizen, build-ios, build-tvos, build-macos, build-windows, package-windows, build-linux]
    if: ${{ always() && inputs.runner_pool == 'private' && inputs.action == 'release' && needs.validate-trusted-ref.outputs.runner_pool == 'private' && needs.validate-trusted-ref.outputs.action == 'release' && needs.validate-trusted-ref.outputs.mode == 'release' && needs.validate-trusted-ref.result == 'success' && (needs.build-android.result == 'success' || (inputs.reuse_android_run_id != '' && needs.validate-trusted-ref.outputs.android_source_sha != '' && needs.build-android.result == 'skipped')) && ((inputs.reuse_platform_run_id == '' && needs.build-ios.result == 'success' && needs.build-tvos.result == 'success' && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' && needs.package-windows.result == 'success' && needs.build-linux.result == 'success' && (needs.build-webos.result == 'success' || (needs.validate-trusted-ref.outputs.include_webos_build != 'true' && needs.validate-trusted-ref.outputs.include_webos_release != 'true' && needs.build-webos.result == 'skipped')) && (needs.build-tizen.result == 'success' || (needs.validate-trusted-ref.outputs.include_tizen_build != 'true' && needs.build-tizen.result == 'skipped'))) || (inputs.reuse_platform_run_id != '' && needs.validate-trusted-ref.outputs.reuse_source_sha != '' && ((inputs.rebuild_ios && needs.build-ios.result == 'success') || (!inputs.rebuild_ios && needs.build-ios.result == 'skipped')) && ((inputs.rebuild_tvos && needs.build-tvos.result == 'success') || (!inputs.rebuild_tvos && needs.build-tvos.result == 'skipped')) && ((inputs.rebuild_macos && needs.build-macos.result == 'success') || (!inputs.rebuild_macos && needs.build-macos.result == 'skipped')) && needs.build-windows.result == 'skipped' && needs.package-windows.result == 'skipped' && ((inputs.rebuild_linux && needs.build-linux.result == 'success') || (!inputs.rebuild_linux && needs.build-linux.result == 'skipped')) && (needs.build-webos.result == 'success' || (inputs.reuse_webos_run_id != '' && needs.validate-trusted-ref.outputs.webos_source_sha != '' && needs.build-webos.result == 'skipped') || (inputs.reuse_macos_package_run_id != '' && needs.validate-trusted-ref.outputs.reuse_source_sha != '' && needs.build-webos.result == 'skipped') || (needs.validate-trusted-ref.outputs.include_webos_build != 'true' && needs.validate-trusted-ref.outputs.include_webos_release != 'true' && needs.build-webos.result == 'skipped')) && needs.build-tizen.result == 'skipped')) && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ${{ needs.validate-trusted-ref.outputs.execution_profile == 'hybrid' && 'ubuntu-24.04' || fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-pleazyng","ng-main-run-{0}","gha-{0}-create-release"]}}', github.run_id)) }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.recovery_source_sha || github.sha }}
          sparse-checkout: |
            CHANGELOG.md
            UPSTREAM_ATTRIBUTION.md
            pubspec.yaml
            scripts/**
            docs/maintainers/capability-manifest.json
            Casks/snapetech-pleazyng.rb.template
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Validate release assembly imports
        run: |
          python3 -c "import sys; sys.path.insert(0, 'scripts'); import recover_release_platforms, release_all_platforms, verify_webos_link_patch"

      - name: Read version from pubspec.yaml
        id: version
        run: |
          VERSION=$(python3 scripts/pubspec_version.py pubspec.yaml)
          BUILD_NUMBER=${VERSION#*+}
          VERSION=${VERSION%%+*}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Generate release notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ needs.validate-trusted-ref.outputs.version }}
        run: |
          python3 scripts/generate_release_notes.py "$RELEASE_TAG" > release-notes.md
          # Keep the complete credit ledger within GitHub's release-body limit.
          python3 - <<'PYNOTES'
          import os
          from pathlib import Path
          notes = Path('release-notes.md')
          body = notes.read_text()
          budget = 120000 - len(Path('UPSTREAM_ATTRIBUTION.md').read_text()) - 1000
          if len(body) > budget:
              if budget < 1000:
                  raise SystemExit('Attribution ledger exceeds the release-body budget')
              body = body[:budget].rsplit('\n\n', 1)[0]
              tag = 'v' + os.environ['RELEASE_TAG']
              body += f'\n\nRelease notes continue in the [full changelog](https://github.com/snapetech-org/pleazyng/blob/{tag}/CHANGELOG.md).\n'
              notes.write_text(body)
          PYNOTES
          printf '\n\n## Upstream people and sources\n\n' >> release-notes.md
          printf '[Tag-pinned attribution ledger](https://github.com/snapetech-org/pleazyng/blob/v%s/UPSTREAM_ATTRIBUTION.md)\n\n' "$RELEASE_TAG" >> release-notes.md
          cat UPSTREAM_ATTRIBUTION.md >> release-notes.md
          grep -q '^# Upstream source attribution' release-notes.md

      - name: Recover verified platform artifacts
        if: ${{ inputs.reuse_platform_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD_LINUX: ${{ inputs.rebuild_linux }}
          REBUILD_MACOS: ${{ inputs.rebuild_macos }}
          REBUILD_TVOS: ${{ inputs.rebuild_tvos }}
          REBUILD_IOS: ${{ inputs.rebuild_ios }}
          REPAIRED_RUN: ${{ inputs.reuse_repaired_run_id }}
          WEBOS_RUN: ${{ inputs.reuse_webos_run_id }}
          SOURCE_RUN: ${{ inputs.reuse_platform_run_id }}
          ANDROID_RUN: ${{ inputs.reuse_android_run_id }}
          MACOS_RUN: ${{ inputs.reuse_macos_package_run_id }}
          HEAD_SHA: ${{ inputs.recovery_source_sha || github.sha }}
          PACKAGING_SHA: ${{ inputs.recovery_source_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          VERSION: ${{ needs.validate-trusted-ref.outputs.version }}
          APPLE_STORE: ${{ needs.validate-trusted-ref.outputs.include_apple_store_build }}
          HOMEBREW: ${{ needs.validate-trusted-ref.outputs.prepare_homebrew_cask }}
          WEBOS_BUILD: ${{ needs.validate-trusted-ref.outputs.include_webos_build }}
        run: |
          options=()
          if [[ -n "$PACKAGING_SHA" ]]; then options+=(--packaging-source-sha "$PACKAGING_SHA" --workflow-source-sha "$WORKFLOW_SHA"); fi
          if [[ "$APPLE_STORE" == true ]]; then options+=(--include-apple-store-build); fi
          if [[ "$REBUILD_LINUX" == true ]]; then options+=(--rebuild-linux); fi
          if [[ "$REBUILD_MACOS" == true ]]; then options+=(--rebuild-macos); fi
          if [[ "$REBUILD_TVOS" == true ]]; then options+=(--rebuild-tvos); fi
          if [[ "$REBUILD_IOS" == true ]]; then options+=(--rebuild-ios); fi
          if [[ -n "$REPAIRED_RUN" ]]; then
            if [[ -n "$PACKAGING_SHA" ]]; then
              if [[ "$REPAIRED_RUN" =~ ^tvos:([1-9][0-9]*),ios:([1-9][0-9]*)$ ]]; then
                options+=(--tvos-run "${BASH_REMATCH[1]}" --ios-run "${BASH_REMATCH[2]}")
              elif [[ "$REPAIRED_RUN" =~ ^[1-9][0-9]*$ ]]; then
                options+=(--tvos-run "$REPAIRED_RUN")
              else
                echo "Invalid signed Apple sibling source identities." >&2
                exit 1
              fi
            else
              options+=(--repaired-run "$REPAIRED_RUN")
            fi
          fi
          if [[ -n "$WEBOS_RUN" ]]; then options+=(--webos-run "$WEBOS_RUN"); fi
          if [[ "$HOMEBREW" == true ]]; then options+=(--require-homebrew-cask); fi
          if [[ -n "$ANDROID_RUN" ]]; then options+=(--android-run "$ANDROID_RUN"); fi
          if [[ -n "$MACOS_RUN" ]]; then options+=(--macos-run "$MACOS_RUN"); fi
          if [[ "$WEBOS_BUILD" != true ]]; then options+=(--skip-webos-build); fi
          python3 scripts/recover_release_platforms.py "$SOURCE_RUN" --head-sha "$HEAD_SHA" --version "$VERSION" --download artifacts --wait-for-source 10800 "${options[@]}"

      - name: Download Android artifacts
        if: ${{ inputs.reuse_android_run_id == '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-apk
          path: artifacts/android-apk

      - name: Download WebOS artifact
        if: ${{ inputs.reuse_macos_package_run_id == '' && inputs.reuse_webos_run_id == '' && needs.validate-trusted-ref.outputs.include_webos_release == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: webos-ipk
          path: artifacts/webos

      - name: Give the WebOS checksum manifest a unique release filename
        if: ${{ needs.validate-trusted-ref.outputs.include_webos_release == 'true' }}
        run: mv artifacts/webos/SHA256SUMS.txt artifacts/webos/webos-SHA256SUMS.txt

      - name: Download Tizen ARM tester handoff
        if: ${{ inputs.reuse_platform_run_id == '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pleazyng-tizen-arm-experimental
          path: artifacts/tizen

      - name: Verify and archive Tizen tester handoff
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.validate-trusted-ref.outputs.reuse_source_sha || github.sha }}
        run: |
          set -euo pipefail
          package_dir=artifacts/tizen
          package_name=pleazyng-tizen-arm-tester.tpk
          (
            cd "$package_dir"
            sha256sum --check "$package_name.sha256"
          )
          python3 - "$package_dir" "$EXPECTED_SOURCE_COMMIT" <<'PY'
          import json
          import pathlib
          import sys
          import zipfile

          package_dir = pathlib.Path(sys.argv[1])
          expected_commit = sys.argv[2]
          package_name = "pleazyng-tizen-arm-tester.tpk"
          required = [
              package_name,
              package_name + ".sha256",
              package_name + ".json",
              "pubspec-tizen.lock",
              "native-build.json",
              "pleazyng-tizen-arm-native-sources.tar.gz",
              "package.py",
              "toolchain.json",
              "tizen-tester.md",
          ]
          missing = [name for name in required if not (package_dir / name).is_file()]
          if missing:
              raise SystemExit(f"Tizen tester handoff is missing: {missing}")

          report = json.loads((package_dir / (package_name + ".json")).read_text())
          if report.get("source_commit") != expected_commit:
              raise SystemExit("Tizen tester package was built from a different source commit")
          if report.get("source_dirty") is not False:
              raise SystemExit("Tizen tester package source tree was not clean")
          if report.get("signing") != "development-only-requires-tv-resigning":
              raise SystemExit("Tizen tester package has unexpected signing status")
          if report.get("tv_install_verified") is not False:
              raise SystemExit("Tizen tester package must remain explicitly unqualified")

          destination = package_dir / "pleazyng-tizen-arm-tester-handoff.zip"
          with zipfile.ZipFile(destination, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for name in required:
                  archive.write(package_dir / name, arcname=name)
          print(f"Verified Tizen tester package source and created {destination}")
          PY

      - name: Download iOS artifact
        if: ${{ inputs.reuse_platform_run_id == '' || inputs.rebuild_ios }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ios-ipa
          path: artifacts/ios-ipa

      - name: Download tvOS artifact
        if: ${{ inputs.reuse_platform_run_id == '' || inputs.rebuild_tvos }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tvos-ipa
          path: artifacts/tvos-ipa

      - name: Download macOS artifact
        if: ${{ inputs.reuse_platform_run_id == '' || inputs.rebuild_macos }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: macos-dmg
          path: artifacts/macos-dmg

      - name: Download Windows x64 artifact
        if: ${{ inputs.reuse_platform_run_id == '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-x64-portable
          path: artifacts/windows-x64-portable

      - name: Download native Windows ARM64 build
        if: ${{ inputs.reuse_platform_run_id == '' && needs.validate-trusted-ref.outputs.execution_profile == 'hybrid' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-arm64-build
          path: artifacts/windows-arm64-build

      - name: Package native Windows ARM64 portable archive
        if: ${{ needs.validate-trusted-ref.outputs.execution_profile == 'hybrid' }}
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/windows-arm64-build/pleazyng.exe
          if find artifacts/windows-arm64-build -type f -iname '*.pdb' -print -quit | grep -q .; then
            echo "The Windows ARM64 release payload must not contain debug symbols." >&2
            exit 1
          fi
          mkdir -p artifacts/windows-arm64-portable
          (cd artifacts/windows-arm64-build && zip -q -r ../windows-arm64-portable/pleazyng-windows-arm64-portable.zip .)
          unzip -tq artifacts/windows-arm64-portable/pleazyng-windows-arm64-portable.zip

      - name: Attest native Windows ARM64 portable archive
        if: ${{ needs.validate-trusted-ref.outputs.execution_profile == 'hybrid' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: artifacts/windows-arm64-portable/pleazyng-windows-arm64-portable.zip

      - name: Download Windows installer artifact
        if: ${{ inputs.reuse_platform_run_id == '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-installer
          path: artifacts/windows-installer

      - name: Download Microsoft Store bundle
        if: ${{ inputs.reuse_platform_run_id == '' && vars.MSSTORE_PACKAGE_NAME != '' && vars.MSSTORE_PUBLISHER != '' && vars.MSSTORE_PUBLISHER_DISPLAY_NAME != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-msix
          path: artifacts/windows-msix

      - name: Download Chocolatey package
        continue-on-error: true
        if: ${{ inputs.reuse_platform_run_id == '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-chocolatey
          path: artifacts/windows-chocolatey

      - name: Download Linux x64 artifacts
        if: ${{ inputs.reuse_platform_run_id == '' || inputs.rebuild_linux }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux-x64
          path: artifacts/linux-x64

      - name: Download Linux arm64 artifacts
        if: ${{ inputs.reuse_platform_run_id == '' || inputs.rebuild_linux }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux-arm64
          path: artifacts/linux-arm64

      - name: Download x64 AppImage artifact
        if: ${{ inputs.reuse_platform_run_id == '' || inputs.rebuild_linux }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux-x64-appimage
          path: artifacts/linux-x64

      - name: Verify AppImage update contracts before publication
        # Recovered immutable releases can predate update metadata. Images
        # that advertise updates always require a matching sidecar.
        run: python3 scripts/verify_appimage_update.py --directory artifacts --repository "$GITHUB_REPOSITORY" --allow-legacy

      - name: Verify Tizen handoff before publication
        run: test -s artifacts/tizen/pleazyng-tizen-arm-tester-handoff.zip

      - name: Require every release platform before publication
        run: python3 scripts/release_coverage.py --directory artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Generate WinGet manifest bundle
        id: winget-manifests
        continue-on-error: true
        env:
          RELEASE_TAG: ${{ needs.validate-trusted-ref.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.validate-trusted-ref.outputs.version }}
        run: python3 scripts/generate_winget_manifests.py "$RELEASE_VERSION" artifacts/windows-installer/pleazyng-windows-installer.exe artifacts --release-tag "$RELEASE_TAG"

      - name: Generate release SHA-256 checksums
        run: |
          python3 scripts/create_release_checksums.py artifacts
          if [[ -f artifacts/platform-reuse-provenance.json ]]; then
            (cd artifacts && sha256sum platform-reuse-provenance.json >> SHA256SUMS.txt)
          fi

      - name: Generate Homebrew Cask candidate
        if: ${{ needs.validate-trusted-ref.outputs.prepare_homebrew_cask == 'true' }}
        env:
          RELEASE_VERSION: ${{ needs.validate-trusted-ref.outputs.version }}
        run: |
          mkdir -p artifacts/homebrew
          python3 scripts/generate_homebrew_cask.py \
            --version "$RELEASE_VERSION" \
            --checksums artifacts/SHA256SUMS.txt \
            --output artifacts/homebrew/snapetech-pleazyng.rb

      - name: Attest release manifests and checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            artifacts/SHA256SUMS.txt

      - name: Attest WinGet manifests
        if: steps.winget-manifests.outcome == 'success'
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: artifacts/pleazyng-winget-manifests-${{ needs.validate-trusted-ref.outputs.version }}.zip

      - name: Attest Homebrew Cask candidate
        if: ${{ needs.validate-trusted-ref.outputs.prepare_homebrew_cask == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: artifacts/homebrew/snapetech-pleazyng.rb

      - name: Generate appcast.xml
        env:
          RELEASE_TAG: ${{ needs.validate-trusted-ref.outputs.release_tag }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_NUMBER="${{ steps.version.outputs.build_number }}"

          # Read macOS signature metadata (may be empty if secrets not configured)
          MACOS_ED_SIG=""
          MACOS_DMG_SIZE="0"
          if [ -f artifacts/macos-dmg/macos-ed-signature.txt ]; then
            MACOS_ED_SIG=$(cat artifacts/macos-dmg/macos-ed-signature.txt)
          fi
          if [ -f artifacts/macos-dmg/macos-dmg-size.txt ]; then
            MACOS_DMG_SIZE=$(cat artifacts/macos-dmg/macos-dmg-size.txt)
          fi

          # Read Windows signature metadata (may be empty if secrets not configured)
          WIN_ED_SIG=""
          WIN_INSTALLER_SIZE="0"
          if [ -f artifacts/windows-installer/win-ed-signature.txt ]; then
            WIN_ED_SIG=$(cat artifacts/windows-installer/win-ed-signature.txt)
          fi
          if [ -f artifacts/windows-installer/win-installer-size.txt ]; then
            WIN_INSTALLER_SIZE=$(cat artifacts/windows-installer/win-installer-size.txt)
          fi

          cat > appcast.xml << XMLEOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Plezy Updates</title>
              <item>
                <title>Version ${VERSION}</title>
                <sparkle:version>${BUILD_NUMBER}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:releaseNotesLink>${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}</sparkle:releaseNotesLink>
          XMLEOF

          # macOS enclosure
          if [ -n "$MACOS_ED_SIG" ]; then
            cat >> appcast.xml << XMLEOF
                <enclosure url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/pleazyng-macos.dmg"
                           length="${MACOS_DMG_SIZE}" type="application/octet-stream"
                           sparkle:edSignature="${MACOS_ED_SIG}"
                           sparkle:os="macos" />
          XMLEOF
          fi

          # Windows enclosure
          if [ -n "$WIN_ED_SIG" ]; then
            cat >> appcast.xml << XMLEOF
                <enclosure url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/pleazyng-windows-installer.exe"
                           length="${WIN_INSTALLER_SIZE}" type="application/octet-stream"
                           sparkle:edSignature="${WIN_ED_SIG}"
                           sparkle:installerArguments="/SILENT /SP-"
                           sparkle:os="windows" />
          XMLEOF
          fi

          cat >> appcast.xml << 'XMLEOF'
              </item>
            </channel>
          </rss>
          XMLEOF

          # Clean up leading whitespace from heredoc indentation
          sed -i 's/^          //' appcast.xml

          echo "Generated appcast.xml:"
          cat appcast.xml

      - name: Collect release files
        id: release-files
        env:
          RELEASE_VERSION: ${{ needs.validate-trusted-ref.outputs.version }}
          INCLUDE_WEBOS_RELEASE: ${{ needs.validate-trusted-ref.outputs.include_webos_release }}
          EXECUTION_PROFILE: ${{ needs.validate-trusted-ref.outputs.execution_profile }}
          PREPARE_HOMEBREW_CASK: ${{ needs.validate-trusted-ref.outputs.prepare_homebrew_cask }}
        run: |
          {
            echo 'files<<EOF'
            echo artifacts/android-apk/pleazyng-android-arm64-v8a.tar.gz
            echo artifacts/android-apk/pleazyng-android-armeabi-v7a.tar.gz
            echo artifacts/android-apk/pleazyng-android-x86_64.tar.gz
            if [[ "$INCLUDE_WEBOS_RELEASE" == "true" ]]; then
              echo artifacts/webos/*.ipk
              echo artifacts/webos/webos-SHA256SUMS.txt
              echo artifacts/webos/pleazyng-lg-webos-submission.zip
            fi
            echo artifacts/ios-ipa/pleazyng-ios-unsigned.ipa
            if [ -f artifacts/ios-ipa/pleazyng-ios-appstore.ipa ]; then
              echo artifacts/ios-ipa/pleazyng-ios-appstore.ipa
            fi
            echo artifacts/tvos-ipa/pleazyng-tvos-unsigned.ipa
            if [ -f artifacts/tvos-ipa/pleazyng-tvos-appstore.ipa ]; then
              echo artifacts/tvos-ipa/pleazyng-tvos-appstore.ipa
            fi
            echo artifacts/macos-dmg/pleazyng-macos.dmg
            echo artifacts/windows-x64-portable/pleazyng-windows-x64-portable.7z
            if [[ "$EXECUTION_PROFILE" == "hybrid" ]]; then
              echo artifacts/windows-arm64-portable/pleazyng-windows-arm64-portable.zip
            fi
            echo artifacts/windows-installer/pleazyng-windows-installer.exe
            if [ -f artifacts/windows-msix/pleazyng-windows.msixbundle ]; then
              echo artifacts/windows-msix/pleazyng-windows.msixbundle
            fi
            for channel_package in artifacts/windows-chocolatey/pleazyng.*.nupkg; do
              if [[ -f "$channel_package" ]]; then echo "$channel_package"; fi
            done
            if [[ -f "artifacts/pleazyng-winget-manifests-${RELEASE_VERSION}.zip" ]]; then
              echo "artifacts/pleazyng-winget-manifests-${RELEASE_VERSION}.zip"
            fi
            echo artifacts/tizen/pleazyng-tizen-arm-tester-handoff.zip
            if [ -f artifacts/android-apk/pleazyng-android-play.aab ]; then
              echo artifacts/android-apk/pleazyng-android-play.aab
            fi
            echo artifacts/android-apk/pleazyng-amazon-firetv.apk
            echo artifacts/android-apk/pleazyng-amazon-firetv-provenance.json
            echo 'artifacts/linux-x64/*'
            echo 'artifacts/linux-arm64/*'
            echo appcast.xml
            echo artifacts/SHA256SUMS.txt
            if [[ -f artifacts/platform-reuse-provenance.json ]]; then
              echo artifacts/platform-reuse-provenance.json
            fi
            if [[ "$PREPARE_HOMEBREW_CASK" == "true" ]]; then
              echo artifacts/homebrew/snapetech-pleazyng.rb
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Verify existing immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-trusted-ref.outputs.release_tag }}
          EXPECTED_RELEASE_COMMIT: ${{ needs.validate-trusted-ref.outputs.release_commit }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['RELEASE_TAG']
          expected = os.environ['EXPECTED_RELEASE_COMMIT']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag) or not re.fullmatch(r'[0-9a-f]{40}', expected):
              raise ValueError('Missing validated release tag or source commit')
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}'], text=True))
          obj = api(f'git/ref/tags/{tag}')['object']
          for _ in range(8):
              if obj['type'] == 'commit':
                  if obj['sha'] != expected:
                      raise ValueError('Immutable release tag changed after source validation')
                  break
              if obj['type'] != 'tag' or not re.fullmatch(r'[0-9a-f]{40}', obj['sha']):
                  raise ValueError('Unexpected release tag object')
              obj = api(f"git/tags/{obj['sha']}")['object']
          else:
              raise ValueError('Release tag nesting exceeds the verification limit')
          print(f'Existing {tag} still resolves to the validated source {expected}.')
          PY

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: ${{ steps.release-files.outputs.files }}
          body_path: release-notes.md
          draft: true
          prerelease: false
          name: ${{ needs.validate-trusted-ref.outputs.release_tag }}
          tag_name: ${{ needs.validate-trusted-ref.outputs.release_tag }}
          # The verified existing tag fixes the source. Using the default branch
          # here avoids GitHub's workflow-write check on historical target SHAs;
          # this parameter is unused when the tag already exists.
          target_commitish: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
