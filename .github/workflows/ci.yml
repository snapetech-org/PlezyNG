# ng-runner-policy: private-jit-only-v1
name: CI - Sanity Checks
run-name: ${{ format('action:{0}:pool:{1}', inputs.action, inputs.runner_pool) }}

# Validation is opt-in: choose a ref from Actions and dispatch this workflow.
on:
  workflow_dispatch:
    inputs:
      action:
        description: CI action authorized by the private JIT runner policy
        required: true
        type: choice
        options: [ci]
      runner_pool:
        description: Runner pool for this workflow
        required: true
        type: choice
        options: [private]
      build_linux_packages:
        description: >
          Manually smoke-build Linux packages when changing linux/packaging.
          This is separate from release assets and does not run on ordinary pushes.
        default: false
        type: boolean

env:
  # Only place this workflow names the SDK; .github/actions/setup-flutter-git pins the same release.
  FLUTTER_VERSION: "3.47.1"

jobs:
  # These jobs use trusted private JIT pools. Public fork PRs must use a
  # disposable isolated workflow and must never execute on these runners.
  analyze:
    name: Code Analysis
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-plezyng","ng-main-run-{0}","gha-{0}-analyze"]}}', github.run_id)) }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Manual CI skips changelog range checks, so avoid fetching all history on ephemeral runners.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 1 || 0 }}
          persist-credentials: false

      - name: Validate changelog entry
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          CHANGELOG_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CHANGELOG_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$CHANGELOG_BASE" || "$CHANGELOG_BASE" =~ ^0+$ ]]; then
            echo "No previous commit is available for changelog range validation."
            exit 0
          fi
          python3 scripts/changelog.py validate --mode range --base "$CHANGELOG_BASE" --head "$CHANGELOG_HEAD"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-v3-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang build-essential cmake
          flutter pub get

      - name: Install wakelock_plus development dependencies
        working-directory: packages/wakelock_plus
        run: flutter pub get --enforce-lockfile --no-example

      - name: Verify generated files committed
        run: scripts/codegen.sh --check

      - name: Verify translation hygiene
        run: |
          python3 scripts/checks/clean_translations.py --check --strict
          python3 scripts/checks/check_localizations.py
          python3 scripts/codegen/generate_localized_quantities.py --check
          python3 scripts/codegen/generate_platform_locales.py --check

      - name: Verify workflow and script guards
        run: bash scripts/ci_guard_checks.sh

      - name: Verify formatting
        run: |
          paths=(lib)
          [ ! -d test ] || paths+=(test)
          find "${paths[@]}" -name "*.dart" ! -name "*.g.dart" ! -name "*.freezed.dart" -type f -print0 |
            xargs -0 -r dart format --output=none --set-exit-if-changed

      - name: Verify icon consistency
        run: dart run scripts/checks/check_icon_consistency.dart

      - name: Analyze code
        run: dart run scripts/checks/check_analyzer.dart

      - name: Check for unused code
        run: |
          echo "🔍 Checking for unused code..."
          dart run dart_code_linter:metrics check-unused-code lib 2>&1 | tee unused_code.txt
          if grep -qi "no unused code found" unused_code.txt; then
            echo "✅ No unused code found"
          else
            echo "❌ Found unused code:"
            cat unused_code.txt
            exit 1
          fi

      - name: Check for unused files
        run: |
          echo "🔍 Checking for unused files..."
          dart run dart_code_linter:metrics check-unused-files lib 2>&1 | tee unused_files.txt
          if grep -qi "no unused files found" unused_files.txt; then
            echo "✅ No unused files found"
          else
            echo "❌ Found unused files:"
            cat unused_files.txt
            exit 1
          fi

  test:
    name: Unit Tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-plezyng","ng-main-run-{0}","gha-{0}-test"]}}', github.run_id)) }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-v3-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}

      - name: Install unit test system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang build-essential ffmpeg

      - name: Install dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Run tests
        run: |
          if [ -d "test" ] && [ "$(find test -name '*_test.dart' | wc -l)" -gt 0 ]; then
            # Drift-backed tests can exceed package:test's 30s default on busy JIT workers.
            scripts/run_tests.sh -j 2 --timeout=120s
          else
            echo "No tests found, skipping test execution"
          fi

      - name: Setup Node for reader browser checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/reader-tests/package-lock.json

      - name: Install reader browser dependencies
        working-directory: tools/reader-tests
        run: |
          npm ci --ignore-scripts
          npm exec -- playwright install --with-deps chromium

      - name: Run real reader browser checks
        working-directory: tools/reader-tests
        run: npm test

      - name: Install wakelock_plus test dependencies
        working-directory: packages/wakelock_plus
        run: flutter pub get --enforce-lockfile

      - name: Run wakelock_plus VM tests
        working-directory: packages/wakelock_plus
        run: flutter test test/wakelock_plus_linux_plugin_test.dart

      - name: Configure Flutter Chrome executable
        working-directory: tools/reader-tests
        run: |
          browser_path="$(node -p "require('playwright').chromium.executablePath()")"
          test -x "$browser_path"
          printf 'CHROME_EXECUTABLE=%s\n' "$browser_path" >> "$GITHUB_ENV"

      - name: Run wakelock_plus Chrome tests
        working-directory: packages/wakelock_plus
        run: flutter test --platform chrome --dart-define=WEB_PLUGIN_TESTS=true test/wakelock_plus_web_plugin_test.dart

      # The vendored atomic-write patch has to keep the upstream contract, not
      # just the new behaviour. Upstream's own suites are the check for that.
      - name: Run the vendored desktop preference store tests
        run: |
          for pkg in shared_preferences_linux shared_preferences_windows; do
            (cd "packages/$pkg" && flutter pub get --enforce-lockfile && flutter test)
          done

  android-test:
    name: Android JVM and Native Tests
    needs: test
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-plezyng","ng-main-run-{0}","gha-{0}-android-test"]}}', github.run_id)) }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configure Gradle to use the private JIT proxy
        run: python3 scripts/prepare_android_sdk.py proxy

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false

      - name: Install all pinned Android module toolchains
        run: python3 scripts/prepare_android_sdk.py install

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-v3-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android local properties
        run: printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_HOME" > android/local.properties

      # CodeQL runs inside this private JIT job using advanced setup. Repository
      # default setup must be disabled so the tagged scan can upload SARIF.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: cpp, java-kotlin
          build-mode: manual

      - name: Verify Android host native test toolchain
        run: |
          python3 - <<'PY'
          import shutil
          import sys

          required = ("clang", "clang++", "cmake", "ninja", "make", "c++")
          missing = [tool for tool in required if shutil.which(tool) is None]
          if missing:
              print(
                  "The private Android test runner is missing pre-provisioned native tools: "
                  + ", ".join(missing),
                  file=sys.stderr,
              )
              raise SystemExit(1)
          for tool in required:
              print(f"{tool}: {shutil.which(tool)}")
          PY

      - name: Configure Android host native tests
        run: |
          cmake -S android/app/src/test/cpp -B build/android-host-tests \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build Android host native tests
        run: cmake --build build/android-host-tests --parallel 2

      - name: Run Android host native tests
        run: |
          ctest --test-dir build/android-host-tests \
            --output-on-failure --no-tests=error

      - name: Run Android JVM unit tests
        working-directory: android
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            log_file="$RUNNER_TEMP/android-jvm-tests-${attempt}.log"
            ./gradlew :app:testDebugUnitTest :saf_util:testDebugUnitTest :libass:testDebugUnitTest \
              -x :app:compileFlutterBuildDebug --continue --console=plain \
              -Dorg.gradle.internal.http.connectionTimeout=60000 \
              -Dorg.gradle.internal.http.socketTimeout=120000 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi
            echo "::group::Android Gradle failure resource diagnostics (attempt $attempt)"
            date --iso-8601=seconds
            free -h
            df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
            df -i "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
            for file in /proc/pressure/memory /proc/pressure/io \
                        /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.high \
                        /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.events; do
              if [[ -r "$file" ]]; then
                echo "== $file =="
                cat "$file"
              fi
            done
            dmesg --time-format=iso 2>/dev/null \
              | grep -Ei 'out of memory|oom-kill|killed process' \
              | tail -20
            echo "::endgroup::"
            if ! grep -Eiq 'Could not (GET|download)|Read timed out|Connection reset|Connection timed out|UnknownHostException|Temporary failure in name resolution|No route to host|ProxyError|tunnel.*failed' "$log_file"; then
              exit "$status"
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Gradle still failed after three attempts because a dependency download could not complete."
              exit "$status"
            fi
            delay=$((attempt * 20))
            echo "Transient Gradle dependency download failure; retrying the Android JVM tests in ${delay}s (attempt ${attempt}/3)."
            sleep "$delay"
          done

      - name: Check Android API compatibility
        working-directory: android
        run: ./gradlew :app:lintDebug

      - name: Verify Games embedded manifests and cancellation patches
        run: python3 -m unittest discover -s scripts/games -p 'test_*.py'

      - name: Build embedded Moonlight and Steam Android modules
        working-directory: android
        run: ./gradlew :moonlight:assembleDebug :steam:assembleDebug :steam:testDebugUnitTest --stacktrace

      - name: Upload CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:android

  native-format:
    name: Native Formatting
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(format('{{"group":"private-apple-builds","labels":["self-hosted","macOS","ARM64","private-apple","ng-shared-main-plezyng","ng-main-run-{0}","gha-{0}-native-format"]}}', github.run_id)) }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Verify native formatting
        run: scripts/format_native.sh --check

  linux-native-test:
    name: Linux native reliability (${{ matrix.sanitizer }})
    needs: [test, android-test, server]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-plezyng","ng-main-run-{0}","gha-{0}-{1}-linux-native-test"]}}', github.run_id, strategy.job-index)) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - sanitizer: address
            lifecycle_sanitizers: ON
          - sanitizer: thread
            lifecycle_sanitizers: OFF
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Linux native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev liblzma-dev \
            libstdc++-12-dev libmpv-dev libepoxy-dev libcurl4-openssl-dev libevdev-dev \
            libwayland-dev libegl-dev libvulkan-dev mesa-vulkan-drivers \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Prepare Flutter Linux configuration
        run: |
          flutter pub get --enforce-lockfile --no-example
          flutter build linux --debug --config-only --no-pub

      - name: Configure Linux native reliability tests
        run: |
          cmake -S linux -B build/linux-native-${{ matrix.sanitizer }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPLEZY_BUILD_MPV_PLAYER_LIFECYCLE_TESTS=ON \
            -DPLEZY_MPV_LIFECYCLE_SANITIZERS=${{ matrix.lifecycle_sanitizers }} \
            -DPLEZY_BUILD_MPV_RELIABILITY_TESTS=ON \
            -DPLEZY_MPV_RELIABILITY_SANITIZER=${{ matrix.sanitizer }}

      # `plezy` is the runner itself. Without it nothing in CI ever compiles
      # my_application.cc, mpv_plugin.cc or the Wayland video plane — the
      # reliability test targets each pull in only a couple of translation units,
      # so a break in the rest of linux/runner reached a release build unseen.
      - name: Build Linux native reliability tests
        run: |
          cmake --build build/linux-native-${{ matrix.sanitizer }} --parallel 2 --target \
            plezy \
            mpv_player_lifecycle_test \
            mpv_player_hdr_output_test \
            mpv_property_result_contract_test \
            hdr_metadata_test \
            plane_geometry_test \
            video_params_test \
            experimental_render_api_test \
            plane_render_executor_test

      # Older TSan runtimes reject randomized mappings when Linux uses more
      # than 28 bits of mmap entropy. Change it only when this JIT VM permits it.
      - name: Set ThreadSanitizer-compatible ASLR entropy
        if: matrix.sanitizer == 'thread'
        run: |
          echo "PLEZY_TSAN_RUNNABLE=true" >> "$GITHUB_ENV"
          if ! current_bits="$(sysctl -n vm.mmap_rnd_bits)" || [[ ! "$current_bits" =~ ^[0-9]+$ ]]; then
            echo "PLEZY_TSAN_RUNNABLE=false" >> "$GITHUB_ENV"
            echo "::warning::This JIT kernel does not expose vm.mmap_rnd_bits; ThreadSanitizer runtime tests are skipped."
            exit 0
          fi
          if [ "$current_bits" -gt 28 ]; then
            if ! sudo -n sysctl -w vm.mmap_rnd_bits=28; then
              echo "PLEZY_TSAN_RUNNABLE=false" >> "$GITHUB_ENV"
              echo "::warning::This JIT kernel does not permit changing vm.mmap_rnd_bits; ThreadSanitizer runtime tests are skipped."
              exit 0
            fi
          fi
          if ! configured_bits="$(sysctl -n vm.mmap_rnd_bits)" || [[ ! "$configured_bits" =~ ^[0-9]+$ ]]; then
            echo "PLEZY_TSAN_RUNNABLE=false" >> "$GITHUB_ENV"
            echo "::warning::This JIT kernel does not expose vm.mmap_rnd_bits; ThreadSanitizer runtime tests are skipped."
            exit 0
          fi
          if [ "$configured_bits" -gt 28 ]; then
            echo "PLEZY_TSAN_RUNNABLE=false" >> "$GITHUB_ENV"
            echo "::warning::ThreadSanitizer runtime tests are skipped because vm.mmap_rnd_bits is $configured_bits and cannot be lowered."
          fi

      - name: Run Linux native reliability tests
        if: ${{ matrix.sanitizer != 'thread' || env.PLEZY_TSAN_RUNNABLE == 'true' }}
        run: |
          ctest --test-dir build/linux-native-${{ matrix.sanitizer }} \
            --output-on-failure --no-tests=error

      - name: Prepare pinned Steam sources
        if: matrix.sanitizer == 'address'
        run: python3 scripts/games/prepare_steam.py

      - name: Configure Steam transport tests with sanitizers
        if: matrix.sanitizer == 'address'
        run: |
          cmake -S native/games/steam -B build/games-steam-tests \
            -DPLEZY_STEAM_TESTS=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'

      - name: Build Steam transport tests
        if: matrix.sanitizer == 'address'
        run: cmake --build build/games-steam-tests --parallel 2

      - name: Run Steam transport and adapter tests
        if: matrix.sanitizer == 'address'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/games-steam-tests --output-on-failure

  apple-native-test:
    name: Apple native reliability (${{ matrix.platform }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(format('{{"group":"private-apple-builds","labels":["self-hosted","macOS","ARM64","private-apple","ng-shared-main-plezyng","ng-main-run-{0}","gha-{0}-{1}-apple-native-test"]}}', github.run_id, strategy.job-index)) }}
    permissions:
      contents: read
    env:
      PUB_CACHE: ${{ github.workspace }}/.cache/plezy-pub-cache
      APPLE_SOURCE_PACKAGES_DIR: ${{ github.workspace }}/build/${{ matrix.source_packages_directory }}/SourcePackages
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            source_packages_directory: ios
            project_directory: ios
            workspace: ios/Runner.xcworkspace
            simulator_runtime: iOS
            simulator_platform: iOS
            static_destination: ""
          - platform: macOS
            source_packages_directory: macos
            project_directory: macos
            workspace: macos/Runner.xcworkspace
            simulator_runtime: ""
            simulator_platform: ""
            static_destination: platform=macOS
          - platform: tvOS
            source_packages_directory: tvos
            project_directory: tvos
            workspace: tvos/Runner.xcworkspace
            simulator_runtime: tvOS
            simulator_platform: tvOS
            static_destination: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter-apple
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.cache/plezy-pub-cache
          key: ${{ runner.os }}-${{ runner.arch }}-plezy-pub-v2-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Select per-job Xcode DerivedData path
        shell: bash
        run: |
          set -euo pipefail
          derived_data_path="$RUNNER_TEMP/plezyng-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.source_packages_directory }}-DerivedData"
          echo "APPLE_DERIVED_DATA_PATH=$derived_data_path" >> "$GITHUB_ENV"

      - name: Ensure CMake for the embedded Steam receiver
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v cmake >/dev/null || brew install cmake
          cmake --version

      - name: Build and verify iOS native torrent framework
        if: matrix.platform == 'iOS'
        run: |
          python3 scripts/p2p/build_apple.py ios
          framework=packages/plezy_torrent/ios/Frameworks/ios/PlezyTorrent.xcframework
          test -f "$framework/Info.plist"
          test -d "$framework/ios-arm64/PlezyTorrent.framework"
          test -d "$framework/ios-arm64_x86_64-simulator/PlezyTorrent.framework"

      - name: Build and verify macOS native torrent framework
        if: matrix.platform == 'macOS'
        run: |
          python3 scripts/p2p/build_apple.py macos
          framework=packages/plezy_torrent/macos/Frameworks/macos/PlezyTorrent.xcframework
          test -f "$framework/Info.plist"
          test -d "$framework/macos-arm64_x86_64/PlezyTorrent.framework"

      - name: Install CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          gem install cocoapods --version 1.17.0 --no-document \
            --install-dir "$RUNNER_TEMP/cocoapods-gems" \
            --bindir "$RUNNER_TEMP/cocoapods-bin"
          gem_path="$RUNNER_TEMP/cocoapods-gems:$(gem env gempath)"
          {
            echo "GEM_HOME=$RUNNER_TEMP/cocoapods-gems"
            echo "GEM_PATH=$gem_path"
          } >> "$GITHUB_ENV"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/cocoapods-bin" >> "$GITHUB_PATH"
          export GEM_HOME="$RUNNER_TEMP/cocoapods-gems"
          export GEM_PATH="$gem_path"
          export PATH="$RUNNER_TEMP/cocoapods-bin:/opt/homebrew/bin:$PATH"
          pod --version

      - name: Install locked Dart dependencies
        if: matrix.platform != 'tvOS'
        run: flutter pub get --enforce-lockfile --no-example

      - name: Verify Sherpa ONNX iOS simulator framework
        if: matrix.platform == 'iOS'
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          config = json.loads(Path(".dart_tool/package_config.json").read_text())
          package = next(item for item in config["packages"] if item["name"] == "sherpa_onnx_ios")
          root = Path(unquote(urlparse(package["rootUri"]).path))
          framework = root / "ios/sherpa_onnx_ios/SherpaOnnxC.xcframework"
          simulator_binary = framework / "ios-arm64_x86_64-simulator/SherpaOnnxC.framework/SherpaOnnxC"
          if not (framework / "Info.plist").is_file() or not simulator_binary.is_file():
              raise SystemExit(f"Sherpa ONNX iOS simulator XCFramework is incomplete: {framework}")
          digest = hashlib.sha256(simulator_binary.read_bytes()).hexdigest()
          print(f"sherpa_onnx_ios_root={root}")
          print(f"sherpa_onnx_ios_simulator_binary={simulator_binary} bytes={simulator_binary.stat().st_size} sha256={digest}")
          PY

      - name: Install tvOS dependencies with the unsupported SMB native asset stub
        if: matrix.platform == 'tvOS'
        run: tvos/scripts/pub_get.sh

      - name: Record committed CocoaPods lockfile
        if: matrix.platform != 'tvOS'
        env:
          PODFILE_LOCK: ${{ matrix.project_directory }}/Podfile.lock
        run: |
          test -f "$PODFILE_LOCK"
          shasum -a 256 "$PODFILE_LOCK" > "$RUNNER_TEMP/plezy-podfile-lock.sha256"

      - name: Verify iOS Xcode project syntax
        if: matrix.platform == 'iOS'
        run: plutil -lint ios/Runner.xcodeproj/project.pbxproj

      - name: Prepare iOS Flutter build settings
        if: matrix.platform == 'iOS'
        run: flutter build ios --config-only --simulator --debug --no-pub

      - name: Refresh pinned iOS Swift packages
        if: matrix.platform == 'iOS'
        run: scripts/refresh_apple_spm.sh ios

      - name: Prepare macOS Flutter build settings
        if: matrix.platform == 'macOS'
        run: flutter build macos --config-only --debug --no-pub

      - name: Refresh pinned macOS Swift packages
        if: matrix.platform == 'macOS'
        run: scripts/refresh_apple_spm.sh macos

      - name: Prepare tvOS Flutter engine
        if: matrix.platform == 'tvOS'
        run: tvos/scripts/fetch_engine.sh

      - name: Restore and verify committed CocoaPods lockfile
        if: matrix.platform != 'tvOS'
        env:
          PODFILE_LOCK: ${{ matrix.project_directory }}/Podfile.lock
        run: |
          git restore --source=HEAD --worktree -- "$PODFILE_LOCK"
          shasum -a 256 --check "$RUNNER_TEMP/plezy-podfile-lock.sha256"

      - name: Install locked CocoaPods dependencies
        if: matrix.platform != 'tvOS'
        working-directory: ${{ matrix.project_directory }}
        run: pod install --deployment

      - name: Diagnose iOS torrent CocoaPods integration
        if: matrix.platform == 'iOS'
        run: |
          python3 - <<'PY'
          import json
          import plistlib
          from pathlib import Path

          plugin = Path("ios/.symlinks/plugins/plezy_torrent/ios")
          framework = Path("packages/plezy_torrent/ios/Frameworks/ios/PlezyTorrent.xcframework")
          print(f"plugin_path={plugin.resolve(strict=False)} exists={plugin.exists()}")
          print(f"framework_path={framework.resolve(strict=False)} exists={framework.exists()}")
          info = framework / "Info.plist"
          if info.is_file():
              with info.open("rb") as source:
                  plist = plistlib.load(source)
              slices = [
                  {key: item.get(key) for key in ("LibraryIdentifier", "SupportedPlatform", "SupportedPlatformVariant", "SupportedArchitectures")}
                  for item in plist.get("AvailableLibraries", [])
              ]
              print(f"framework_slices={slices}")

          podspec = Path("ios/Pods/Local Podspecs/plezy_torrent.podspec.json")
          if podspec.is_file():
              spec = json.loads(podspec.read_text(encoding="utf-8"))
              print(f"vendored_frameworks={spec.get('vendored_frameworks')}")
          else:
              print(f"local_podspec_missing={podspec}")

          support = Path("ios/Pods/Target Support Files")
          for path in sorted(support.glob("*plezy_torrent*")):
              print(f"pod_support_path={path}")
              if path.is_dir():
                  for child in sorted(path.rglob("*")):
                      if child.is_file() and child.suffix in {".sh", ".xcfilelist", ".json"}:
                          print(f"pod_support_file={child}")
                          for number, line in enumerate(child.read_text(encoding="utf-8", errors="replace").splitlines(), 1):
                              if "PlezyTorrent" in line or "XCFrameworkIntermediates" in line:
                                  print(f"{child}:{number}:{line[:240]}")

          for path in sorted((support / "Pods-Runner").glob("Pods-Runner-frameworks*")):
              print(f"runner_framework_support_file={path}")
              if path.is_file():
                  for number, line in enumerate(path.read_text(encoding="utf-8", errors="replace").splitlines(), 1):
                      if "plezy_torrent" in line or "PlezyTorrent" in line or "XCFrameworkIntermediates" in line:
                          print(f"{path}:{number}:{line[:240]}")

          for project_name, project in (
              ("Runner", Path("ios/Runner.xcodeproj/project.pbxproj")),
              ("Pods", Path("ios/Pods/Pods.xcodeproj/project.pbxproj")),
          ):
              print(f"{project_name}_project_file={project} exists={project.is_file()}")
              if project.is_file():
                  for number, line in enumerate(project.read_text(encoding="utf-8", errors="replace").splitlines(), 1):
                      if any(token in line for token in ("plezy_torrent", "PlezyTorrent", "Copy XCFrameworks")):
                          print(f"{project_name}_project:{number}:{line[:240]}")

          sherpa_plugin = Path("ios/.symlinks/plugins/sherpa_onnx_ios")
          sherpa_podspec = sherpa_plugin / "ios/sherpa_onnx_ios.podspec"
          sherpa_source = sherpa_plugin / "ios/sherpa_onnx_ios/Sources/sherpa_onnx_ios/SherpaOnnxIosPlugin.swift"
          sherpa_framework = sherpa_plugin / "ios/sherpa_onnx_ios/SherpaOnnxC.xcframework"
          expected_source = "s.source_files = 'sherpa_onnx_ios/Sources/sherpa_onnx_ios/SherpaOnnxIosPlugin.swift'"
          print(f"sherpa_plugin={sherpa_plugin.resolve(strict=False)} exists={sherpa_plugin.exists()}")
          print(f"sherpa_source_exists={sherpa_source.is_file()} sherpa_framework_exists={sherpa_framework.is_dir()}")
          if not sherpa_podspec.is_file() or not sherpa_source.is_file() or not sherpa_framework.is_dir():
              raise SystemExit("resolved sherpa_onnx_ios package is missing its Podspec, source anchor, or XCFramework")
          if expected_source not in sherpa_podspec.read_text(encoding="utf-8"):
              raise SystemExit("sherpa_onnx_ios Podspec does not include the CocoaPods source anchor")

          sherpa_support = Path("ios/Pods/Target Support Files/sherpa_onnx_ios")
          copy_scripts = sorted(sherpa_support.glob("*xcframeworks.sh"))
          if not copy_scripts:
              raise SystemExit("CocoaPods did not generate the sherpa_onnx_ios XCFramework copy phase")
          for copy_script in copy_scripts:
              contents = copy_script.read_text(encoding="utf-8", errors="replace")
              print(f"sherpa_copy_script={copy_script} has_framework={('SherpaOnnxC.xcframework' in contents)}")
              if "SherpaOnnxC.xcframework" not in contents:
                  raise SystemExit(f"SherpaOnnxC is absent from {copy_script}")
          PY

      - name: Install tvOS CocoaPods dependencies
        if: matrix.platform == 'tvOS'
        run: tvos/scripts/pod_install.sh

      - name: Verify tvOS project wiring
        if: matrix.platform == 'tvOS'
        run: |
          ruby tvos/scripts/test_wire_mpv.rb
          ruby tvos/scripts/test_wire_top_shelf.rb

      - name: Resolve pinned Apple Swift packages for native tests
        run: xcodebuild -resolvePackageDependencies -workspace "${{ matrix.workspace }}" -scheme Runner -clonedSourcePackagesDirPath "$APPLE_SOURCE_PACKAGES_DIR"

      - name: Remove AMSMB2 unsafe warning flag from the pinned tvOS checkout
        if: matrix.platform == 'tvOS'
        run: |
          python3 scripts/patch_amsmb2_manifest.py \
            --source-packages-dir "$APPLE_SOURCE_PACKAGES_DIR" \
            --resolved-package tvos/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Select Apple test destination
        env:
          SIMULATOR_RUNTIME: ${{ matrix.simulator_runtime }}
          SIMULATOR_PLATFORM: ${{ matrix.simulator_platform }}
          STATIC_DESTINATION: ${{ matrix.static_destination }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          destination = os.environ["STATIC_DESTINATION"]
          if not destination:
              runtime_name = os.environ["SIMULATOR_RUNTIME"]
              payload = json.loads(
                  subprocess.check_output(
                      ["xcrun", "simctl", "list", "devices", "available", "-j"],
                      text=True,
                  )
              )
              devices = [
                  device
                  for runtime, candidates in payload["devices"].items()
                  if f".{runtime_name}-" in runtime
                  for device in candidates
                  if device.get("isAvailable", False)
              ]
              if not devices:
                  raise SystemExit(f"no available {runtime_name} simulator")
              destination = (
                  f"platform={os.environ['SIMULATOR_PLATFORM']} Simulator,"
                  f"id={devices[0]['udid']}"
              )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"APPLE_TEST_DESTINATION={destination}\n")
          PY

      - name: Run Apple native reliability tests
        if: matrix.platform != 'macOS'
        run: |
          result_bundle="$RUNNER_TEMP/apple-native-reliability.xcresult"
          set +e
          xcodebuild test \
            -workspace "${{ matrix.workspace }}" \
            -scheme Runner \
            -configuration Debug \
            -destination "$APPLE_TEST_DESTINATION" \
            -derivedDataPath "$APPLE_DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$APPLE_SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -resultBundlePath "$result_bundle" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ARCHS=arm64
          test_status=$?
          set -e
          if [ "$test_status" -ne 0 ]; then
            xcrun xcresulttool get test-results tests --path "$result_bundle"
          fi
          exit "$test_status"

      - name: Build macOS application and XCTest bundle
        if: matrix.platform == 'macOS'
        run: |
          xcodebuild build-for-testing \
            -workspace "${{ matrix.workspace }}" \
            -scheme Runner \
            -configuration Debug \
            -destination "$APPLE_TEST_DESTINATION" \
            -derivedDataPath "$APPLE_DERIVED_DATA_PATH" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ARCHS=arm64

  # packer-windows-jit-v1
  windows-native-test:
    name: Windows native reliability (${{ matrix.arch }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ matrix.arch == 'x64' && fromJSON(format('{{"group":"packer-windows","labels":["self-hosted","Windows","X64","on-demand","packer-windows","PlezyNG","gha-{0}-{1}-windows-native-test"]}}', github.run_id, strategy.job-index)) || fromJSON(format('{{"group":"packer-windows","labels":["self-hosted","Windows","ARM64","on-demand","packer-windows","PlezyNG","gha-{0}-{1}-windows-native-test"]}}', github.run_id, strategy.job-index)) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            flutter_setup: action
          - arch: arm64
            flutter_setup: git
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Provision and verify pinned Windows build tools
        shell: pwsh
        run: |
          .\windows\tool\prepare-build-toolchain.ps1
          .\windows\tool\prepare-build-toolchain.ps1 -VerifyOnly

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          distribution: "temurin"
          java-version: "21"
          architecture: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x64' }}

      - name: Verify provisioned ARM64 7-Zip
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $sevenZip = Get-Command 7z -CommandType Application -ErrorAction Stop
          & $sevenZip.Source i
          if ($LASTEXITCODE -ne 0) { throw 'The pinned private image 7-Zip is not usable' }

      - name: Setup Flutter
        id: setup_flutter_windows
        if: matrix.flutter_setup == 'action'
        uses: ./.github/actions/setup-flutter-windows
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Set up Flutter from its pinned commit
        if: matrix.flutter_setup == 'git'
        uses: ./.github/actions/setup-flutter-git

      - name: Install locked Dart dependencies
        shell: pwsh
        run: flutter pub get --enforce-lockfile --no-example

      # Windows replacement semantics (`MoveFileExW` with
      # MOVEFILE_REPLACE_EXISTING) cannot be proven on the POSIX runners, and a
      # memory file system proves nothing about either. The vendored
      # shared_preferences_windows store write is the fix for #1732, so exercise
      # it here, on a real NTFS volume, against the real backend.
      - name: Run the vendored Windows preference store tests
        env:
          no_proxy: localhost,127.0.0.1,::1
        shell: pwsh
        run: flutter test test/services/prefs_store_atomic_write_windows_test.dart

      - name: Install patched Flutter engine
        shell: pwsh
        run: |
          flutter precache --windows
          .\windows\tool\install-patched-engine.ps1

      - name: Download and verify pinned Windows libmpv archive
        shell: pwsh
        env:
          PLEZYNG_WINDOWS_CURL_PATH: ${{ steps.setup_flutter_windows.outputs.windows_curl_path }}
        run: .\windows\tool\download-pinned-mpv.ps1 -Architecture '${{ matrix.arch }}'

      - name: Download and verify pinned Windows simdutf source archive
        shell: pwsh
        run: .\windows\tool\download-pinned-simdutf.ps1

      - name: Download and verify pinned Windows WinSparkle archive
        shell: pwsh
        run: .\windows\tool\download-pinned-winsparkle.ps1

      - name: Download and verify pinned Windows SDL3 archive
        shell: pwsh
        run: .\windows\tool\download-pinned-sdl3.ps1

      - name: Download and verify pinned Windows torrent dependencies
        shell: pwsh
        run: .\windows\tool\download-pinned-torrent-dependencies.ps1

      - name: Prepare Flutter Windows configuration
        shell: pwsh
        run: flutter build windows --debug --config-only --no-pub

      - name: Configure Windows native reliability tests
        shell: pwsh
        run: |
          $buildDir = "build/windows/${{ matrix.arch }}"
          cmake -S windows -B $buildDir `
            -DPLEZY_STEAM_TESTS=ON `
            -DPLEZY_BUILD_MPV_PROPERTY_CONTRACT_TESTS=ON `
            -DPLEZY_BUILD_DISPLAY_RECOVERY_TESTS=ON

      - name: Build Windows native reliability tests
        shell: pwsh
        run: |
          $buildDir = "build/windows/${{ matrix.arch }}"
          cmake --build $buildDir --config Debug --parallel 2 --target `
            plezy `
            mpv_property_result_contract_test `
            mpv_player_property_contract_test `
            display_mode_manager_test `
            plezy_windows_platform_test `
            plezy_windows_sink_test `
            plezy_h26x_test `
            plezy_audio_test `
            plezy_pyrowave_test

      - name: Run Windows native reliability tests
        shell: pwsh
        run: |
          $buildDir = "build/windows/${{ matrix.arch }}"
          ctest --test-dir "$buildDir/runner" -C Debug --output-on-failure --no-tests=error

  dependency-check:
    name: Dependency Validation
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-plezyng","ng-main-run-{0}","gha-{0}-dependency-check"]}}', github.run_id)) }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-v3-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}

      - name: Verify dependencies
        run: |
          flutter clean
          flutter pub get
          flutter pub outdated

  server:
    name: Server checks
    needs: [test, android-test, analyze, dependency-check]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-plezyng","ng-main-run-{0}","gha-{0}-server"]}}', github.run_id)) }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run server checks
        run: scripts/ci_server_checks.sh


  # The only job that checks packaging against a real artifact. build.yml also
  # packages Linux, but refuses any ref but refs/heads/main, and
  # check_linux_package_deps.py can only compare a hand-written list against
  # CMake - it cannot prove the list reaches the artifact, nor see the
  # transitive libraries the bundled libmpv drags in. This can, by reading the
  # built bundle back with ldd.
  #
  # Manual-only package smoke build for changes to linux/packaging. Release
  # packages are built by build.yml; ordinary pushes run the lightweight CI
  # checks above without packaging release artifacts.
  linux-packages:
    name: Linux package smoke build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_linux_packages }}
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-plezyng","ng-main-run-{0}","gha-{0}-linux-packages"]}}', github.run_id)) }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          distribution: "temurin"
          java-version: "21"

      # The packaging deps, minus libmpv: that arrives prebuilt from mpv-build
      # below. The dev packages still matter — they install the runtime
      # libraries the pinned libmpv links (ass, pulse, pipewire, ...), which
      # bundle-libs.sh resolves off the host into the bundle.
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake meson ninja-build pkg-config nasm libgtk-3-dev libsecret-1-dev liblzma-dev \
            libstdc++-12-dev libepoxy-dev libcurl4-openssl-dev libevdev-dev \
            libasound2-dev libass-dev libfreetype-dev libfontconfig-dev libfribidi-dev \
            libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav \
            libharfbuzz-dev libegl-dev libgl-dev libgnutls28-dev libpipewire-0.3-dev \
            libva-dev libxkbcommon-dev libpulse-dev libdbus-1-dev libdrm-dev \
            libdisplay-info-dev libgbm-dev libwayland-dev wayland-protocols liblcms2-dev libmujs-dev \
            liblua5.2-dev rpm libarchive-tools imagemagick ruby-dev build-essential
          proxy="${HTTPS_PROXY:-${https_proxy:-}}"
          if [[ -z "$proxy" ]]; then
            echo "The private JIT HTTPS proxy is required to install fpm." >&2
            exit 1
          fi
          sudo env \
            HTTP_PROXY="${HTTP_PROXY:-$proxy}" \
            HTTPS_PROXY="$proxy" \
            http_proxy="${http_proxy:-${HTTP_PROXY:-$proxy}}" \
            https_proxy="${https_proxy:-$proxy}" \
            gem install fpm --version 1.17.0 --no-document

      # Keyed the same way build.yml keys it: the lock names the asset and its
      # checksum, so editing the lock is what invalidates the cache.
      - name: Cache libmpv prefix
        id: libmpv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: libmpv-prefix
          key: ci-libmpv-${{ runner.arch }}-${{ hashFiles('mpv-build.lock.json') }}

      # Same contract as build.yml: the script reads mpv-build.lock.json,
      # downloads the linux asset for this arch, verifies its SHA-256, and
      # extracts the prefix tree.
      - name: Fetch libmpv
        if: steps.libmpv-cache.outputs.cache-hit != 'true'
        run: |
          command -v zstd >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd; }
          python3 scripts/fetch_linux_libmpv.py --dest libmpv-prefix

      # The windowing backends the runner depends on, read off the pinned
      # library just extracted. The plane hands mpv MPV_RENDER_PARAM_WL_DISPLAY,
      # so a libmpv without Wayland cannot find the VAAPI device and quietly
      # decodes in software; X11 and VDPAU are gone with the texture path.
      - name: Check the pinned libmpv's backends
        run: |
          LIB=$(find libmpv-prefix -name 'libmpv.so.2' | head -1)
          echo "== $LIB =="
          ldd "$LIB" | grep -iE 'wayland|libX11|vdpau' || echo '(none)'
          ldd "$LIB" | grep -q libwayland-client || {
            echo "::error::the built libmpv does not link libwayland-client, so the video plane cannot work"
            exit 1
          }

      - name: Build the release bundle
        run: |
          flutter pub get --enforce-lockfile --no-example
          flutter build linux --release
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/libmpv-prefix/lib/pkgconfig:${{ github.workspace }}/libmpv-prefix/lib/x86_64-linux-gnu/pkgconfig

      # Mirrors build.yml: resolve the bundle completely, then package from it.
      # libmpv travels with us, so nothing depends on a host one - which also
      # removes the transitive pull of everything libmpv links, hence bundle-libs
      # before packaging rather than after.
      - name: Copy libmpv into the bundle
        run: |
          BUNDLE_LIB=build/linux/x64/release/bundle/lib
          LIBMPV_DIR=$(dirname "$(find libmpv-prefix -name 'libmpv.so' | head -1)")
          cp -a "$LIBMPV_DIR"/libmpv.so* "$BUNDLE_LIB/"
          cp -a libmpv-prefix/lib/libshaderc_shared.so* "$BUNDLE_LIB/"

      - name: Bundle shared libraries
        run: bash linux/packaging/bundle-libs.sh build/linux/x64/release/bundle

      - name: Copy wrapper script into the bundle
        run: cp linux/packaging/plezy.sh build/linux/x64/release/bundle/plezy.sh

      # Derives what the resolved bundle still needs from the host and proves
      # every one of those libraries is declared. This is the check that would
      # have caught bundling libmpv without also declaring what libmpv links.
      - name: Verify every unbundled library the bundle needs is declared
        run: python3 linux/packaging/check-bundle-host-deps.py build/linux/x64/release/bundle

      # OUTPUT_DIR defaults to the repo root; name it so the paths below are not
      # a guess about where fpm dropped things. The host-dependency guard is
      # skipped because the named step above just ran it against this same
      # bundle; the internal run exists for by-hand packaging outside CI.
      - name: Build the packages
        run: |
          mkdir -p "$OUTPUT_DIR"
          python3 linux/packaging/build-packages.py
        env:
          OUTPUT_DIR: ${{ github.workspace }}/packages
          PLEZY_SKIP_HOST_DEP_CHECK: "1"

      # The guard above reconciles the depends lists with the staged bundle; only
      # the packages themselves can show that list survived fpm. Every name comes
      # from build-packages.py, so adding a library there is verified here without
      # a second edit - and this job is off by default, so a hand-copied list
      # would rot unseen. The release job in build.yml runs the same script
      # against the artifacts users install, so the assertions cannot drift.
      - name: Verify the declared dependencies reached the package metadata
        run: python3 linux/packaging/check-package-deps.py "${{ github.workspace }}/packages"

      # Same resolved bundle the packages were cut from, so the tarball is not a
      # second, differently-assembled artifact. It is the one to put on a USB for
      # a foreign machine, because it needs nothing installed.
      - name: Create the tarball
        run: |
          BUNDLE_DIR=build/linux/x64/release/bundle
          mkdir -p "$OUTPUT_DIR"
          tar -czf "$OUTPUT_DIR/plezy-linux-x64.tar.gz" -C "$BUNDLE_DIR" .
          echo "=== libmpv travelling in every artifact ==="
          ldd "$BUNDLE_DIR/lib/libmpv.so" | grep -iE 'wayland|libX11|vdpau' || echo '(none)'
        env:
          OUTPUT_DIR: ${{ github.workspace }}/packages

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-packages-smoke
          path: ${{ github.workspace }}/packages/plezy-linux-x64.*
          if-no-files-found: error
          retention-days: 7
