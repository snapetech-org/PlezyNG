name: Discord Release Announcement
run-name: action:announce-release:pool:private:tag:${{ inputs.release_tag || github.event.release.tag_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      action:
        description: Release announcement action
        required: true
        type: choice
        options: [announce-release]
      runner_pool:
        description: Required private JIT runner pool
        required: true
        type: choice
        default: private
        options: [private]
      release_tag:
        description: Published stable release tag to announce
        required: true
        type: string

# Publication gates also run before a repository has been checked out.
env:
  GH_REPO: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: discord-release-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  announce-discord:
    name: Announce published release to Discord
    if: >-
      github.repository_id == '1433487464' &&
      ((github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ${{ fromJSON(format('{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-pleazyng","ng-main-run-{0}","gha-{0}-announce-discord"]}', github.run_id)) }}
    timeout-minutes: 5
    permissions:
      contents: write # Persist per-message delivery receipts on the release.
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Send Discord announcement
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          RELEASE_JSON_PATH: ${{ runner.temp }}/pleazyng-release.json
          DISCORD_RECEIPT_PATH: ${{ runner.temp }}/discord-announcement-receipt.json
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RELEASE_JSON_PATH"
          python3 scripts/announce_discord.py

      - name: Retain Discord delivery receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: discord-announcement-receipt
          path: ${{ runner.temp }}/discord-announcement-receipt.json
          if-no-files-found: ignore
