name: Localization completion candidates
on:
  push:
    branches: [main]
    paths: ['scripts/localization/**', '.github/workflows/localization-completion.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        locale: [ar, az, bg, bn, cs, da, de, es, fa, fr, he, hi, hu, id, it, ja, kk, ko, ms, nb, nl, pl, pt, ru, sv, th, tr, uk, uz, vi, zh, zh-Hant]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned translation tooling
        run: python3 -m pip install -r scripts/localization/requirements.txt
      - name: Generate candidates and reverse-translation review material
        env:
          TRANSLATION_LOCALE: ${{ matrix.locale }}
          HF_HUB_DISABLE_XET: '1'
        run: python3 scripts/localization/generate_candidates.py --locale "$TRANSLATION_LOCALE" --output "build/localization/$TRANSLATION_LOCALE.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: localization-${{ matrix.locale }}
          path: build/localization/*.json
          if-no-files-found: error
          retention-days: 30
