name: Native emulator isolation

on:
  push:
    branches: [main, 'audit-remediation/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  containment:
    # Queue each platform independently. An unavailable runner must not hold
    # up validation on every other operating system, including revised routes.
    concurrency:
      group: native-emulator-isolation-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise real worker faults and sandbox boundaries
        if: runner.os != 'Windows'
        run: python3 scripts/games/test_romm_process.py
      - name: Exercise Windows AppContainer and worker faults
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'A compatible MSVC installation is required' }
          $developer = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          & cmd.exe /d /s /c "call `"$developer`" -no_logo -arch=x64 && python scripts/games/test_romm_process.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile production host and worker
        shell: bash
        run: |
          cmake -S native/games/romm -B "$RUNNER_TEMP/romm-native" -DPLEZY_ROMM_BUILD_CORES=OFF -DPLEZY_ROMM_ISOLATED=ON -DPLEZY_ROMM_NATIVE_TESTS=ON
          cmake --build "$RUNNER_TEMP/romm-native" --config Release --parallel 2
          ctest --test-dir "$RUNNER_TEMP/romm-native" -C Release --output-on-failure
      - name: Check emulator package contracts
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts/games -p 'test_*romm*.py'
      - name: Verify Apple pod metadata locks
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ruby ruby-dev
          gem install cocoapods-core --version 1.17.0 --no-document --install-dir "$RUNNER_TEMP/romm-gems"
          GEM_HOME="$RUNNER_TEMP/romm-gems" GEM_PATH="$RUNNER_TEMP/romm-gems:$(gem env gempath)" ruby scripts/check_podspec_locks.rb

  android:
    concurrency:
      group: native-emulator-isolation-${{ github.ref }}-android
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_USER_HOME: ${{ runner.temp }}/romm-android-state
      ANDROID_EMULATOR_HOME: ${{ runner.temp }}/romm-android-state
      ANDROID_AVD_HOME: ${{ runner.temp }}/romm-android-state/avd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false
      - name: Install Android test toolchains
        run: |
          python3 scripts/prepare_android_sdk.py install --direct-egress
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Create and verify the test emulator before compilation
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          avdmanager create avd --name romm-isolation --device pixel_2 --path "$ANDROID_AVD_HOME/romm-isolation.avd" --package 'system-images;android-35;google_apis;x86_64' --force
          test -f "$ANDROID_AVD_HOME/romm-isolation.avd/config.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx romm-isolation
      - name: Compile all app ABIs and inspect service integration
        run: android/gradlew -p test/android/romm assembleDebug assembleDebugAndroidTest lintDebug --stacktrace
      - name: Exercise the actual Android isolated service
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd romm-isolation -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/romm-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'adb logcat -d -t 2000 > "$RUNNER_TEMP/romm-device.log" 2>&1 || true; adb emu kill || true; kill "$emulator_pid" 2>/dev/null || true' EXIT
          booted=false
          boot_deadline=$((SECONDS + 240))
          while (( SECONDS < boot_deadline )); do
            kill -0 "$emulator_pid" 2>/dev/null || { cat "$RUNNER_TEMP/romm-emulator.log"; exit 1; }
            if [[ "$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then booted=true; break; fi
            sleep 2
          done
          $booted || { cat "$RUNNER_TEMP/romm-emulator.log"; exit 1; }
          android/gradlew -p test/android/romm connectedDebugAndroidTest --stacktrace
      - name: Preserve Android containment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-emulator-containment
          path: |
            test/android/romm/build/reports
            test/android/romm/build/outputs/androidTest-results
            test/android/romm/build/outputs/apk
            ${{ runner.temp }}/romm-emulator.log
            ${{ runner.temp }}/romm-device.log
          retention-days: 7
