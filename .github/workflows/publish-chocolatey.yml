# ng-runner-policy: hosted-default-v2
name: Publish Chocolatey Package
run-name: ${{ format('action:{0}:pool:{1}:tag:{2}:publish:{3}:rebuild:{4}', inputs.action, inputs.runner_pool, inputs.release_tag, inputs.publish, inputs.rebuild_package) }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Publication action authorized on the protected default branch
        required: true
        type: choice
        options: [publish-chocolatey]
      runner_pool:
        description: Runner pool for this publication
        required: true
        type: choice
        options: [public]
      release_tag:
        description: Published release tag to process
        required: true
        type: string
      publish:
        description: Push the validated package to Chocolatey
        default: false
        required: true
        type: boolean
      rebuild_package:
        description: Rebuild from the current Chocolatey recipe for a moderation correction
        default: false
        required: true
        type: boolean

# Several publication gates run before checkout on public hosted runners.
env:
  GH_REPO: ${{ github.repository }}

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Resolve and validate published release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Manual Chocolatey publication must run from main.'
          }
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'release') { $env:EVENT_TAG } else { $env:INPUT_TAG }
          if ($tag -notmatch '^v?\d+\.\d+\.\d+$') {
            throw "Release tag must be semantic versioning: $tag"
          }
          $version = $tag -replace '^v', ''
          $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,publishedAt
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect release $tag" }
          $metadata = $release | ConvertFrom-Json
          if ($metadata.tagName -ne $tag -or $metadata.isDraft -or -not $metadata.publishedAt) {
            throw "Tag $tag is not an exact published release."
          }
          $tagRef = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Unable to resolve release tag $tag." }
          $commit = $tagRef.object.sha
          if ($tagRef.object.type -eq 'tag') {
            $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$commit" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Unable to dereference annotated tag $tag." }
            $commit = $tagObject.object.sha
          }
          $mainCommit = gh api "repos/$env:GITHUB_REPOSITORY/branches/main" --jq '.commit.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve the main branch head.' }
          $comparison = gh api "repos/$env:GITHUB_REPOSITORY/compare/$commit...$mainCommit" --jq '.status'
          if ($LASTEXITCODE -ne 0 -or $comparison -notin @('ahead', 'identical')) {
            throw "Release $tag is not on main or an ancestor of main."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download the release installer evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          REBUILD_PACKAGE: ${{ inputs.rebuild_package }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY `
            --pattern 'pleazyng-windows-installer.exe' `
            --pattern 'SHA256SUMS.txt' --dir release-assets
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download Chocolatey release assets.' }
          if ($env:REBUILD_PACKAGE -ne 'true') {
            gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY `
              --pattern 'pleazyng.*.nupkg' --dir release-assets
            if ($LASTEXITCODE -ne 0) { throw 'Unable to download the Chocolatey package from the release.' }
          }

      - name: Check out the release recipe and provenance verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: chocolatey-source
          persist-credentials: false

      - name: Set up Python for provenance verification
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14.8"
          architecture: "x64"

      - name: Verify release checksum manifest provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          python chocolatey-source\scripts\verify_release_attestation.py `
            release-assets\SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey release checksum manifest attestation did not verify.' }

      - name: Rebuild the package from the corrected recipe
        if: inputs.rebuild_package == true
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-Item 'release-assets\pleazyng-windows-installer.exe'
          $checksums = 'release-assets\SHA256SUMS.txt'
          $line = @(Select-String -Path $checksums -Pattern ("^([0-9a-f]{64})\s+" + [regex]::Escape($installer.Name) + '$'))
          if ($line.Count -ne 1) { throw 'SHA256SUMS.txt has no unique entry for the release installer.' }
          $expectedInstallerHash = $line[0].Matches[0].Groups[1].Value.ToLowerInvariant()
          $installerHash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($installerHash -ne $expectedInstallerHash) { throw 'Release installer checksum does not match SHA256SUMS.txt.' }

          $packageRoot = Join-Path $env:RUNNER_TEMP 'pleazyng-chocolatey-rebuild'
          New-Item -ItemType Directory -Force $packageRoot | Out-Null
          Copy-Item -Path 'chocolatey-source\packaging\chocolatey\*' -Destination $packageRoot -Recurse -Force
          $installPath = Join-Path $packageRoot 'tools\chocolateyinstall.ps1'
          $installScript = Get-Content $installPath -Raw
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$($installer.Name)"
          $installScript = $installScript.Replace('__PLEZYNG_RELEASE_URL__', $url)
          $installScript = $installScript.Replace('__PLEZYNG_SHA256__', $installerHash)
          if ($installScript.Contains('__PLEZYNG_')) { throw 'Chocolatey installer template still contains a placeholder.' }
          Set-Content -Path $installPath -Value $installScript -Encoding utf8

          $nuspecPath = Join-Path $packageRoot 'pleazyng.nuspec'
          $nuspec = Get-Content $nuspecPath -Raw
          $nuspec = $nuspec -replace '<version>[^<]+</version>', "<version>$env:RELEASE_VERSION</version>"
          Set-Content -Path $nuspecPath -Value $nuspec -Encoding utf8
          Push-Location $packageRoot
          try {
            choco pack 'pleazyng.nuspec' --outputdirectory (Join-Path $env:GITHUB_WORKSPACE 'release-assets')
            if ($LASTEXITCODE -ne 0) { throw "Chocolatey pack failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          $package = Get-Item "release-assets\pleazyng.$env:RELEASE_VERSION.nupkg"
          if ($null -eq $package) { throw 'Corrected Chocolatey package was not created.' }
          $packageHash = (Get-FileHash $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "Rebuilt Chocolatey package SHA-256: $packageHash" >> $env:GITHUB_STEP_SUMMARY
          "Recipe source commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY

      - name: Verify release checksums and package contents
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          REBUILD_PACKAGE: ${{ inputs.rebuild_package }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = @(Get-ChildItem release-assets\*.nupkg)
          if ($package.Count -ne 1) { throw "Expected one Chocolatey package, found $($package.Count)" }
          $installer = Join-Path $PWD 'release-assets\pleazyng-windows-installer.exe'
          $checksums = Join-Path $PWD 'release-assets\SHA256SUMS.txt'
          foreach ($asset in @($package[0], (Get-Item $installer))) {
            if ($asset.Length -gt 190000000) {
              throw "Chocolatey payload exceeds the 190000000-byte budget: $($asset.Name) ($($asset.Length) bytes)."
            }
            if ($env:REBUILD_PACKAGE -eq 'true' -and $asset.Name -eq $package[0].Name) { continue }
            $line = @(Select-String -Path $checksums -Pattern ("^([0-9a-f]{64})\s+" + [regex]::Escape($asset.Name) + '$'))
            if ($line.Count -ne 1) { throw "SHA256SUMS.txt has no unique entry for $($asset.Name)" }
            $expected = $line[0].Matches[0].Groups[1].Value.ToLowerInvariant()
            $actual = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Checksum mismatch for $($asset.Name)" }
          }

          $extractDir = Join-Path $env:RUNNER_TEMP 'pleazyng-chocolatey-check'
          $archivePath = Join-Path $env:RUNNER_TEMP 'pleazyng-chocolatey-check.zip'
          Copy-Item $package[0].FullName $archivePath -Force
          Expand-Archive -Path $archivePath -DestinationPath $extractDir -Force
          $installScript = Get-Content (Join-Path $extractDir 'tools\chocolateyinstall.ps1') -Raw
          $installerHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/pleazyng-windows-installer.exe"
          if ($installScript -notmatch [regex]::Escape($expectedUrl)) { throw 'Package points to a different release installer.' }
          if ($installScript -notmatch [regex]::Escape($installerHash)) { throw 'Package installer checksum does not match the release asset.' }
          $nuspec = Get-ChildItem $extractDir -Filter '*.nuspec' | Select-Object -First 1
          if ($null -eq $nuspec -or (Get-Content $nuspec.FullName -Raw) -notmatch "<version>$([regex]::Escape($env:RELEASE_VERSION))</version>") {
            throw 'Chocolatey package metadata does not match the release version.'
          }
          [xml]$nuspecDocument = Get-Content $nuspec.FullName -Raw
          $metadataNode = $nuspecDocument.SelectSingleNode("/*[local-name()='package']/*[local-name()='metadata']")
          if ($null -eq $metadataNode) { throw 'Chocolatey package has no nuspec metadata block.' }
          $expectedMetadata = [ordered]@{
            id = 'pleazyng'
            authors = 'SnapeTech, edde746, slskdn'
            owners = 'slskdn'
            projectUrl = 'https://pleazyng.app/'
            projectSourceUrl = 'https://github.com/snapetech-org/pleazyng'
            packageSourceUrl = 'https://github.com/snapetech-org/pleazyng/tree/main/packaging/chocolatey'
          }
          foreach ($name in $expectedMetadata.Keys) {
            $node = $metadataNode.SelectSingleNode("*[local-name()='$name']")
            if ($null -eq $node -or $node.InnerText.Trim() -ne $expectedMetadata[$name]) {
              throw "Chocolatey package metadata '$name' must be '$($expectedMetadata[$name])'."
            }
          }
          $descriptionNode = $metadataNode.SelectSingleNode("*[local-name()='description']")
          if ($null -eq $descriptionNode -or $descriptionNode.InnerText -notmatch '(?i)fork of Plezy') {
            throw 'Chocolatey package description must identify Pleazyng as a fork of Plezy.'
          }
          if ($descriptionNode.InnerText -notmatch [regex]::Escape('https://github.com/edde746/plezy')) {
            throw 'Chocolatey package description must link to the upstream Plezy project.'
          }
          if ($descriptionNode.InnerText -notmatch [regex]::Escape('The upstream Plezy project was created by edde746; Pleazyng is maintained by SnapeTech.')) {
            throw 'Chocolatey package description must distinguish the upstream Plezy author from the Pleazyng maintainer.'
          }

      - name: Attest corrected Chocolatey package provenance
        if: inputs.rebuild_package == true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release-assets/pleazyng.${{ steps.release.outputs.version }}.nupkg

      - name: Retain the corrected Chocolatey package
        if: inputs.rebuild_package == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chocolatey-${{ steps.release.outputs.version }}-corrected
          path: release-assets/pleazyng.${{ steps.release.outputs.version }}.nupkg
          if-no-files-found: error
          retention-days: 90

      - name: Push to Chocolatey
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
          PUBLISH_REQUESTED: ${{ github.event_name == 'release' || inputs.publish }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PUBLISH_REQUESTED -ne 'true') {
            Write-Host 'Package verified. Set publish=true on a manual run to push it.'
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:CHOCO_API_KEY)) {
            if ($env:GITHUB_EVENT_NAME -eq 'release') {
              Write-Host 'CHOCO_API_KEY is not configured; package was verified but not published.'
              exit 0
            }
            throw 'CHOCO_API_KEY is required when publish=true.'
          }
          choco push (Get-ChildItem release-assets\*.nupkg | Select-Object -First 1) `
            --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey push failed with exit code $LASTEXITCODE" }
