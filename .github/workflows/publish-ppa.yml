# ng-runner-policy: hosted-first-v1
name: Publish Launchpad PPA package
run-name: ${{ format('action:{0}:pool:{1}:tag:{2}', inputs.action, inputs.runner_pool, inputs.release_tag) }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Publication action authorized on the protected default branch
        required: true
        type: choice
        options: [publish-ppa]
      runner_pool:
        description: Runner pool for this publication
        required: true
        type: choice
        options: [public]
      release_tag:
        description: Published Pleazyng release tag
        required: true
        type: string
      ppa_revision:
        description: PPA upload revision; increment to re-upload a release Launchpad already has
        required: false
        default: '1'
        type: string

# Several publication gates run before checkout in fresh private guests.
env:
  GH_REPO: ${{ github.repository }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu_series: [jammy, noble]
    steps:
      - name: Require main for manual publication
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "PPA publication may only be dispatched from main." >&2
            exit 1
          fi

      - name: Resolve and validate published release
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-$INPUT_TAG}"
          [[ "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid stable release tag: $tag" >&2; exit 1; }
          version="${tag#v}"
          metadata="$(gh release view "$tag" --json isDraft,isPrerelease)"
          [[ "$(jq -r '.isDraft' <<<"$metadata")" == "false" && "$(jq -r '.isPrerelease' <<<"$metadata")" == "false" ]] || {
            echo "PPA publication requires a published stable GitHub Release." >&2
            exit 1
          }
          tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
          tag_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.type')"
          if [[ "$tag_type" == "tag" ]]; then
            tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_ref" --jq '.object.sha')"
          fi
          main_ref="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/$tag_ref...$main_ref" --jq '.status')"
          [[ "$comparison" == "ahead" || "$comparison" == "identical" ]] || {
            echo "Release $tag is not on main or an ancestor of main." >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      # Packaging recipe fixes on main must apply when re-uploading an existing
      # release; the release tag above supplies only the payload files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: .ppa-recipe
          sparse-checkout: linux/packaging/ppa
          persist-credentials: false

      - name: Check Launchpad publisher settings
        id: settings
        env:
          LAUNCHPAD_PPA: ${{ vars.LAUNCHPAD_PPA }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [[ -n "$LAUNCHPAD_PPA" && -n "$GPG_PRIVATE_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Missing Launchpad publisher settings::Configure LAUNCHPAD_PPA and GPG_PRIVATE_KEY before publishing."
            exit 1
          fi

      - name: Download Linux release assets
        if: steps.settings.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pleazyng-ppa/assets"
          gh release download "$RELEASE_TAG" \
            --pattern pleazyng-linux-x64.tar.gz \
            --pattern pleazyng-linux-arm64.tar.gz \
            --pattern SHA256SUMS.txt \
            --dir "$RUNNER_TEMP/pleazyng-ppa/assets"
          cd "$RUNNER_TEMP/pleazyng-ppa/assets"
          for asset in pleazyng-linux-x64.tar.gz pleazyng-linux-arm64.tar.gz; do
            expected="$(awk -v name="$asset" '$2 == name { print $1; count++ } END { if (count != 1) exit 1 }' SHA256SUMS.txt)"
            actual="$(sha256sum "$asset" | cut -d ' ' -f 1)"
            [[ "$expected" == "$actual" ]] || { echo "Checksum mismatch for $asset" >&2; exit 1; }
          done

      - name: Install provisioned PPA packaging tools
        if: steps.settings.outputs.configured == 'true'
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            debhelper devscripts dput

      - name: Verify package tools and import signing key
        if: steps.settings.outputs.configured == 'true'
        id: signing
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for tool in cc make dh debuild dpkg-buildpackage dput gpg; do
            command -v "$tool" >/dev/null || { echo "Missing provisioned PPA tool: $tool" >&2; exit 1; }
          done
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$fingerprint"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Validate PPA and prepare dput
        if: steps.settings.outputs.configured == 'true'
        id: ppa
        env:
          LAUNCHPAD_PPA: ${{ vars.LAUNCHPAD_PPA }}
        run: |
          set -euo pipefail
          [[ "$LAUNCHPAD_PPA" =~ ^ppa:([A-Za-z0-9][A-Za-z0-9+.-]*)/([A-Za-z0-9][A-Za-z0-9+.-]*)$ ]] || {
            echo "LAUNCHPAD_PPA must use ppa:<owner>/<archive> format." >&2
            exit 1
          }
          owner="${BASH_REMATCH[1]}"
          archive="${BASH_REMATCH[2]}"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          archive_api="https://api.launchpad.net/1.0/~${owner}/+archive/ubuntu/${archive}"
          curl --fail --silent --show-error "$archive_api" >/dev/null || {
            echo "Launchpad PPA does not exist or is not public: $LAUNCHPAD_PPA" >&2
            exit 1
          }
          {
            printf '[pleazyng-ppa]\n'
            printf 'fqdn = ppa.launchpad.net\n'
            printf 'method = ftp\n'
            printf 'incoming = ~%s/ubuntu/%s\n' "$owner" "$archive"
            printf 'login = anonymous\n'
            printf 'allow_unsigned_uploads = 0\n'
          } > "$HOME/.dput.cf"

      - name: Build and upload signed source package
        if: steps.settings.outputs.configured == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          UBUNTU_SERIES: ${{ matrix.ubuntu_series }}
          GPG_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
          PPA_REVISION: ${{ inputs.ppa_revision || '1' }}
          PPA_OWNER: ${{ steps.ppa.outputs.owner }}
          PPA_ARCHIVE: ${{ steps.ppa.outputs.archive }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          source_name="pleazyng-${version}"
          work="$RUNNER_TEMP/pleazyng-ppa/build"
          source_dir="$work/$source_name"
          orig="$work/pleazyng_${version}.orig.tar.gz"
          mkdir -p "$work"
          # Launchpad requires every upload of one upstream version to carry a
          # byte-identical orig tarball. Reuse the PPA's copy when it exists.
          orig_url="https://ppa.launchpadcontent.net/${PPA_OWNER}/${PPA_ARCHIVE}/ubuntu/pool/main/p/pleazyng/pleazyng_${version}.orig.tar.gz"
          status="$(curl --silent --show-error --location --output "$orig" --write-out '%{http_code}' "$orig_url")"
          if [[ "$status" == "200" ]]; then
            tar -xzf "$orig" -C "$work"
            test -d "$source_dir"
            for asset in pleazyng-linux-x64.tar.gz pleazyng-linux-arm64.tar.gz; do
              cmp "$source_dir/$asset" "$RUNNER_TEMP/pleazyng-ppa/assets/$asset" || {
                echo "Existing PPA orig tarball does not contain release asset $asset" >&2
                exit 1
              }
            done
            source_flag="-sd"
          elif [[ "$status" == "404" ]]; then
            rm -f "$orig"
            mkdir -p "$source_dir"
            cp "$RUNNER_TEMP/pleazyng-ppa/assets/pleazyng-linux-x64.tar.gz" "$source_dir/"
            cp "$RUNNER_TEMP/pleazyng-ppa/assets/pleazyng-linux-arm64.tar.gz" "$source_dir/"
            cp linux/packaging/pleazyng.sh linux/packaging/org.snapetech.pleazyng.desktop assets/pleazyng.png LICENSE "$source_dir/"
            # Deterministic so parallel series jobs produce identical bytes.
            orig_epoch="$(git log -1 --format=%ct)"
            tar --sort=name --mtime="@$orig_epoch" --owner=0 --group=0 --numeric-owner \
              -cf - -C "$work" "$source_name" | gzip -n -9 > "$orig"
            source_flag="-sa"
          else
            echo "Unable to query existing orig tarball ($status): $orig_url" >&2
            exit 1
          fi
          mkdir -p "$source_dir/debian"
          cp -a .ppa-recipe/linux/packaging/ppa/debian/. "$source_dir/debian/"
          [[ "$PPA_REVISION" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid PPA revision: $PPA_REVISION" >&2; exit 1; }
          ppa_version="${version}-1ppa${PPA_REVISION}~${UBUNTU_SERIES}1"
          cat > "$source_dir/debian/changelog" <<EOF
          pleazyng (${ppa_version}) ${UBUNTU_SERIES}; urgency=medium

            * Publish Pleazyng ${RELEASE_TAG}.

           -- SnapeTech <noreply@github.com>  $(date -R)
          EOF
          cd "$source_dir"
          # Launchpad rejects binaries with pre-1980 file times only after a
          # full remote build; run the real install recipe for each arch first.
          SOURCE_DATE_EPOCH="$(dpkg-parsechangelog -STimestamp)"
          export SOURCE_DATE_EPOCH
          for arch in amd64 arm64; do
            make -s -f debian/rules override_dh_auto_install DEB_HOST_ARCH="$arch"
            stale="$(find debian/pleazyng ! -newermt 1980-01-02 -print | head -5)"
            rm -rf debian/pleazyng
            [[ -z "$stale" ]] || { printf 'Pre-1980 file times in %s package:\n%s\n' "$arch" "$stale" >&2; exit 1; }
          done
          dpkg-buildpackage -S "$source_flag" -d -k"$GPG_FINGERPRINT"
          changes="$(find "$work" -maxdepth 1 -type f -name "pleazyng_${ppa_version}_source.changes" -print -quit)"
          test -n "$changes" && test -s "$changes"
          dput -f pleazyng-ppa "$changes"
