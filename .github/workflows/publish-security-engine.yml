name: Publish fixed Windows engine
on:
  workflow_run:
    workflows: ['Flutter security engine']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  publish:
    if: >-
      github.repository == 'snapetech-org/pleazyng' &&
      github.event.workflow_run.repository.id == 1433487464 &&
      github.event.workflow_run.head_repository.id == 1433487464 &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Authenticate producer and verify both immutable engine artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/flutter/qualify_security_engine_run.py --run-id "$PRODUCER_RUN_ID" --output build/security-engine
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-security-engine-receipt
          path: build/security-engine/qualification.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified assets without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag=flutter-security-3.47.8
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Immutable fixed engine release already exists; refusing replacement." >&2
            exit 1
          fi
          gh release create "$tag" \
            build/security-engine/flutter-security-engine-x64/* \
            build/security-engine/flutter-security-engine-arm64/* \
            --target "$RUN_HEAD" --latest=false --title "Pleazyng Windows Flutter 3.47.8 engine components" \
            --notes "Build components for Pleazyng's Windows Flutter cache, not app installers. Pinned Flutter 3.47.8/Dart 3.13.7 with DComp and resize patches. Verify SHA-256 sidecars and embedded provenance."
