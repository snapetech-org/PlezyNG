name: Reconcile published release metadata
on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
  actions: read
  attestations: read
concurrency:
  group: published-release-metadata
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'snapetech-org/pleazyng' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Reconcile latest complete release on fresh main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/reconcile_release_metadata.py --scratch "$RUNNER_TEMP/release-metadata"
      - name: Retain verification and retry evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-metadata-verification
          path: |
            ${{ runner.temp }}/release-metadata/*.json
            ${{ runner.temp }}/release-metadata/*.patch
          retention-days: 30
