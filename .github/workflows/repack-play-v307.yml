name: Repack existing v3.0.7 for Play167
on:
  workflow_dispatch:
permissions:
  contents: read
  attestations: write
  id-token: write
concurrency:
  group: play-v307-store-repack167
  cancel-in-progress: false
jobs:
  repack:
    # Java/ZIP/API processing only; all original Android ABI payloads are copied.
    # Native x86_64 emulator qualification stays in qualify-play-existing.yml.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Authenticate original release and official manifest tooling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(gh release view v3.0.7 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          mkdir -p "$RUNNER_TEMP/play-source" "$RUNNER_TEMP/play-tools" "$RUNNER_TEMP/play-repack"
          gh release download v3.0.7 --repo "$GITHUB_REPOSITORY" --pattern pleazyng-android-play.aab --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/play-source"
          python3 scripts/verify_release_attestation.py "$RUNNER_TEMP/play-source/SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY"
          (cd "$RUNNER_TEMP/play-source" && sha256sum --check --ignore-missing SHA256SUMS.txt)
          curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/play-tools/bundletool.jar"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/play-tools/bundletool.jar" | sha256sum --check
      - name: Check real signature rejection and authentication
        run: BUNDLETOOL_JAR="$RUNNER_TEMP/play-tools/bundletool.jar" python3 scripts/checks/test_play_repack_signer.py
      - name: Repack only the reserved store version code
        run: |
          set -euo pipefail
          python3 scripts/stores/repack_play_v307.py "$RUNNER_TEMP/play-source/pleazyng-android-play.aab" \
            --bundletool "$RUNNER_TEMP/play-tools/bundletool.jar" \
            --output "$RUNNER_TEMP/play-repack/unsigned.aab" --receipt "$RUNNER_TEMP/play-repack/receipt.json"
          java -jar "$RUNNER_TEMP/play-tools/bundletool.jar" validate --bundle="$RUNNER_TEMP/play-repack/unsigned.aab" > "$RUNNER_TEMP/play-repack/validation.txt"
      - name: Sign using the existing upload identity and verify every payload
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          keyfile=$(mktemp "$RUNNER_TEMP/pleazyng-upload-XXXXXX.jks")
          trap 'rm -f "$keyfile"' EXIT
          python3 - "$keyfile" <<'PY'
          import base64,os,sys
          from pathlib import Path
          Path(sys.argv[1]).write_bytes(base64.b64decode(''.join(os.environ['ANDROID_KEYSTORE_BASE64'].split()), validate=True))
          PY
          jarsigner -keystore "$keyfile" -storepass:env ANDROID_STORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD \
            -signedjar "$RUNNER_TEMP/play-repack/pleazyng-3.0.7-store167.aab" "$RUNNER_TEMP/play-repack/unsigned.aab" "$ANDROID_KEY_ALIAS"
          mkdir -p "$RUNNER_TEMP/play-tools/classes"
          javac -cp "$RUNNER_TEMP/play-tools/bundletool.jar" -d "$RUNNER_TEMP/play-tools/classes" scripts/stores/ReversionPlayManifest.java
          java -cp "$RUNNER_TEMP/play-tools/classes:$RUNNER_TEMP/play-tools/bundletool.jar" ReversionPlayManifest verify-signer \
            "$RUNNER_TEMP/play-repack/pleazyng-3.0.7-store167.aab" bb0faa2caf87c6deb129e994567bc80dcf5c652761b3ab783dd475ccfe51d9ac
          python3 scripts/stores/repack_play_v307.py "$RUNNER_TEMP/play-source/pleazyng-android-play.aab" \
            --bundletool "$RUNNER_TEMP/play-tools/bundletool.jar" --output "$RUNNER_TEMP/play-repack/pleazyng-3.0.7-store167.aab" \
            --receipt "$RUNNER_TEMP/play-repack/receipt.json" --verify-signed
          java -jar "$RUNNER_TEMP/play-tools/bundletool.jar" validate --bundle="$RUNNER_TEMP/play-repack/pleazyng-3.0.7-store167.aab" >> "$RUNNER_TEMP/play-repack/validation.txt"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ runner.temp }}/play-repack/pleazyng-3.0.7-store167.aab
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Save only an internal draft
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_REPACK_RECEIPT: ${{ runner.temp }}/play-repack/receipt.json
          PLAY_REPACK_AAB: ${{ runner.temp }}/play-repack/pleazyng-3.0.7-store167.aab
        run: bundle exec ruby scripts/stores/publish_repacked_play_v307.rb
      - name: Retain compact recovery receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: play-v307-store167-receipt
          path: |
            ${{ runner.temp }}/play-repack/receipt.json
            ${{ runner.temp }}/play-repack/validation.txt
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: play-v307-store167-signed-bundle
          path: ${{ runner.temp }}/play-repack/pleazyng-3.0.7-store167.aab
          retention-days: 30
