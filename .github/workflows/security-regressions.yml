name: Security regressions

# Trusted main only. Public PRs need the separately isolated, restricted-egress
# sandbox required by AGENTS.md; never route them to trusted private runners.
on:
  push:
    branches: [main, 'audit-remediation/**']
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-regressions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  server:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/audit-remediation/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Server and edge regressions
        run: |
          (cd server && go test -race ./... && go vet ./...)
          node --test server/cloudflare-oauth/worker.test.mjs
          python3 -m unittest discover -s tools/karaoke_companion -p 'test_*.py'
          python3 -m unittest discover -s tools/lending_gateway -p 'test_*.py'
          python3 -m unittest discover -s scripts/checks -p test_release_signing_options.py
      - name: Workflow and locale controls
        run: |
          python3 scripts/checks/check_workflow_security.py
          python3 scripts/checks/check_workflow_action_pins.py
          python3 scripts/checks/check_localizations.py
      - name: Go vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          (cd server && govulncheck ./...)

  dart:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/audit-remediation/')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DASH__SUPPRESS_ANALYTICS: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: false
      - name: Resolve the committed dependency graph
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang build-essential cmake ffmpeg
          flutter pub get --enforce-lockfile
      - name: Prefetch pinned native test libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_native_downloads.py --sqlite-platform linux --arch x64
      - name: Analyze maintained Dart code
        run: flutter analyze --no-pub
      - name: Run security and ownership regressions
        run: |
          flutter test --no-pub -j 2 --timeout=180s \
            test/utils/bounded_http_response_test.dart \
            test/utils/structured_log_redaction_test.dart \
            test/utils/log_redaction_manager_test.dart \
            test/utils/media_server_http_client_get_bytes_test.dart \
            test/utils/media_server_http_client_redirects_test.dart \
            test/utils/media_server_http_client_timeouts_test.dart \
            test/utils/media_server_http_client_shutdown_test.dart \
            test/services/image_cache_service_test.dart \
            test/services/trackers/tracker_http_client_test.dart \
            test/services/cloud_settings_backup_service_test.dart \
            test/services/webos_secure_storage_recovery_test.dart \
            test/profiles \
            test/screens/profile/profile_switch_screen_test.dart \
            test/android/network_security_config_test.dart \
            test/sources/source_transport_lifecycle_test.dart \
            test/sources/network_media_stream_server_test.dart
      - name: Run the complete Dart and widget suite
        # Main, manual and scheduled runs always exercise the whole app.
        # Short-lived audit branches can validate isolated follow-up changes.
        if: github.ref == 'refs/heads/main' || github.event_name != 'push'
        run: scripts/run_tests.sh --no-pub -j 2 --timeout=180s
      - name: Run all repository checker regressions with Dart available
        run: python3 -m unittest discover -s scripts/checks -p 'test_*.py'
      - name: Format maintained Dart sources
        if: always()
        run: |
          scripts/format_dart.sh
          dart format packages/webos_plugins/flutter_secure_storage_webos/lib
          git diff --binary > dart-format.patch
      - name: Preserve formatting corrections for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dart-format-patch
          path: dart-format.patch
          retention-days: 7
      - name: Require canonical formatting
        run: git diff --exit-code
