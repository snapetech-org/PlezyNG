# One-time first-publication bootstrap of the existing immutable v3.0.7 AAB.
name: Stage existing v3.0.7 Play internal draft
on:
  workflow_dispatch:
permissions:
  contents: read
  attestations: read
concurrency:
  group: app-store-existing-v307-internal-draft
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Authenticate original published release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(gh release view v3.0.7 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          mkdir -p "$RUNNER_TEMP/play-stage"
          gh release download v3.0.7 --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/play-stage"
          python3 scripts/verify_release_attestation.py "$RUNNER_TEMP/play-stage/SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY"
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Stage only the existing166 internal draft
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_CHECKSUM_MANIFEST: ${{ runner.temp }}/play-stage/SHA256SUMS.txt
          PLAY_STAGE_RECEIPT: ${{ runner.temp }}/play-stage/internal-draft.json
        run: bundle exec ruby scripts/stores/stage_existing_play_internal.rb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: play-existing166-internal-draft
          path: ${{ runner.temp }}/play-stage
