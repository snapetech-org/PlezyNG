# ng-runner-policy: hosted-first-v1
name: Samsung Tizen TV
run-name: ${{ format('action:{0}:pool:{1}', inputs.action, inputs.runner_pool) }}

# Use compatible hosted Ubuntu by default; the private profile remains available
# for tasks that require private network, storage, or provisioned SDK resources.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Tizen build and validation action
        required: true
        type: choice
        options: [tizen]
      runner_pool:
        description: Private broker pool for jobs that need constrained resources
        required: true
        type: choice
        options: [private]
      execution_profile:
        description: Use hosted Ubuntu for compatible Tizen work or private JIT for constrained resources
        required: true
        type: choice
        options: [private, hybrid]
        default: hybrid
      build_package:
        description: Build an experimental ARM tester TPK after validation
        type: boolean
        default: false
      tester_build:
        description: Build without a TV certificate; recipient must re-sign
        type: boolean
        default: true
      architecture:
        description: ARM TV or x64 emulator (emulator is never a catalogue asset)
        type: choice
        options: [arm, x64]
        default: arm
      store_build:
        description: Build Samsung Checkout trial/unlock (requires DPI credentials and partner certificate)
        type: boolean
        default: false
      security_profile:
        description: Existing profile; non-tester builds import the encrypted Samsung bundle
        type: string
      include_seller_office_handoff:
        description: Prepare a Seller Office handoff bundle after separate approval
        type: boolean
        default: false
  workflow_call:
    inputs:
      execution_profile:
        description: Use hosted Ubuntu for compatible Tizen work or private JIT for constrained resources
        type: string
        required: false
        default: hybrid
      build_package:
        description: Build the TPK after validation
        type: boolean
        required: false
        default: true
      architecture:
        description: ARM TV or x64 emulator
        type: string
        required: false
        default: arm
      tester_build:
        description: Build with a development profile; the recipient must re-sign for a TV
        type: boolean
        required: false
        default: true
      store_build:
        description: Build Samsung Checkout trial/unlock (requires DPI credentials and partner certificate)
        type: boolean
        default: false
      security_profile:
        description: Existing Samsung profile name
        type: string
        required: false
        default: ""
      include_seller_office_handoff:
        description: Prepare a Seller Office handoff bundle after separate approval
        type: boolean
        required: false
        default: false
    secrets:
      SAMSUNG_TIZEN_PROFILE_ARCHIVE_B64:
        required: false
      SAMSUNG_DPI_APP_ID:
        required: false
      SAMSUNG_DPI_SECURITY_KEY:
        required: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ inputs.execution_profile == 'hybrid' && github.run_attempt > 1 && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-pleazyng","ng-main-run-{0}","gha-{0}-validate"]}}', github.run_id)) || inputs.execution_profile == 'hybrid' && 'ubuntu-24.04' || fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-pleazyng","ng-main-run-{0}","gha-{0}-validate"]}}', github.run_id)) }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify staged Tizen source compatibility
        run: python3 scripts/tizen/package.py preflight
      - name: Install Tizen host test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          packages=(clang cmake build-essential python3 pkg-config)
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 \
              && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 "${packages[@]}"; then
              break
            fi
            if (( attempt == 3 )); then exit 1; fi
            sudo apt-get clean
            sudo rm -rf /var/lib/apt/lists/*
            sleep $((attempt * 15))
          done
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          cache: true
          pub-cache: false
      - name: Verify host validation compiler
        run: command -v clang
      - run: flutter pub get --enforce-lockfile
      - name: Prefetch checksum-pinned host native test libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_native_downloads.py --sqlite-platform linux --arch x64
      - run: python3 -m unittest discover -s scripts/tizen -p 'test_*.py' -v
      - run: flutter test test/mpv/player_tizen_test.dart test/mpv/webos_media_proxy_test.dart test/media/tizen_playback_profile_test.dart
      - run: flutter test --dart-define=PLEZY_TIZEN=true test/utils/tizen_platform_test.dart test/services/tizen_plex_playback_test.dart

  package:
    needs: validate
    if: inputs.build_package && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ inputs.execution_profile == 'hybrid' && github.run_attempt > 1 && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-pleazyng","ng-main-run-{0}","gha-{0}-package"]}}', github.run_id)) || inputs.execution_profile == 'hybrid' && 'ubuntu-24.04' || fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-pleazyng","ng-main-run-{0}","gha-{0}-package"]}}', github.run_id)) }}
    timeout-minutes: 60
    env:
      TESTER_BUILD: ${{ inputs.tester_build }}
      PLEZYNG_TIZEN_STUDIO_ROOT: ${{ vars.PLEZYNG_TIZEN_STUDIO_ROOT }}
      TAR_OPTIONS: --no-same-owner
      PLEZY_FLUTTER_TIZEN_ROOT: ${{ vars.PLEZYNG_FLUTTER_TIZEN_ROOT }}
      TIZEN_CMAKE_TOOLCHAIN_ARM: ${{ vars.PLEZYNG_TIZEN_TOOLCHAIN_ARM }}
      TIZEN_CMAKE_TOOLCHAIN_X64: ${{ vars.PLEZYNG_TIZEN_TOOLCHAIN_X64 }}
      PACKAGE_ARCH: ${{ inputs.architecture }}
      SIGNING_PROFILE: ${{ inputs.security_profile }}
      PLEZYNG_ALLOW_DIRECT_DOWNLOADS: ${{ inputs.execution_profile == 'hybrid' && github.run_attempt == 1 && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify staged Tizen source compatibility
        run: python3 scripts/tizen/package.py preflight
      - name: Install Tizen host build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          packages=(build-essential ca-certificates clang cmake curl git-lfs pkg-config python3 unzip zip)
          if ! command -v rustup >/dev/null; then packages+=(rustup); fi
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 \
              && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 "${packages[@]}"; then
              break
            fi
            if (( attempt == 3 )); then exit 1; fi
            sudo apt-get clean
            sudo rm -rf /var/lib/apt/lists/*
            sleep $((attempt * 15))
          done
          clang --version
          cmake --version
          git lfs version
          command -v rustup
          rustup --version
          if [[ -z "${HTTPS_PROXY:-${https_proxy:-}}" && "$PLEZYNG_ALLOW_DIRECT_DOWNLOADS" != 1 ]]; then
            echo "The private JIT HTTPS proxy is required to fetch the pinned Samsung SDK packages." >&2
            exit 1
          fi
      - name: Ignore private Tizen toolchain paths on hosted runners
        if: ${{ inputs.execution_profile == 'hybrid' && github.run_attempt == 1 }}
        shell: bash
        run: |
          {
            echo 'PLEZYNG_TIZEN_STUDIO_ROOT='
            echo 'PLEZY_FLUTTER_TIZEN_ROOT='
            echo 'TIZEN_CMAKE_TOOLCHAIN_ARM='
            echo 'TIZEN_CMAKE_TOOLCHAIN_X64='
          } >> "$GITHUB_ENV"
      - name: Check out the pinned Flutter-Tizen tool
        if: ${{ (inputs.execution_profile == 'hybrid' && github.run_attempt == 1) || env.PLEZY_FLUTTER_TIZEN_ROOT == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: flutter-tizen/flutter-tizen
          ref: 22bcec9058fbe1e0943e6c6fda21792f24868e91
          path: .tizen-toolchain/flutter-tizen
          persist-credentials: false
      - name: Check out its pinned Flutter framework
        if: ${{ (inputs.execution_profile == 'hybrid' && github.run_attempt == 1) || env.PLEZY_FLUTTER_TIZEN_ROOT == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: flutter/flutter
          ref: 6a19cca56475dbfba1478ee68d7bd0c2ef891da1
          path: .tizen-toolchain/flutter-tizen/flutter
          persist-credentials: false
      - name: Restore the pinned Flutter release tag for SDK version detection
        if: ${{ (inputs.execution_profile == 'hybrid' && github.run_attempt == 1) || env.PLEZY_FLUTTER_TIZEN_ROOT == '' }}
        shell: bash
        run: |
          set -euo pipefail
          flutter_dir=.tizen-toolchain/flutter-tizen/flutter
          flutter_tag=$(python3 -c 'import json; print(json.load(open("scripts/tizen/toolchain.json"))["flutter_version_tag"])')
          flutter_revision=$(python3 -c 'import json; print(json.load(open("scripts/tizen/toolchain.json"))["flutter_revision"])')
          test "$(git -C "$flutter_dir" rev-parse HEAD)" = "$flutter_revision"
          # actions/checkout fetched only the pinned commit, so Flutter otherwise
          # reports 0.0.0-unknown and flutter-tizen cannot resolve flutter_test.
          git -C "$flutter_dir" fetch --depth=1 origin "refs/tags/$flutter_tag:refs/tags/$flutter_tag"
          test "$(git -C "$flutter_dir" describe --tags --exact-match HEAD)" = "$flutter_tag"
      - name: Resolve toolchain and provision the isolated ARM SDK when needed
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PLEZY_FLUTTER_TIZEN_ROOT" ]]; then
            echo "PLEZY_FLUTTER_TIZEN_ROOT=$PWD/.tizen-toolchain/flutter-tizen" >> "$GITHUB_ENV"
          fi
          if [[ -n "$PLEZYNG_TIZEN_STUDIO_ROOT" ]]; then
            test -x "$PLEZYNG_TIZEN_STUDIO_ROOT/tools/ide/bin/tizen"
            echo "TIZEN_SDK=$PLEZYNG_TIZEN_STUDIO_ROOT" >> "$GITHUB_ENV"
            echo "$PLEZYNG_TIZEN_STUDIO_ROOT/tools/ide/bin" >> "$GITHUB_PATH"
          fi
          if [[ "$TESTER_BUILD" != true ]]; then
            test -n "$SIGNING_PROFILE" && test -n "$PLEZYNG_TIZEN_STUDIO_ROOT" || { echo 'A non-tester build requires a provisioned Samsung SDK and signing profile.'; exit 1; }
            if [[ "$PACKAGE_ARCH" == arm ]]; then test -f "$TIZEN_CMAKE_TOOLCHAIN_ARM"; else test -f "$TIZEN_CMAKE_TOOLCHAIN_X64"; fi
          fi
          if [[ "$PACKAGE_ARCH" == arm && -z "$TIZEN_CMAKE_TOOLCHAIN_ARM" ]]; then
            python3 scripts/tizen/bootstrap_linux.py --accept-license --directory "$RUNNER_TEMP/pleazyng-tizen-sdk"
            python3 - "$RUNNER_TEMP/pleazyng-tizen-sdk/build-environment.json" <<'PY'
          import json, os, sys
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, value in json.load(open(sys.argv[1])).items():
                  output.write(f'{key}={value}\n')
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              output.write(json.load(open(sys.argv[1]))['TIZEN_SDK'] + '/tools/ide/bin\n')
          PY
          fi
      - name: Materialize the Samsung signing profile for this job
        if: ${{ !inputs.tester_build }}
        shell: bash
        env:
          SAMSUNG_TIZEN_PROFILE_ARCHIVE_B64: ${{ secrets.SAMSUNG_TIZEN_PROFILE_ARCHIVE_B64 }}
          SIGNING_PROFILE: ${{ inputs.security_profile }}
          PROFILE_DESTINATION: ${{ runner.temp }}/pleazyng-tizen-signing
        run: |
          set -euo pipefail
          python3 scripts/tizen/prepare_signing_profile.py \
            --profile "$SIGNING_PROFILE" \
            --destination "$PROFILE_DESTINATION"
          tizen cli-config -g "default.profiles.path=$PROFILE_DESTINATION/profiles.xml"
      - name: Create a development profile for a tester handoff
        if: inputs.tester_build && inputs.security_profile == ''
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TIZEN_SDK:-}" || { echo 'Set TIZEN_SDK for a provisioned SDK.'; exit 1; }
          python3 scripts/tizen/package.py tester-profile --sdk-root "$TIZEN_SDK" --name Pleazyng-Tester
          echo 'SIGNING_PROFILE=Pleazyng-Tester' >> "$GITHUB_ENV"
      - name: Build native dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SIGNING_PROFILE" || { echo 'Select a profile or enable the development tester build.'; exit 1; }
          test -x "$PLEZY_FLUTTER_TIZEN_ROOT/bin/flutter-tizen"
          if [[ "$PACKAGE_ARCH" == arm ]]; then toolchain="$TIZEN_CMAKE_TOOLCHAIN_ARM"; else toolchain="$TIZEN_CMAKE_TOOLCHAIN_X64"; fi
          test -f "$toolchain" || { echo 'A Samsung compiler/sysroot CMake toolchain is required.'; exit 1; }
          python3 scripts/tizen/package.py native --arch "$PACKAGE_ARCH" --toolchain "$toolchain" --output build/tizen-native
      - name: Build app-pinned MilkRust runtime and source bundle
        shell: bash
        run: |
          set -euo pipefail
          command -v rustup >/dev/null || { echo 'The build host must provide rustup.'; exit 1; }
          if [[ "$PACKAGE_ARCH" == arm ]]; then toolchain="$TIZEN_CMAKE_TOOLCHAIN_ARM"; else toolchain="$TIZEN_CMAKE_TOOLCHAIN_X64"; fi
          bundle="$RUNNER_TEMP/pleazyng-tizen-milkrust-$GITHUB_RUN_ID"
          python3 scripts/tizen/build_milkrust.py --arch "$PACKAGE_ARCH" --toolchain "$toolchain" --output "$bundle"
          digest=$(python3 -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "$bundle/milkrust-native.json")
          printf 'PLEZY_TIZEN_MILKRUST_BUNDLE=%s\nPLEZY_TIZEN_MILKRUST_MANIFEST_SHA256=%s\n' "$bundle" "$digest" >> "$GITHUB_ENV"
      - name: Build and inspect signed TV package
        env:
          STORE_BUILD: ${{ inputs.store_build }}
          SAMSUNG_DPI_APP_ID: ${{ secrets.SAMSUNG_DPI_APP_ID }}
          SAMSUNG_DPI_SECURITY_KEY: ${{ secrets.SAMSUNG_DPI_SECURITY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          options=()
          if [[ "$TESTER_BUILD" == true ]]; then options+=(--tester); fi
          if [[ "$STORE_BUILD" == true ]]; then options+=(--store); fi
          python3 scripts/tizen/package.py build \
            --sdk "$PLEZY_FLUTTER_TIZEN_ROOT" --arch "$PACKAGE_ARCH" \
            --native build/tizen-native --security-profile "$SIGNING_PROFILE" \
            --visualizer-native "$PLEZY_TIZEN_MILKRUST_BUNDLE" \
            --visualizer-manifest-sha256 "$PLEZY_TIZEN_MILKRUST_MANIFEST_SHA256" \
            --output build/tizen-release "${options[@]}"
          cp scripts/tizen/package.py scripts/tizen/toolchain.json docs/maintainers/tizen-tester.md build/tizen-release/
      - name: Preserve a failed Tizen package for diagnosis
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pleazyng-tizen-unverified-diagnostics
          path: build/tizen-release/diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare Samsung TV Seller Office handoff bundle
        if: ${{ !inputs.tester_build && inputs.architecture == 'arm' && inputs.include_seller_office_handoff }}
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION=$(python3 scripts/pubspec_version.py pubspec.yaml)
          VERSION=${VERSION%%+*}
          python3 scripts/tv_store_submission.py --store samsung \
            --package build/tizen-release/pleazyng-tizen-arm.tpk \
            --version $VERSION --source-commit $SOURCE_COMMIT \
            --evidence build/tizen-release/pleazyng-tizen-arm.tpk.sha256 \
            --evidence build/tizen-release/pleazyng-tizen-arm.tpk.json \
            --evidence build/tizen-release/pubspec-tizen.lock \
            --evidence build/tizen-release/pleazyng-tizen-arm-native-sources.tar.gz \
            --output build/tizen-release/Pleazyng-samsung-tv-submission.zip
      - name: Upload Samsung TV Seller Office handoff bundle
        if: ${{ !inputs.tester_build && inputs.architecture == 'arm' && inputs.include_seller_office_handoff }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pleazyng-samsung-tv-store-submission
          path: build/tizen-release/Pleazyng-samsung-tv-submission.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pleazyng-tizen-${{ inputs.architecture }}-experimental
          path: build/tizen-release/
          if-no-files-found: error
          retention-days: 14
      - name: Remove ephemeral Samsung signing material
        if: ${{ always() && !inputs.tester_build }}
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/pleazyng-tizen-signing"
