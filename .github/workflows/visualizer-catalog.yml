name: Authenticated visualizer catalog
on:
  push:
    branches: [main]
    paths:
      - content/visualizer-catalog-source.json
      - scripts/visualizer/publish_catalog.py
      - scripts/visualizer/sigstore/**
      - .github/workflows/visualizer-catalog.yml
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visualizer-catalog-main-macos
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'snapetech-org/pleazyng' && github.ref == 'refs/heads/main'
    runs-on: macos-26-intel
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install immutable official signer
        run: |
          mkdir -p "$RUNNER_TEMP/catalog-tools"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-darwin-amd64 \
            --output "$RUNNER_TEMP/catalog-tools/cosign"
          python3 -c 'import hashlib, pathlib, sys; assert hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest() == "9d1e4abe2b6be279ed0d2ff706fde1ccd738747c834e3e6d44039c238867334f"' "$RUNNER_TEMP/catalog-tools/cosign"
          chmod 755 "$RUNNER_TEMP/catalog-tools/cosign"
      - name: Prepare the reviewed catalog
        run: python3 scripts/visualizer/publish_catalog.py prepare
      - name: Sign with the canonical workflow identity
        run: |
          "$RUNNER_TEMP/catalog-tools/cosign" sign-blob --yes \
            --oidc-provider github-actions \
            --signing-config scripts/visualizer/sigstore/signing-config.json \
            --trusted-root scripts/visualizer/sigstore/trusted-root.json \
            --bundle build/visualizer-catalog/bundle.json build/visualizer-catalog/message.bin
      - name: Independently verify the publisher and signed bytes
        run: |
          "$RUNNER_TEMP/catalog-tools/cosign" verify-blob \
            --trusted-root scripts/visualizer/sigstore/trusted-root.json \
            --certificate-identity 'https://github.com/snapetech-org/pleazyng/.github/workflows/visualizer-catalog.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --bundle build/visualizer-catalog/bundle.json build/visualizer-catalog/message.bin
          python3 scripts/visualizer/publish_catalog.py wrap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: authenticated-visualizer-catalog
          path: build/visualizer-catalog
          retention-days: 30
          if-no-files-found: error
      - name: Publish with a compare-and-swap on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/visualizer/publish_catalog.py publish
