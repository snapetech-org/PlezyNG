name: Workspace recovery validation
on:
  push:
    branches: [main]
    paths:
      - lib/multiview/**
      - lib/sources/source_database.dart
      - lib/sources/source_playback.dart
      - lib/screens/sources/publication_reader_screen.dart
      - test/sources/source_recovery_test.dart
      - lib/screens/video_player/parts/pip.dart
      - lib/screens/video_player_screen.dart
      - lib/utils/video_player_navigation.dart
      - test/multiview/**
      - .github/workflows/workspace-recovery-validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: false
      - run: flutter pub get --enforce-lockfile
      - name: Prefetch pinned test libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_native_downloads.py --sqlite-platform linux --arch x64
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub test/multiview test/utils/video_player_navigation_test.dart test/sources/source_recovery_test.dart test/sources/source_playback_test.dart
      - name: Produce canonical maintained-source formatting
        if: always()
        run: |
          scripts/format_dart.sh
          python3 - <<'PY'
          import json, pathlib, subprocess
          for path in subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines():
              if path.endswith('.dart'):
                  print('DART_SOURCE ' + json.dumps({'path': path, 'content': pathlib.Path(path).read_text()}))
          PY
      - run: git diff --exit-code
