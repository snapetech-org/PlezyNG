# The Linux JIT guest has 8 GiB of RAM. Keep Kotlin in Gradle's JVM so a second
# daemon cannot push Android release packaging over the guest memory limit.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=1
android.useAndroidX=true
# All bundled dependencies use AndroidX. Jetifier also cannot process modern
# JVM-only test artifacts when Android lint builds dependency models.
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# The embedded Moonlight engine uses switch statements over resource IDs.
android.nonFinalResIds=false
