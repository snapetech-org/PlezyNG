# The Linux JIT guest has 8 GiB of RAM. Leave memory for NDK native compiler
# processes by limiting the Gradle/Kotlin in-process heap and serializing workers.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=1
android.useAndroidX=true
# All bundled dependencies use AndroidX. Jetifier also cannot process modern
# JVM-only test artifacts when Android lint builds dependency models.
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# The embedded Moonlight engine uses switch statements over resource IDs.
android.nonFinalResIds=false
