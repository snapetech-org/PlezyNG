# The private Android JIT has a 10 GiB memory cap. Bound both JVMs used during
# Kotlin builds so Gradle plus the Kotlin daemon stay within that limit.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1536m -XX:ReservedCodeCacheSize=384m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
org.gradle.workers.max=2
android.useAndroidX=true
# All bundled dependencies use AndroidX. Jetifier also cannot process modern
# JVM-only test artifacts when Android lint builds dependency models.
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# The embedded Moonlight engine uses switch statements over resource IDs.
android.nonFinalResIds=false
