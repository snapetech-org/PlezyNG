apply plugin: 'com.android.library'

def recipe = rootProject.file('../scripts/games/prepare_steam.py')
def steamPreparation = providers.exec {
    ignoreExitValue = true
    commandLine System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3', recipe.absolutePath
}
def steamPreparationResult = steamPreparation.result.get()
if (steamPreparationResult.exitValue != 0) {
    logger.error(steamPreparation.standardOutput.asText.get())
    logger.error(steamPreparation.standardError.asText.get())
}
steamPreparationResult.assertNormalExitValue()

android {
    namespace 'org.snapetech.plezyng.games.steam'
    compileSdk 37
    ndkVersion '29.0.14206865'
    defaultConfig {
        minSdk 25
        consumerProguardFiles 'consumer-rules.pro'
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild { cmake { path '../../native/games/steam/CMakeLists.txt'; version '3.22.1' } }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
