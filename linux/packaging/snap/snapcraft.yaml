name: pleazyng
title: Pleazyng
version: '0.0.0'
summary: Plex client with Jellyfin and Emby support, offline downloads, and HDR
description: |
  Pleazyng is an enhanced Plex client that also supports Jellyfin and Emby.
  Browse movies, shows, and music across your servers, search connected
  libraries, and keep watchlists and viewing progress in sync.

  Download media for offline playback. Watch Live TV and DVR where your server
  supports them. Choose audio tracks and subtitles, adjust playback speed and
  audio sync, and use HDR or Dolby Vision on supported devices.

  Watch Together keeps playback in sync when everyone can access the same media
  on the same server. Use Pleazyng on phones, tablets, TVs, and desktop
  computers. You’ll need your own Plex, Jellyfin, or Emby server. Features vary
  by server, device, and media.
license: GPL-3.0-only
contact: https://github.com/snapetech-org/PlezyNG/issues
website: https://github.com/snapetech-org/PlezyNG
source-code: https://github.com/snapetech-org/PlezyNG
issues: https://github.com/snapetech-org/PlezyNG/issues
icon: gui/pleazyng.png
base: core24
grade: stable
confinement: strict

platforms:
  amd64:
    build-on: amd64
    build-for: amd64
  arm64:
    build-on: arm64
    build-for: arm64

apps:
  pleazyng:
    command: opt/pleazyng/pleazyng.sh
    desktop: usr/share/applications/org.snapetech.pleazyng.desktop
    plugs:
      - audio-playback
      - desktop
      - desktop-legacy
      - home
      - network
      - password-manager-service
      - opengl
      - removable-media
      - wayland
      - x11

slots:
  mpris:
    interface: mpris
    name: org_snapetech_pleazyng

parts:
  pleazyng:
    plugin: nil
    source: src
    override-build: |
      set -eu
      install -d "$CRAFT_PART_INSTALL/opt/pleazyng"
      cp -a "$CRAFT_PART_SRC"/. "$CRAFT_PART_INSTALL/opt/pleazyng/"
      install -Dm755 "$CRAFT_PROJECT_DIR/pleazyng.sh" "$CRAFT_PART_INSTALL/opt/pleazyng/pleazyng.sh"
      install -Dm644 "$CRAFT_PROJECT_DIR/pleazyng.desktop" "$CRAFT_PART_INSTALL/usr/share/applications/org.snapetech.pleazyng.desktop"
      install -Dm644 "$CRAFT_PROJECT_DIR/gui/pleazyng.png" "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps/pleazyng.png"
    stage-packages:
      - pulseaudio-utils
      - ffmpeg
      - libasound2t64
      - libdrm2
      - libegl1
      - libepoxy0
      - libevdev2
      - libgbm1
      - libglvnd0
      - libgtk-3-0t64
      - libwebkit2gtk-4.1-0
      - libglib2.0-0t64
      - libsecret-1-0
      - libva2
      - libva-drm2
      - libva-wayland2
      - libva-x11-2
      - libvdpau1
      - libvulkan1
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcb-dri3-0
      - libxcb-render0
      - libxcb-shm0
      - libxcb1
      - libxext6
